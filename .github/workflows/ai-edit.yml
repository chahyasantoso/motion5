name: AI edit

# Activation requires a reviewed runner SHA and the default-branch reporter.
# Candidate code has no writer token, persisted Git credential, or publication step.
on:
  push:
    branches-ignore: [main, ci-logs]
    paths: [".ai/edits/**"]
  workflow_dispatch:
    inputs:
      request:
        description: Sole pending request file
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-edit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare isolated candidate
    if: >-
      vars.MOTION5_AUTOMATION_SHA != '' &&
      (github.event_name == 'workflow_dispatch' ||
      !(github.event.head_commit.author.username == 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'AI-Edit-Request: .ai/edits/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRUSTED_SHA: ${{ vars.MOTION5_AUTOMATION_SHA }}
    steps:
      - name: Require an immutable reviewed runner
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.MOTION5_AUTOMATION_SHA }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install only the reviewed formatter outside the candidate tree
        run: |
          set -euo pipefail
          version="$(jq -r '.devDependencies.prettier' trusted/package.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --prefix "$RUNNER_TEMP/motion5-formatter" --ignore-scripts \
            --no-package-lock --no-audit --no-fund "prettier@$version"
      - name: Prepare with trusted code and configuration
        env:
          DISPATCH_REQUEST: ${{ inputs.request }}
        run: |
          set -euo pipefail
          export CANDIDATE_ROOT="$GITHUB_WORKSPACE/candidate"
          export FORMATTER_ROOT="$RUNNER_TEMP/motion5-formatter"
          export CANDIDATE_OUTPUT="$RUNNER_TEMP/candidate.json"
          node trusted/scripts/automation-publish.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ai-edit-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 14
