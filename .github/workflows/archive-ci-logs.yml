name: Archive CI logs

on:
  workflow_run:
    workflows: ["CI", "Recovery audit"]
    types: [completed]
    branches: [main, "rescue/**", "fix/**"]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed workflow run ID to archive"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  archive:
    name: archive failed logs and audit reports
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.name == 'Recovery audit' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out log branch
        uses: actions/checkout@v4
        with:
          ref: ci-logs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve run metadata
        id: run
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "workflow=${EVENT_WORKFLOW:-manual}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${EVENT_CONCLUSION:-manual}" >> "$GITHUB_OUTPUT"

      - name: Download job outcomes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "logs/$RUN_ID"
          gh run view "$RUN_ID" --json databaseId,name,headBranch,headSha,status,conclusion,createdAt,updatedAt \
            > "logs/$RUN_ID/run.json"
          # Step-level outcomes are always retrievable, even when no step log is.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            > "logs/$RUN_ID/jobs.json" || echo '{}' > "logs/$RUN_ID/jobs.json"

      - name: Download failed job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -uo pipefail
          LOG="logs/$RUN_ID/failed-jobs.log"
          # GitHub finalizes the log archive asynchronously, so an immediate request can
          # return an empty body for a run that definitely has failed steps.
          for attempt in 1 2 3 4 5 6; do
            gh run view "$RUN_ID" --log-failed > "$LOG" 2>&1 || true
            if test -s "$LOG"; then
              echo "captured failed-job output on attempt $attempt"
              break
            fi
            echo "attempt $attempt returned no failed-job output, waiting for the log archive"
            sleep 20
          done

      - name: Download audit artifacts
        if: steps.run.outputs.workflow == 'Recovery audit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "logs/$RUN_ID/audit-artifacts"
          gh run download "$RUN_ID" --dir "logs/$RUN_ID/audit-artifacts" || true

      - name: Write archive index
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -uo pipefail
          LOG="logs/$RUN_ID/failed-jobs.log"
          JOBS="logs/$RUN_ID/jobs.json"
          {
            echo "# CI log archive: $RUN_ID"
            echo
            echo "- Workflow: ${{ steps.run.outputs.workflow }}"
            echo "- Conclusion: ${{ steps.run.outputs.conclusion }}"
            echo "- Source run: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
            echo "- Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Detailed failed-job output: [failed-jobs.log](./failed-jobs.log)"
            echo "Job and step outcomes: [jobs.json](./jobs.json)"
            if test -d "logs/$RUN_ID/audit-artifacts" && find "logs/$RUN_ID/audit-artifacts" -type f -print -quit | grep -q .; then
              echo "Audit artifacts: [audit-artifacts/](./audit-artifacts/)"
            fi
            echo
            echo "## Job outcomes"
            echo
            jq -r '
              (.jobs // [])[]
              | "- " + .name + ": " + (.conclusion // "unknown")
                + ((([(.steps // [])[]
                      | select(.conclusion != "success" and .conclusion != "skipped")
                      | .name + " (" + (.conclusion // "unknown") + ")"] | join("; ")) as $bad
                    | if $bad == "" then "" else " — failed steps: " + $bad end))
            ' "$JOBS" 2>/dev/null || echo "- job outcomes unavailable"
            echo
            echo "## Failed job output"
            echo
            if test -s "$LOG"; then
              echo '```text'
              tail -c 400000 "$LOG"
              echo '```'
            else
              echo "GitHub returned no failed-step log for this run. Read the job outcomes above."
            fi
          } > "logs/$RUN_ID/README.md"

      - name: Commit archive
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The log branch ignores *.log, so the failure output only lands with -f.
          git add -f "logs/$RUN_ID"
          git commit -m "ci: archive logs and audit report for run $RUN_ID" || echo "No new log files to commit"
          git push origin ci-logs
