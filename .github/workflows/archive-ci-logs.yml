name: Archive CI logs

on:
  workflow_run:
    workflows: ["CI", "Recovery audit"]
    types: [completed]
    # This filters the HEAD branch of the triggering run, not a base branch, so every prefix that
    # can open a pull request has to be listed. It previously stopped at fix/**, which is why
    # feat/** failures produced no archive and had to be dispatched by hand.
    branches:
      - main
      - "rescue/**"
      - "phase*/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "docs/**"
      - "perf/**"
      - "chore/**"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed workflow run ID to archive"
        required: true
        type: string

permissions:
  contents: write

# One archiver at a time. Two runs finishing together both commit to ci-logs, and the loser's push
# was simply rejected, so its archive was lost.
concurrency:
  group: archive-ci-logs
  cancel-in-progress: false

jobs:
  archive:
    name: archive failed logs
    # Real failures only. CI cancels stale runs on every PR push, and a cancelled run has no failed
    # jobs to capture, so archiving it committed an empty log under a misleading message.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out log branch
        uses: actions/checkout@v4
        with:
          ref: ci-logs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve run metadata
        id: run
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "workflow=${EVENT_WORKFLOW:-manual}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${EVENT_CONCLUSION:-manual}" >> "$GITHUB_OUTPUT"
          echo "branch=${EVENT_BRANCH:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Download failed job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          WORKFLOW: ${{ steps.run.outputs.workflow }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          BRANCH: ${{ steps.run.outputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "logs/$RUN_ID"
          gh run view "$RUN_ID" --log-failed > "logs/$RUN_ID/failed-jobs.log" 2>&1 || true
          gh run view "$RUN_ID" --json databaseId,name,headBranch,headSha,status,conclusion,createdAt,updatedAt \
            > "logs/$RUN_ID/run.json"
          {
            echo "# CI log archive: $RUN_ID"
            echo
            echo "- Workflow: $WORKFLOW"
            echo "- Head branch: $BRANCH"
            echo "- Conclusion: $CONCLUSION"
            echo "- Source run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
            echo "- Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Failed job output"
            echo
            echo '```text'
            cat "logs/$RUN_ID/failed-jobs.log"
            echo '```'
          } > "logs/$RUN_ID/README.md"

      - name: Commit archive
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "logs/$RUN_ID"
          if git diff --cached --quiet; then
            echo "Nothing staged for run $RUN_ID; archive already up to date."
            exit 0
          fi
          git commit -m "ci: archive logs for run $RUN_ID"
          for attempt in 1 2 3; do
            if git push origin ci-logs; then
              echo "Pushed archive for run $RUN_ID on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto the latest ci-logs."
            git pull --rebase origin ci-logs
          done
          echo "Could not push the archive for run $RUN_ID after three attempts."
          exit 1
