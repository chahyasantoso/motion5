# Repairs formatting in a separate PR. The implementation branch is never rewritten.
#
# This uses pull_request_target only for same-repository PRs. The job checks out the PR head
# explicitly, installs with scripts disabled, runs Prettier, and pushes only to a bot-owned
# chore branch. Fork PRs are excluded because this workflow has write permissions.
name: Format repair

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: format-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  format-repair:
    name: open formatting repair PR
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'chore/format-pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply formatter to a detached PR-head checkout
        run: npm run format
      - name: Open or update formatting repair PR
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          bot_branch="chore/format-pr-${PR_NUMBER}"
          if git diff --quiet; then
            echo "No formatting drift on ${SOURCE_PR}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${bot_branch}"
          git add -A
          git commit -m "chore: format PR #${PR_NUMBER}"
          # This branch is owned by this workflow and is intentionally rebuilt from the
          # current source PR head on every run. The source PR branch is never touched.
          git push --force origin "HEAD:${bot_branch}"

          existing="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${bot_branch}" \
            --base "${SOURCE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "Updated formatting repair PR #${existing}."
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${SOURCE_BRANCH}" \
            --head "${bot_branch}" \
            --title "chore: format PR #${PR_NUMBER}" \
            --body "Automated formatting-only repair for ${SOURCE_PR}. This PR targets the source PR branch and never rewrites it directly. Merge this PR, then rerun the source PR checks."
