name: Traceability audit

on:
  pull_request:
    # Unfiltered on purpose, exactly as in ci.yml: for pull_request, `branches:` filters the base
    # branch, so a list here would silently skip the gate for pull requests aimed at integration
    # branches. A gate that only runs for some bases is not a gate.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to audit
        required: false
        default: ""
        type: string

# No push trigger yet. main still carries the requirement-to-requirement rows this gate rejects,
# so arming it on push would paint main red for a reason main cannot fix on its own. Add
# `push: branches: [main]` in the follow-up that lands the corrected rows on main.

concurrency:
  group: traceability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  traceability:
    name: inbound traceability (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: mkdir -p audit-logs/traceability
      - name: Scan inbound traceability
        shell: bash
        # pipefail matters here. Without it the pipeline's exit code is tee's, which is always
        # zero, and the job would report success while the scan printed failures.
        run: |
          set -euo pipefail
          npm run test:traceability 2>&1 | tee audit-logs/traceability/result.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-audit-${{ github.run_id }}
          path: audit-logs/traceability/
          if-no-files-found: error
