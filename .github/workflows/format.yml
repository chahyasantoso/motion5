# Automatically formats pull requests opened from branches in this repository.
# Fork pull requests are never given write access; quality CI reports formatting drift.
name: Format

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  format-pr:
    name: prettier --write (same-repository PR)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply formatter
        run: npm run format
      - name: Commit formatting changes
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No formatting drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier"
          git push origin "HEAD:${TARGET_BRANCH}"
