# Manual only. This workflow is never triggered by push, pull request, or a
# schedule, and it never writes to a contributor branch. See docs/FORMATTING.md.
name: Format (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Open a formatting pull request, or only report the drift.
        type: choice
        default: pull-request
        options:
          - pull-request
          - report

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: prettier --write (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Apply formatter
        run: npm run format
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Already formatted
        if: steps.drift.outputs.changed == 'false'
        run: echo "No formatting drift. Nothing to do."
      - name: Report drift
        if: steps.drift.outputs.changed == 'true' && github.event.inputs.mode == 'report'
        run: |
          git --no-pager diff
          echo "Formatting drift detected. Run 'npm run format' locally and commit the result."
          exit 1
      - name: Open formatting pull request
        if: steps.drift.outputs.changed == 'true' && github.event.inputs.mode == 'pull-request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/format-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -u
          git commit -m "chore: apply prettier"
          git push origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" --title "chore: apply prettier" --body "Mechanical formatting only, produced by the manual format workflow. No behavior changes. Checks do not start automatically on token-authored pull requests: push an empty commit or reopen this to run CI."
