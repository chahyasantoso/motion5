# Automatically formats pull requests opened from branches in this repository.
# Fork pull requests are never given write access; quality CI reports formatting drift.
name: Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: Commit formatting directly, open a PR, or only report drift.
        type: choice
        default: direct-commit
        options:
          - direct-commit
          - pull-request
          - report

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  format-pr:
    name: prettier --write (same-repository PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply formatter
        run: npm run format
      - name: Commit formatting changes
        if: github.event.pull_request.head.ref != ''
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No formatting drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier"
          git push origin "HEAD:${TARGET_BRANCH}"

  format-manual:
    name: prettier --write (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply formatter
        run: npm run format
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Already formatted
        if: steps.drift.outputs.changed == 'false'
        run: echo "No formatting drift. Nothing to do."
      - name: Report drift
        if: steps.drift.outputs.changed == 'true' && inputs.mode == 'report'
        run: |
          git --no-pager diff
          echo "Formatting drift detected. Run 'npm run format' locally and commit the result."
          exit 1
      - name: Commit formatting directly
        if: steps.drift.outputs.changed == 'true' && inputs.mode == 'direct-commit'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Open formatting pull request
        if: steps.drift.outputs.changed == 'true' && inputs.mode == 'pull-request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/format-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: apply prettier"
          git push origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" --title "chore: apply prettier" --body "Mechanical formatting only, produced by the format workflow. No behavior changes."
