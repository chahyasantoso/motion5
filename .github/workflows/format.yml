# PR formatting now runs as the final CI job, after behavioral checks pass.
# This manual fallback cannot rewrite a red-test commit.
name: Format fallback (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to format
        required: true
        default: main
        type: string

concurrency:
  group: format-fallback-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  format:
    name: prettier --write (manual fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Prettier
        run: npm run format
      - name: Push formatting commit
        if: env.HAS_PAT == 'true'
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Report drift when PAT is unavailable
        if: env.HAS_PAT != 'true'
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git --no-pager diff
          echo "Formatting drift found, but PERSONAL_ACCESS_TOKEN is unavailable."
          exit 1
