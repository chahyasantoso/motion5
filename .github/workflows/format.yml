# Checks formatting on pull requests without mutating their head branches.
# A GITHUB_TOKEN push does not trigger another workflow run, so auto-committing
# here created unchecked heads. Formatting drift now fails this check and is
# fixed in the same PR commit that CI evaluates.
name: Format

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  format-pr:
    name: prettier --check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
