name: IK browser evidence (PR 351)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ik-browser-351
  cancel-in-progress: true

jobs:
  browser:
    if: github.event.pull_request.number == 351 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - id: identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ik-browser-tools" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.55.0
          node "$RUNNER_TEMP/ik-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise the actual IK application
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ik-browser-evidence"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { spawn, execFileSync } from "node:child_process";
          import { pathToFileURL } from "node:url";
          import os from "node:os";
          const root = process.cwd();
          const out = `${process.env.RUNNER_TEMP}/ik-browser-evidence`;
          const { chromium } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/ik-browser-tools/node_modules/playwright/index.mjs`).href);
          const required = ["initial", "stage.zero", "apply.partial", "stage.partial", "refresh.hold", "stationary.hold", "apply.next", "apply.full", "stage.full", "endpoint.hold", "endpoint.resume", "rest", "reload", "resize.hold"];
          const report = { tested_sha: process.env.TESTED_SHA, source_blob: execFileSync("git", ["rev-parse", "HEAD:packages/core/src/adapters/scroll-trigger-gsap.ts"], { encoding: "utf8" }).trim(), os: `${os.platform()} ${os.release()} ${os.arch()}`, playwright: "1.55.0", scope: "Actual IK app on PR 351; evidence linked to shared source PR 353", required, scenarios: [], errors: [] };
          const server = spawn(`${root}/node_modules/.bin/vite`, ["apps/ik-playground", "--host", "127.0.0.1", "--port", "4174", "--strictPort"], { stdio: ["ignore", "pipe", "pipe"] });
          let serverLog = "";
          for (const stream of [server.stdout, server.stderr]) stream.on("data", bytes => { serverLog = (serverLog + bytes.toString()).slice(-16000); });
          let browser; let context;
          try {
            let ready = false;
            for (let attempt = 0; attempt < 100; attempt++) {
              try { if ((await fetch("http://127.0.0.1:4174/")).ok) { ready = true; break; } } catch {}
              await new Promise(r => setTimeout(r, 200));
            }
            if (!ready) throw new Error("IK Vite server did not start");
            browser = await chromium.launch({ headless: true }); report.browser = browser.version();
            context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            await context.tracing.start({ screenshots: true, snapshots: true, sources: true });
            const page = await context.newPage();
            page.on("pageerror", error => { if (report.errors.length < 20) report.errors.push(String(error).slice(0,1000)); });
            page.on("console", message => { if (message.type() === "error" && report.errors.length < 20) report.errors.push(message.text().slice(0,1000)); });
            await page.goto("http://127.0.0.1:4174/");
            await page.waitForSelector("[data-pending-goal]", { timeout: 20000 });
            const bind = async () => page.evaluate(async () => {
              const resource = performance.getEntriesByType("resource").find(r => r.name.includes("/gsap_ScrollTrigger.js"));
              if (!resource) throw new Error("Cannot locate the app's actual ScrollTrigger module");
              const module = await import(resource.name);
              window.browserScrollTrigger = module.ScrollTrigger;
              return { version: module.ScrollTrigger.version, producers: module.ScrollTrigger.getAll().length };
            });
            report.gsap = await bind();
            const settle = () => page.waitForTimeout(350);
            const state = () => page.evaluate(() => {
              const bones = [...document.querySelectorAll('#stage line[stroke="#38bdf8"],#stage line[stroke="#34d399"],#stage line[stroke="#475569"]')].map(line => ["x1","y1","x2","y2"].map(key => Number(line.getAttribute(key))));
              return { weight: parseFloat(document.querySelector('[data-testid="ik-weight"]').textContent), pending: [...document.querySelectorAll("[data-pending-goal]")].map(e => e.getAttribute("transform")), applied: [...document.querySelectorAll("[data-applied-goal]")].map(e => [Number(e.getAttribute("cx")), Number(e.getAttribute("cy"))]), bones, lengths: bones.map(([x1,y1,x2,y2]) => Math.hypot(x2-x1,y2-y1)), rotations: [...document.querySelectorAll(".rot-row")].map(e => e.textContent), flips: [...document.querySelectorAll('.flip-toggle input')].map(e => e.checked), y: scrollY, producers: window.browserScrollTrigger.getAll().length };
            });
            const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
            const near = (a,b) => a.length === b.length && a.every((v,i) => Math.abs(v-b[i]) < 0.01);
            const check = (id, passed, observed) => report.scenarios.push({ id, passed: Boolean(passed), observed });
            const scroll = async p => { await page.evaluate(p => { const t = window.browserScrollTrigger.getAll()[0]; t.scroll(t.start + (t.end-t.start)*p); }, p); await settle(); };
            const stage = async () => {
              for (const goal of await page.locator('[data-pending-goal] [role="button"]').all()) await goal.press("Shift+ArrowRight");
              const flip = page.locator('.flip-toggle input').first(); await flip.setChecked(!(await flip.isChecked())); await settle();
            };
            await settle(); const rest = await state();
            check("initial", rest.weight === 0 && rest.bones.length === 10 && rest.producers === 1, rest);
            await stage(); const zero = await state();
            check("stage.zero", !same(zero.pending, rest.pending) && !same(zero.flips, rest.flips) && same(zero.applied, rest.applied) && same(zero.bones, rest.bones), zero);
            await scroll(0.5); const partial = await state();
            check("apply.partial", partial.weight > 40 && partial.weight < 60 && !same(partial.applied, rest.applied) && !same(partial.bones, rest.bones) && near(partial.lengths, rest.lengths), partial);
            await stage(); const staged = await state();
            check("stage.partial", !same(staged.pending, partial.pending) && same(staged.applied, partial.applied) && same(staged.bones, partial.bones), staged);
            await page.evaluate(() => { window.browserScrollTrigger.getAll()[0].refresh(); window.browserScrollTrigger.refresh(); }); await settle();
            const refreshed = await state();
            check("refresh.hold", same(refreshed.applied, staged.applied) && same(refreshed.bones, staged.bones) && same(refreshed.rotations, staged.rotations), refreshed);
            await page.evaluate(() => window.browserScrollTrigger.update()); await settle(); const stationary = await state();
            check("stationary.hold", same(stationary.applied, staged.applied) && same(stationary.bones, staged.bones), stationary);
            await scroll(0.6); const next = await state();
            check("apply.next", !same(next.applied, staged.applied) && next.weight >= 59 && next.weight <= 61 && near(next.lengths, rest.lengths), next);
            await scroll(1); const full = await state();
            check("apply.full", full.weight === 100 && near(full.lengths, rest.lengths), full);
            await stage(); const fullPending = await state();
            check("stage.full", !same(fullPending.pending, full.pending) && same(fullPending.applied, full.applied) && same(fullPending.bones, full.bones), fullPending);
            await page.screenshot({ path: `${out}/pending-at-full-weight.png` });
            // Extra space belongs to the test fixture, outside the real trigger element.
            await page.evaluate(() => { const footer = document.createElement("div"); footer.style.height = "600px"; document.body.append(footer); window.browserScrollTrigger.refresh(); }); await settle();
            await page.evaluate(() => { const t = window.browserScrollTrigger.getAll()[0]; t.scroll(t.end + 100); }); await settle(); const outside = await state();
            check("endpoint.hold", outside.y > fullPending.y && same(outside.applied, fullPending.applied) && same(outside.bones, fullPending.bones) && outside.weight === 100, outside);
            await scroll(0.8); const resumed = await state();
            check("endpoint.resume", !same(resumed.applied, fullPending.applied) && resumed.weight === 80 && near(resumed.lengths, rest.lengths), resumed);
            await scroll(0); const returned = await state();
            check("rest", returned.weight === 0 && returned.bones.every((bone,i) => near(bone,rest.bones[i])) && near(returned.lengths, rest.lengths), returned);
            await scroll(0.6); report.beforeReload = await state();
            await page.reload(); await page.waitForSelector("[data-pending-goal]"); await bind(); await settle();
            const reloaded = await state();
            check("reload", reloaded.y > 100 && reloaded.weight >= 59 && reloaded.weight <= 61 && reloaded.producers === 1, reloaded);
            await scroll(0.5); await stage(); const beforeResize = await state();
            await page.setViewportSize({ width: 950, height: 700 }); await page.waitForTimeout(700);
            const resized = await state();
            check("resize.hold", same(resized.applied,beforeResize.applied) && same(resized.bones,beforeResize.bones) && resized.producers === 1, { before: beforeResize, after: resized });
            await page.screenshot({ path: `${out}/resized-pending.png` });
          } catch (error) { report.errors.push(String(error).slice(0,2000)); }
          finally {
            if (context) { try { await context.tracing.stop({ path: `${out}/trace.zip` }); } catch (error) { report.errors.push(String(error)); } }
            if (browser) await browser.close(); server.kill("SIGTERM");
            const ids = report.scenarios.map(s => s.id);
            report.missing = required.filter(id => !ids.includes(id));
            report.passed = report.missing.length === 0 && ids.length === new Set(ids).size && report.scenarios.every(s => s.passed) && report.errors.length === 0;
            await writeFile(`${out}/report.json`, JSON.stringify(report,null,2));
            await writeFile(`${out}/server.log`,serverLog); console.log(JSON.stringify(report,null,2));
          }
          if (!report.passed) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ik-browser-351-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ik-browser-evidence
          retention-days: 7
          if-no-files-found: warn

  report:
    needs: browser
    if: always() && needs.browser.result != 'skipped' && needs.browser.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ik-browser-351-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/github-script@v7
        env:
          TESTED_SHA: ${{ needs.browser.outputs.tested_sha }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        with:
          script: |
            const fs = require("node:fs");
            const sha = process.env.TESTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error("Missing tested SHA");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 351 });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error("Unexpected source repository");
            let text = "Report unavailable; no browser pass claimed.";
            if (fs.existsSync("evidence/report.json")) {
              const stat = fs.lstatSync("evidence/report.json");
              if (!stat.isFile() || stat.size > 48000) throw new Error("Report exceeds the bounded regular-file contract");
              const report = JSON.parse(fs.readFileSync("evidence/report.json","utf8"));
              if (report.tested_sha !== sha) throw new Error("Report SHA mismatch");
              text = JSON.stringify(report,null,2);
            }
            const escaped = text.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("@","&#64;");
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const historical = pr.head.sha !== sha ? " Historical IK head, not current-head acceptance." : "";
            const body = `### IK consumer browser evidence for shared PR #353\n\nSource PR: #351. Tested commit: ${sha}. Browser job: **${process.env.BROWSER_RESULT}**.${historical}\n\n[Run, screenshots and trace](${url}) (7-day artifact retention). Tests use the actual IK app and installed GSAP/ScrollTrigger in Chromium. This is not a merge, issue closure, other-browser pass, or complete manual/mobile review.\n\n<details><summary>Bounded IK observations</summary>\n<pre>${escaped}</pre>\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: 353, body });
