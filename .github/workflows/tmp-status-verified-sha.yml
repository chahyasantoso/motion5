name: Temporary status sha correction

# Temporary and self-removing, on the same terms as the ADR-064 docs edit. The implementor cannot run
# `npx` or `prettier` at all, which docs/CI-WORKFLOW.md names as a normal condition rather than a
# broken setup, and this is a one-line correction inside a long prose file: retyping the file by hand
# to change one line risks a silent transcription error everywhere else in it, which no gate reads.
# The job runs one bounded script, applies Prettier to the one file it touches, and deletes both
# itself and the script in the commit it pushes. See docs/PR-WORKFLOW.md, "Temporary workflow edits".
#
# Scoped to one same-repository branch by name, so no fork pull-request code can reach it, and it
# holds the smallest permission that can push. The credential is the repository secret
# `.github/workflows/format.yml` already uses; nothing here prints it or puts it in an artifact.

on:
  push:
    branches: [docs/status-verified-sha]

permissions:
  contents: write

concurrency:
  group: tmp-status-verified-sha
  cancel-in-progress: false

jobs:
  edit:
    name: correct the Verified on sha
    if: github.ref_name == 'docs/status-verified-sha'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply the bounded edit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-status-verified-sha.py
          npx prettier --write docs/SESSION-STATUS.md
      - name: Commit the edit, remove this workflow, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q \
            scripts/tmp-status-verified-sha.py \
            .github/workflows/tmp-status-verified-sha.yml
          git add docs/SESSION-STATUS.md
          git commit -m "docs(status): pin Verified on to the sha that landed slice D"
          git push origin "HEAD:${GITHUB_REF_NAME}"
