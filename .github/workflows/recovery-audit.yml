name: Recovery audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to audit"
        required: true
        default: "main"
        type: string
      base:
        description: "Base for failing-first comparison, default first parent of ref"
        required: false
        default: ""
        type: string
      failing_first_exception:
        description: "Documented reason this ref adds no new behavioral test"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: declaration build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit declarations and check public entries
        run: |
          set -uo pipefail
          mkdir -p audit-logs audit-fragments dist-audit
          FRAGMENT=audit-fragments/50-build.md
          FAILED=0
          {
            echo "## build"
            echo
          } > "$FRAGMENT"
          if npx tsc -p tsconfig.json --declaration --emitDeclarationOnly --noEmit false --outDir dist-audit > audit-logs/declarations.log 2>&1; then
            echo "- declaration emit: pass" >> "$FRAGMENT"
          else
            echo "- declaration emit: FAIL" >> "$FRAGMENT"
            FAILED=1
          fi
          for declaration in dist-audit/packages/core/src/index.d.ts dist-audit/packages/react/src/index.d.ts; do
            if test -e "$declaration"; then
              echo "- $declaration: present" >> "$FRAGMENT"
            else
              echo "- $declaration: MISSING" >> "$FRAGMENT"
              FAILED=1
            fi
          done
          for manifest in packages/*/package.json; do
            dir=$(dirname "$manifest")
            pkg=$(node -p "require('./$manifest').name" 2>/dev/null || echo "$dir")
            types=$(node -p "const m=require('./$manifest');m.types||m.typings||''" 2>/dev/null || echo "")
            if [ -z "$types" ]; then
              echo "- $pkg types entry: MISSING" >> "$FRAGMENT"
              FAILED=1
            elif test -e "$dir/$types"; then
              echo "- $pkg types entry: present ($types)" >> "$FRAGMENT"
            else
              echo "- $pkg types entry: declared but absent ($types)" >> "$FRAGMENT"
              FAILED=1
            fi
            exports=$(node -p "const m=require('./$manifest');m.exports?'present':'missing'" 2>/dev/null || echo missing)
            echo "- $pkg exports map: $exports" >> "$FRAGMENT"
            if [ "$exports" = "missing" ]; then
              FAILED=1
            fi
          done
          echo "BUILD_FAILED=$FAILED" >> "$GITHUB_ENV"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-build-${{ github.run_id }}
          path: |
            audit-fragments/
            audit-logs/
            dist-audit/
          if-no-files-found: warn

      - name: Fail until declarations and public entries resolve
        if: always()
        run: test "${BUILD_FAILED:-1}" = "0"
