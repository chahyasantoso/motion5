name: Recovery audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to audit"
        required: true
        default: "main"
        type: string
      base:
        description: "Base for failing-first comparison, default first parent of ref"
        required: false
        default: ""
        type: string
      failing_first_exception:
        description: "Documented reason this ref adds no new behavioral test"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  mutation:
    name: mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Stryker on runtime and adapters
        run: |
          set -uo pipefail
          mkdir -p audit-logs audit-fragments
          FRAGMENT=audit-fragments/20-mutation.md
          FAILED=0
          {
            echo "## mutation"
            echo
            echo "- scope: packages/core/src/runtime and packages/core/src/adapters"
          } > "$FRAGMENT"
          if test -e stryker.config.json; then
            if npx stryker run > audit-logs/mutation.log 2>&1; then
              echo "- stryker run: pass" >> "$FRAGMENT"
            else
              echo "- stryker run: FAIL" >> "$FRAGMENT"
              FAILED=1
            fi
            if test -e reports/mutation/mutation.json; then
              node --input-type=module >> "$FRAGMENT" <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("reports/mutation/mutation.json", "utf8"));
          const mutants = Object.values(report.files ?? {}).flatMap((file) => file.mutants ?? []);
          const counts = Object.groupBy(mutants, (mutant) => mutant.status ?? "Unknown");
          const count = (status) => (counts[status] ?? []).length;
          const killed = count("Killed");
          const survived = count("Survived");
          const timeout = count("Timeout");
          const noCoverage = count("NoCoverage");
          const denominator = killed + survived + timeout;
          const derivedScore = denominator === 0 ? Number.NaN : (killed / denominator) * 100;
          const reported = Number(report.metrics?.mutationScore ?? report.mutationScore);
          const score = Number.isFinite(reported) ? (reported <= 1 ? reported * 100 : reported) : derivedScore;
          const threshold = Number(report.thresholds?.break ?? 0);
          console.log(`- mutation counts: killed=${killed}, survived=${survived}, timeout=${timeout}, noCoverage=${noCoverage}`);
          console.log(`- mutation score: ${score.toFixed(2)}%`);
          console.log(`- mutation threshold: ${threshold.toFixed(2)}%`);
          if (!Number.isFinite(score)) process.exitCode = 1;
          if (Number.isFinite(score) && score < threshold) process.exitCode = 1;
          NODE
              if test "$?" -ne 0; then FAILED=1; fi
            else
              echo "- mutation report: MISSING" >> "$FRAGMENT"
              FAILED=1
            fi
          else
            echo "- stryker.config.json: MISSING" >> "$FRAGMENT"
            FAILED=1
          fi
          echo "MUTATION_FAILED=$FAILED" >> "$GITHUB_ENV"
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-mutation-${{ github.run_id }}
          path: |
            audit-fragments/
            audit-logs/
            reports/mutation/
          if-no-files-found: warn
      - name: Fail until a mutation baseline exists and meets threshold
        if: always()
        run: test "${MUTATION_FAILED:-1}" = "0"

  contract:
    name: contract surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run contract surfaces
        run: |
          set -uo pipefail
          mkdir -p audit-logs audit-fragments
          FRAGMENT=audit-fragments/10-contract.md
          FAILED=0
          { echo "## contract"; echo; echo "- commit: $(git rev-parse HEAD)"; } > "$FRAGMENT"
          run_suite() { suite="$1"; shift; if "$@" > "audit-logs/$suite.log" 2>&1; then echo "- $suite: pass" >> "$FRAGMENT"; else echo "- $suite: FAIL" >> "$FRAGMENT"; FAILED=1; fi; }
          need_path() { suite="$1"; target="$2"; if test -e "$target"; then return 0; fi; echo "- $suite: MISSING ($target)" >> "$FRAGMENT"; FAILED=1; return 1; }
          if need_path "gsap-contract" packages/core/test/contract; then run_suite "gsap-contract" npm run test:contract; fi
          if need_path "dom-contract" packages/core/test/integration/dom-patch-apply.test.ts; then run_suite "dom-contract" npx vitest run packages/core/test/integration/dom-patch-apply.test.ts; fi
          if need_path "react-lifecycle" packages/react/test; then run_suite "react-lifecycle" npx vitest run packages/react/test; fi
          run_suite "boundaries" npm run test:boundaries
          if need_path "end-to-end" packages/core/test/integration/end-to-end.test.ts; then run_suite "end-to-end" npx vitest run packages/core/test/integration/end-to-end.test.ts; fi
          echo "CONTRACT_FAILED=$FAILED" >> "$GITHUB_ENV"
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-contract-${{ github.run_id }}
          path: audit-fragments/
            audit-logs/
          if-no-files-found: warn
      - name: Fail when a contract surface is missing or red
        if: always()
        run: test "${CONTRACT_FAILED:-1}" = "0"

  acceptance:
    name: acceptance mapping
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify acceptance mapping
        run: |
          set -uo pipefail
          mkdir -p audit-logs audit-fragments
          node scripts/acceptance-scan.mjs > audit-logs/acceptance.log 2>&1
          { echo "## acceptance"; echo; echo "- acceptance scan: pass"; } > audit-fragments/30-acceptance.md
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-acceptance-${{ github.run_id }}
          path: audit-fragments/
            audit-logs/
          if-no-files-found: warn

  failing-first:
    name: failing-first evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUDIT_BASE: ${{ inputs.base }}
      AUDIT_EXCEPTION: ${{ inputs.failing_first_exception }}
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve comparison range
        run: |
          set -euo pipefail
          REF_SHA=$(git rev-parse HEAD); BASE_SHA=${AUDIT_BASE:+$(git rev-parse "$AUDIT_BASE")}; BASE_SHA=${BASE_SHA:-$(git rev-parse HEAD^)}
          echo "REF_SHA=$REF_SHA" >> "$GITHUB_ENV"; echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$REF_SHA" -- "*.test.ts" > /tmp/new-tests.txt
          git diff --name-only "$BASE_SHA" "$REF_SHA" -- "packages/*/src/*" > /tmp/changed-src.txt
      - name: Run tests against base
        run: |
          set -uo pipefail; mkdir -p audit-logs
          if [ ! -s /tmp/new-tests.txt ]; then echo "RED_RESULT=no-new-tests" >> "$GITHUB_ENV"; exit 0; fi
          git checkout -f "$BASE_SHA"; xargs -a /tmp/new-tests.txt git checkout "$REF_SHA" --; npm ci --ignore-scripts --no-audit --no-fund > audit-logs/base-install.log 2>&1
          if xargs -a /tmp/new-tests.txt npx vitest run > audit-logs/base-run.log 2>&1; then echo "RED_RESULT=passed-on-base" >> "$GITHUB_ENV"; else echo "RED_RESULT=failed-on-base" >> "$GITHUB_ENV"; fi
      - name: Run tests on ref
        run: |
          set -uo pipefail
          if [ ! -s /tmp/new-tests.txt ]; then echo "GREEN_RESULT=no-new-tests" >> "$GITHUB_ENV"; exit 0; fi
          git checkout -f "$REF_SHA"; npm ci --ignore-scripts --no-audit --no-fund > audit-logs/ref-install.log 2>&1
          if xargs -a /tmp/new-tests.txt npx vitest run > audit-logs/ref-run.log 2>&1; then echo "GREEN_RESULT=passed-on-ref" >> "$GITHUB_ENV"; else echo "GREEN_RESULT=failed-on-ref" >> "$GITHUB_ENV"; fi
      - name: Record verdict
        if: always()
        run: |
          set -uo pipefail; mkdir -p audit-fragments audit-logs
          cp /tmp/new-tests.txt audit-logs/new-tests.txt 2>/dev/null || true; cp /tmp/changed-src.txt audit-logs/changed-src.txt 2>/dev/null || true
          FRAGMENT=audit-fragments/40-failing-first.md
          { echo "## failing-first"; echo; echo "- ref: ${REF_SHA:-unresolved}"; echo "- base: ${BASE_SHA:-unresolved}"; echo "- base run: ${RED_RESULT:-not-run}"; echo "- ref run: ${GREEN_RESULT:-not-run}"; } > "$FRAGMENT"
          VERDICT=fail; if [ "${RED_RESULT:-}" = "failed-on-base" ] && [ "${GREEN_RESULT:-}" = "passed-on-ref" ]; then VERDICT=pass; fi
          if [ "$VERDICT" != "pass" ] && [ -n "$AUDIT_EXCEPTION" ]; then VERDICT=exception; echo "- documented exception: $AUDIT_EXCEPTION" >> "$FRAGMENT"; fi
          echo "- verdict: $VERDICT" >> "$FRAGMENT"; test "$VERDICT" != "fail"
      - name: Upload failing-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-failing-first-${{ github.run_id }}
          path: audit-fragments/
            audit-logs/
          if-no-files-found: warn

  build:
    name: declaration build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit declarations and check public entries
        run: |
          set -uo pipefail; mkdir -p audit-logs audit-fragments; FAILED=0
          if npx tsc -p tsconfig.json --declaration --emitDeclarationOnly --noEmit false --outDir dist-audit > audit-logs/declarations.log 2>&1; then echo "- declaration emit: pass" > audit-fragments/50-build.md; else echo "- declaration emit: FAIL" > audit-fragments/50-build.md; FAILED=1; fi
          for manifest in packages/*/package.json; do dir=$(dirname "$manifest"); types=$(node -p "const m=require('./$manifest');m.types||m.typings||''" 2>/dev/null || echo ""); exports=$(node -p "const m=require('./$manifest');m.exports?'present':'missing'" 2>/dev/null || echo missing); test -n "$types" && test -e "$dir/$types" || FAILED=1; test "$exports" = present || FAILED=1; done
          echo "BUILD_FAILED=$FAILED" >> "$GITHUB_ENV"
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-build-${{ github.run_id }}
          path: audit-fragments/
            audit-logs/
          if-no-files-found: warn
      - name: Fail until build passes
        if: always()
        run: test "${BUILD_FAILED:-1}" = "0"

  report:
    name: audit report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [contract, mutation, acceptance, failing-first, build]
    if: always()
    steps:
      - name: Download every job fragment
        uses: actions/download-artifact@v4
        with:
          pattern: recovery-audit-*-${{ github.run_id }}
          path: downloaded
          merge-multiple: true
      - name: Assemble the audit report
        run: |
          set -uo pipefail
          { echo "# Recovery audit report"; echo; echo "- Ref: ${{ inputs.ref }}"; echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo "## Job outcomes"; echo "- contract: ${{ needs.contract.result }}"; echo "- mutation: ${{ needs.mutation.result }}"; echo "- acceptance: ${{ needs.acceptance.result }}"; echo "- failing-first: ${{ needs['failing-first'].result }}"; echo "- build: ${{ needs.build.result }}"; echo; find downloaded -name '*.md' -print0 | sort -z | xargs -0 -r cat; } | tee recovery-audit-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assembled report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-report-${{ github.run_id }}
          path: recovery-audit-report.md
          if-no-files-found: error
