name: Recovery audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to audit
        required: true
        default: main
        type: string
      base:
        description: Base for failing-first comparison
        required: false
        default: ""
        type: string
      failing_first_exception:
        description: Documented reason this ref adds no new behavioral test
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  acceptance:
    name: acceptance mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.ref }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: mkdir -p test-results
      - run: npx vitest run --reporter=json --outputFile=test-results/vitest.json
      - run: node scripts/acceptance-scan.mjs test-results/vitest.json

  failing-first:
    name: failing-first evidence
    runs-on: ubuntu-latest
    env:
      AUDIT_BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.ref }}, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay assertion-level red against base and green against ref
        run: |
          set -euo pipefail
          mkdir -p audit-logs
          ref_sha=$(git rev-parse HEAD)
          base_sha=${AUDIT_BASE:+$(git rev-parse "$AUDIT_BASE")}
          base_sha=${base_sha:-$(git rev-parse HEAD^)}
          git diff --name-only --diff-filter=AM "$base_sha" "$ref_sha" -- '*.test.ts' > audit-logs/new-tests.txt
          test -s audit-logs/new-tests.txt
          git checkout -f "$base_sha"
          git checkout "$ref_sha" -- 'packages/*/test/*'
          xargs -a audit-logs/new-tests.txt git checkout "$ref_sha" --
          npm ci --ignore-scripts --no-audit --no-fund > audit-logs/base-install.log 2>&1
          if xargs -a audit-logs/new-tests.txt npx vitest run --reporter=json --outputFile=audit-logs/base.json > audit-logs/base-run.log 2>&1; then
            echo "base did not fail"; exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("audit-logs/base.json", "utf8"));
          const results = report.testResults ?? [];
          const assertionFailures = results.filter((test) => test.status === "failed" && !String(test.assertionResults ?? test.message ?? "").match(/Cannot find|failed to resolve|config|transform/i));
          if (assertionFailures.length === 0) throw new Error("base red was infrastructure/import-resolution, not assertion-level");
          console.log(`assertion-level red: ${assertionFailures.length}`);
          NODE
          git checkout -f "$ref_sha"
          npm ci --ignore-scripts --no-audit --no-fund > audit-logs/ref-install.log 2>&1
          xargs -a audit-logs/new-tests.txt npx vitest run --reporter=json --outputFile=audit-logs/ref.json > audit-logs/ref-run.log 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-failing-first-${{ github.run_id }}
          path: audit-logs/

  build:
    name: declaration build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.ref }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p packages/core/tsconfig.build.json
      - run: test -f packages/core/dist/index.js
      - run: test -f packages/core/dist/index.d.ts

  report:
    name: audit report
    runs-on: ubuntu-latest
    needs: [acceptance, failing-first, build]
    if: always()
    steps:
      - run: test "${{ needs.acceptance.result }}" = success && test "${{ needs.failing-first.result }}" = success && test "${{ needs.build.result }}" = success
