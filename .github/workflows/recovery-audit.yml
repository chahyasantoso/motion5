name: Recovery audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to audit"
        required: true
        default: "main"
        type: string
      base:
        description: "Base for failing-first comparison, default first parent of ref"
        required: false
        default: ""
        type: string
      failing_first_exception:
        description: "Documented reason this ref adds no new behavioral test"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  mutation:
    name: mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run and verify Stryker score
        run: |
          set -uo pipefail
          mkdir -p audit-logs audit-fragments
          FAILED=0
          if npx stryker run > audit-logs/mutation.log 2>&1; then echo '- stryker run: pass' > audit-fragments/20-mutation.md; else echo '- stryker run: FAIL' > audit-fragments/20-mutation.md; FAILED=1; fi
          if test -e reports/mutation/mutation.json; then
            node --input-type=module >> audit-fragments/20-mutation.md <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("reports/mutation/mutation.json", "utf8"));
          const mutants = Object.values(report.files ?? {}).flatMap((file) => file.mutants ?? []);
          const counts = Object.groupBy(mutants, (mutant) => mutant.status ?? "Unknown");
          const count = (status) => (counts[status] ?? []).length;
          const killed = count("Killed"), survived = count("Survived"), timeout = count("Timeout"), noCoverage = count("NoCoverage");
          const denominator = killed + survived + timeout;
          const derived = denominator === 0 ? Number.NaN : (killed / denominator) * 100;
          const reported = Number(report.metrics?.mutationScore ?? report.mutationScore);
          const score = Number.isFinite(reported) ? (reported <= 1 ? reported * 100 : reported) : derived;
          const threshold = Number(report.thresholds?.break ?? 0);
          console.log(`- mutation counts: killed=${killed}, survived=${survived}, timeout=${timeout}, noCoverage=${noCoverage}`);
          console.log(`- mutation score: ${score.toFixed(2)}%`);
          console.log(`- mutation threshold: ${threshold.toFixed(2)}%`);
          if (!Number.isFinite(score) || score < threshold) process.exitCode = 1;
          NODE
            if test "$?" -ne 0; then FAILED=1; fi
          else echo '- mutation report: MISSING' >> audit-fragments/20-mutation.md; FAILED=1; fi
          echo "MUTATION_FAILED=$FAILED" >> "$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-audit-mutation-${{ github.run_id }}
          path: |
            audit-fragments/
            audit-logs/
            reports/mutation/
          if-no-files-found: warn
      - if: always()
        run: test "${MUTATION_FAILED:-1}" = "0"

  contract:
    name: contract surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run contract surfaces
        run: npm run test:contract
      - name: Run integration surfaces
        run: npx vitest run packages/core/test/integration/dom-patch-apply.test.ts packages/core/test/integration/end-to-end.test.ts
      - name: Run React and boundaries
        run: npm run test:boundaries && npx vitest run packages/react/test

  acceptance:
    name: acceptance mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/acceptance-scan.mjs

  failing-first:
    name: failing-first evidence
    runs-on: ubuntu-latest
    env:
      AUDIT_BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          set -euo pipefail
          REF_SHA=$(git rev-parse HEAD); BASE_SHA=${AUDIT_BASE:+$(git rev-parse "$AUDIT_BASE")}; BASE_SHA=${BASE_SHA:-$(git rev-parse HEAD^)}
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$REF_SHA" -- "*.test.ts" > /tmp/new-tests.txt
          test -s /tmp/new-tests.txt
          git checkout -f "$BASE_SHA"
          xargs -a /tmp/new-tests.txt git checkout "$REF_SHA" --
          npm ci --ignore-scripts --no-audit --no-fund
          ! xargs -a /tmp/new-tests.txt npx vitest run
          git checkout -f "$REF_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          xargs -a /tmp/new-tests.txt npx vitest run

  build:
    name: declaration build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --declaration --emitDeclarationOnly --noEmit false --outDir dist-audit

  report:
    name: audit report
    runs-on: ubuntu-latest
    needs: [contract, mutation, acceptance, failing-first, build]
    if: always()
    steps:
      - run: echo "Recovery audit completed for ${{ inputs.ref }}"
