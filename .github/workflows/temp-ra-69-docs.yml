name: temp ra-69 docs update

on:
  push:
    branches:
      - docs/ra-69-follow-up
    paths:
      - scripts/temp-update-ra-69-docs.mjs
      - .github/workflows/temp-ra-69-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/ra-69-follow-up
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded docs update
        run: node scripts/temp-update-ra-69-docs.mjs
      - name: Verify diff and formatting
        run: |
          git diff --check
          npx prettier --check docs/ADR-065-authored-property-edit.md docs/DECISIONS.md docs/SESSION-STATUS.md docs/guide/api-reference.md docs/guide/runtime-changes.md docs/guide/errors-and-diagnostics.md
      - name: Typecheck
        run: npm run typecheck
      - name: Commit six docs and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ADR-065-authored-property-edit.md docs/DECISIONS.md docs/SESSION-STATUS.md docs/guide/api-reference.md docs/guide/runtime-changes.md docs/guide/errors-and-diagnostics.md
          git rm scripts/temp-update-ra-69-docs.mjs .github/workflows/temp-ra-69-docs.yml
          git commit -m "docs: document authored property editing slice"
          git push origin HEAD:docs/ra-69-follow-up
