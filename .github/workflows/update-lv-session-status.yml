name: Update LV session status

on:
  push:
    branches: [feat/lv-live-value-updates]
    paths: [.github/workflows/update-lv-session-status.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lv-live-value-updates
          fetch-depth: 0
      - name: Append the LV status entry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/SESSION-STATUS.md")
          text = path.read_text()
          marker = "**Live value updates ([issue #218]"
          if marker in text:
              raise SystemExit("LV status entry already present")

          text = text.replace(
              "**Branch verified:** `fix/sh-stale-track-handle`  ",
              "**Branch verified:** `feat/lv-live-value-updates`  ",
              1,
          )
          text = text.replace(
              "and the uniform refusal of a stale `TrackHandle`.",
              "the uniform refusal of a stale `TrackHandle`, and live value updates without Track replacement.",
              1,
          )

          in_flight = """## In flight

- **Live value updates ([issue #218](https://github.com/chahyasantoso/motion5/issues/218))** are **complete and green** on `feat/lv-live-value-updates` in [PR #228](https://github.com/chahyasantoso/motion5/pull/228), with ADR-059 and cases `LV-1` through `LV-14`. `TrackHandle.overrideValues()` installs a read-time mask and `TrackHandle.setValues()` rewrites authored static values; both invalidate once, return that `PatchBatch`, preserve topology and progress, and never validate a whole definition, stage a Track, or call `replaceGraph`.
- `Track` owns one immutable `#values` overlay inside `interpolated()`, after renderer-neutral filtering and before plugin composition. That one seam reaches ordinary composition and the publisher-delivered `MemberState`, so a masked bone length recomputes its dependent IK solver. `ProjectRuntime` alone owns whether the retained `TrackDefinition` moves with the mask, and `GraphRuntime` keeps invalidation unchanged.
- The mask is replaced wholesale by the next live write rather than accumulated. `overrideValues({})` is the explicit clear back to authored truth, and a real `replace()` drops the mask by constructing a fresh Track. Unknown keys, keys another plugin owns, namespaced keys, interpolator scratch keys, and animated keys are refused by `LiveValueKeyError` with no mutation and no publish; animated keys stay refused until the `Interpolator` port gains a real per-key capability.
- The stale-handle contract from ADR-056 extends rather than forks: both new members route through `#liveEntry`, throw `StaleTrackHandleError` once stale, and are covered by `SH-1` from the handle's own enumerated surface. The public surface gains those two members, `LiveValues`, and `LiveValueKeyError`; `Track` itself remains private and the emitted declaration closure still reaches no `runtime/` or `graph/` module.
- The plan's proposed ownership predicate export, registry read inside `Track`, second value layer, and second runtime hook are deleted from the design rather than implemented. One overlay needs one hook; the two public semantics differ only in the definition rewrite that `ProjectRuntime` already owns.
"""
          text = text.replace("## In flight\n", in_flight, 1)

          anchor = "## Evidence anchors\n\n"
          evidence = "- Live value updates red run: [33310177625](https://github.com/chahyasantoso/motion5/actions/runs/33310177625), archived at `logs/33310177625/` on `ci-logs`. `typecheck` and `format:check` both passed first, then `quality` reported `14 failed | 752 passed`: every behavioral `LV-` case failed except the `LV-12` port guard, and `SH-1` failed because the handle did not yet expose the two declared members. Integration failed the two IK surface cases, while boundaries, build, end-to-end, and performance were green. Final green run: [33311047804](https://github.com/chahyasantoso/motion5/actions/runs/33311047804), all six checks green.\n"
          text = text.replace(anchor, anchor + evidence, 1)
          path.write_text(text)
          PY
      - name: Commit the status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SESSION-STATUS.md
          git commit -m "docs(status): record live value updates"
          git push origin HEAD:feat/lv-live-value-updates
