name: temp runtime extraction

on:
  push:
    branches:
      - feat/ra-69-authored-property-edit
    paths:
      - scripts/temp-extract-keyframe-runtime.mjs
      - .github/workflows/temp-runtime-extraction.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/ra-69-authored-property-edit
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded extraction
        run: node scripts/temp-extract-keyframe-runtime.mjs
      - name: Verify formatting-independent source hygiene
        run: git diff --check
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused runtime tests
        run: npx vitest run packages/core/test/unit/runtime/keyframe-property-edit.test.ts packages/core/test/unit/runtime/stale-track-handle.test.ts packages/core/test/unit/runtime/live-value-updates.test.ts
      - name: Commit source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/runtime/project-runtime.ts
          git rm scripts/temp-extract-keyframe-runtime.mjs .github/workflows/temp-runtime-extraction.yml
          git commit -m "refactor: extract authored keyframe runtime helpers"
          git push origin HEAD:feat/ra-69-authored-property-edit
