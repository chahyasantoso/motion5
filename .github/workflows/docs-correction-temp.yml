name: Temporary docs correction

on:
  push:
    branches:
      - docs/ra-48-runtime-authoring-surface

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct runtime authoring docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = Path('docs/guide/api-reference.md')
          text = api.read_text()
          text = text.replace('handle.track', 'handle.definition')
          text = text.replace('`track`, `remove()`', '`definition`, `requires`, `remove()`')
          needle = '- `addTrack(track, { motionId? })` returns a `TrackHandle`; `track(nodeId)` returns the handle for an existing node.\n'
          addition = needle + '- `tryTrack(nodeId)` and `tryMotion(motionId)` return `undefined` for an expected miss; `motion(motionId)` resolves a `MotionHandle`.\n- A `MotionHandle` exposes `id`, `live`, `definition`, `trackIds`, `setTrigger`, `setStagger`, `addTrack`, `track`, `tryTrack`, `signal`, and `destroy`.\n'
          text = text.replace(needle, addition)
          needle = 'A `TrackHandle` carries `id`, `live`, `definition`, `requires`, `remove()`, `replace(next)`, `addObserve(observation)`, `removeObserve(observation),'
          if needle not in text:
              text = text.replace('A `TrackHandle` carries `id`, `live`, `definition`, `remove()`, `replace(next)`,', 'A `TrackHandle` carries `id`, `live`, `definition`, `requires`, `remove()`, `replace(next)`, `setRequire(plugin, slot, source, memberKey?)`, and `removeRequire(plugin, slot, memberKey?)`,')
          api.write_text(text)

          changes = Path('docs/guide/runtime-changes.md')
          text = changes.read_text()
          text = text.replace('track.track', 'track.definition')
          text = text.replace('handle.track', 'handle.definition')
          marker = 'track.remove();\n```\n'
          insert = 'track.remove();\ntrack.setRequire("fk", "base", "walk/chest");\ntrack.removeRequire("fk", "base");\n```\n\n`setRequire` and `removeRequire` edit one edge on an already-bound plugin group. They preserve the group values, redirect rather than append, support `memberKey` for dict-valued slots, and leave the `requires` section absent when its last binding is removed. They rebuild the graph because an authored requirement is topology, and refused candidates leave the handle unchanged. To originate a plugin group, use `setKeyframeGroup` in the structural authoring API rather than silently creating a partial group.\n'
          text = text.replace(marker, insert)
          changes.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide/api-reference.md docs/guide/runtime-changes.md
          git rm .github/workflows/docs-correction-temp.yml
          git commit -m "docs: correct runtime authoring surface after B1 and C1"
          git push
