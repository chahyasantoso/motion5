name: Archive CI logs

# Read from the default branch. A PR that changes this file is not a rollout.
on:
  workflow_run:
    workflows: ["CI", "Recovery audit", "AI edit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed run to report or reconcile
        required: true
        type: string
      run_attempt:
        description: Exact attempt, not the latest attempt
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

# One owner serializes evidence writes and comment projections across all runs.
concurrency:
  group: archive-ci-logs
  cancel-in-progress: false

env:
  TRUSTED_SHA: ${{ vars.MOTION5_AUTOMATION_SHA }}
  REPORT_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
  REPORT_RUN_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}

jobs:
  report:
    name: trusted outcome publisher
    if: vars.MOTION5_AUTOMATION_SHA != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Require reviewed immutable inputs
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPORT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPORT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.MOTION5_AUTOMATION_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve workflow from GitHub metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPORT_RUN_ID/attempts/$REPORT_RUN_ATTEMPT" --jq '.path')"
          case "$workflow" in
            .github/workflows/ai-edit.yml) echo "kind=ai-edit" >> "$GITHUB_OUTPUT" ;;
            .github/workflows/ci.yml|.github/workflows/recovery-audit.yml) echo "kind=ci" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized workflow"; exit 1 ;;
          esac
      - name: Retain CI evidence and publish the exact-SHA summary
        if: steps.resolve.outputs.kind == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation-report.mjs
      - name: Independently validate and publish a bounded candidate
        id: publish
        if: steps.resolve.outputs.kind == 'ai-edit'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: node scripts/automation-publish.mjs publish
      - name: Recover a failed publication report without replaying the edit
        if: failure() && steps.resolve.outputs.kind == 'ai-edit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation-publish.mjs recover

  fallback:
    name: independent reporting fallback
    needs: report
    if: >-
      always() && needs.report.result == 'failure' &&
      vars.MOTION5_AUTOMATION_SHA != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Require the reviewed runner
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPORT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPORT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.MOTION5_AUTOMATION_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retry only evidence recovery on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPORT_RUN_ID/attempts/$REPORT_RUN_ATTEMPT" --jq '.path')"
          case "$workflow" in
            .github/workflows/ai-edit.yml) node scripts/automation-publish.mjs recover ;;
            .github/workflows/ci.yml|.github/workflows/recovery-audit.yml) node scripts/automation-report.mjs ;;
            *) echo "Unrecognized workflow"; exit 1 ;;
          esac
