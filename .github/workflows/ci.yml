name: CI

on:
  push:
    branches: [main, "rescue/**", "phase*/**", "feat/adopt-motion-track"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0

jobs:
  quality:
    name: quality (node 24.21.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: install
      # Before typecheck, format and vitest discovery on purpose: an unbalanced String.raw template
      # is a syntax error that stops all three from reporting a useful cause.
      - run: npm run scan:raw-templates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run scan:comments
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run scan:cycles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm test -- --project unit --reporter=default
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  browser:
    name: browser (node 24.21.0) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --project browser --reporter=default --shard=${{ matrix.shard }}/3

  boundaries:
    name: boundaries (node 24.21.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/boundary-scan.mjs

  performance:
    name: performance (node 24.21.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: gerak-benchmark-report
          path: performance/benchmark-report.json
          if-no-files-found: error
