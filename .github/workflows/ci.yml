name: CI

on:
  push:
    branches: [main, "rescue/**", "phase*/**", "feat/adopt-motion-track"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: quality (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "CI_EVIDENCE_DIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: install
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run format:check
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Show expected evidence-adapter formatting without writing
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          npx --no-install prettier scripts/ci-evidence.mjs
          exit 1
      - run: node scripts/ci-evidence.mjs discover
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm test -- --reporter=default --reporter=./scripts/ci-evidence.mjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: node scripts/ci-evidence.mjs verify all
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14

  integration:
    name: integration (node 24)
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUITE_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Require successful suite owner, including evidence verification
        run: test "$SUITE_RESULT" = success
      - run: echo "CI_EVIDENCE_DIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
      - run: node scripts/ci-evidence.mjs verify integration

  boundaries:
    name: boundaries (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/boundary-scan.mjs

  read-budget:
    name: read-budget (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/read-budget-scan.mjs

  build:
    name: build (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p packages/core/tsconfig.build.json
      - run: test -f packages/core/dist/index.js
      - run: test -f packages/core/dist/index.d.ts

  end-to-end:
    name: end-to-end (node 24)
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUITE_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Require successful suite owner, including evidence verification
        run: test "$SUITE_RESULT" = success
      - run: echo "CI_EVIDENCE_DIR=$RUNNER_TEMP/ci-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
      - run: node scripts/ci-evidence.mjs verify end-to-end

  performance:
    name: performance (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: motion5-benchmark-report
          path: performance/benchmark-report.json
          if-no-files-found: error
