<!doctype html>
<html lang="en">
  <head>

    <title>night-d</title>
    <style>
      /* Layout only: choose the background, palette and type that fit the brief. */
      body {
        margin: 0;

      .word {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;

        line-height: 190px;
        letter-spacing: 10px;
      }
      .night {
        top: 130px;
      }
      .shift {
        top: 330px;
        color: #f4b53f;
      }
      .dial {
        position: absolute;
        left: 616px;
        top: 570px;
        width: 48px;
        height: 48px;
        border: 4px solid #f2e8d0;
        border-radius: 50%;
        box-sizing: border-box;
      }
      .hand {
        position: absolute;
        left: 0;
        top: 0;
        width: 40px;
        height: 40px;
      }
      .hand i {
        position: absolute;
        left: 18px;
        top: 5px;
        width: 4px;
        height: 15px;
        background: #f4b53f;
