<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>launch day</title>
    <style>
      :root {
        --paper: #f3efe6;
        --coral: #ff5b3a;
        --night: #101114;
        --mute: #7d8290;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--night);
      }
      #frame {
        position: relative;
        width: 1280px;
        height: 720px;
      }
      [data-cast="world"] {
        position: absolute;
        inset: 0;
        background: var(--paper);
      }
      [data-cast="world"] > * {
        position: absolute;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        font-weight: 800;
      }
      [data-cast="date"] {
        left: 300px;
        top: 110px;
        width: 680px;
        height: 120px;
        background: var(--night);
        color: var(--paper);
        font-size: 64px;
        letter-spacing: 8px;
        border-radius: 18px 18px 0 0;
      }
      [data-cast="day"] {
        left: 300px;
        top: 230px;
        width: 680px;
        height: 150px;
        background: #fff;
        color: var(--night);
        font-size: 84px;
        border-radius: 0 0 18px 18px;
        box-shadow: 0 10px 0 var(--mute);
      }
      .badge {
        top: 440px;
        width: 200px;
        height: 70px;
        border-radius: 35px;
        background: var(--night);
        color: var(--paper);
        font-size: 30px;
      }
      [data-cast="one"] {
        left: 320px;
      }
      [data-cast="two"] {
        left: 540px;
        background: var(--mute);
      }
      [data-cast="three"] {
        left: 760px;
      }
      [data-cast="stamp"] {
        left: 880px;
        top: 540px;
        width: 200px;
        height: 90px;
        border: 8px solid var(--coral);
        color: var(--coral);
        border-radius: 12px;
        font-size: 54px;
        letter-spacing: 6px;
      }
      [data-cast="ring"] {
        left: 965px;
        top: 570px;
        width: 30px;
        height: 30px;
        border: 4px solid var(--coral);
        border-radius: 50%;
        opacity: 0;
      }
      [data-cast="dust"] {
        left: 973px;
        top: 640px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--coral);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <div data-cast="world">
        <div data-cast="date">LAUNCH DAY</div>
        <div data-cast="day">14 MARCH</div>
        <div data-cast="one" class="badge">Fast</div>
        <div data-cast="two" class="badge">Light</div>
        <div data-cast="three" class="badge">Yours</div>
        <div data-cast="ring"></div>
        <div data-cast="dust"></div>
        <div data-cast="dust"></div>
        <div data-cast="dust"></div>
        <div data-cast="dust"></div>
        <div data-cast="dust"></div>
        <div data-cast="dust"></div>
        <div data-cast="stamp">LIVE</div>
      </div>
    </div>
    <script type="module" src="/launch-day/src/launch-day-main.ts"></script>
  </body>
</html>
