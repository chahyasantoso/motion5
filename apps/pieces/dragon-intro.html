<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>dragon-intro</title>
    <style>
      body {
        margin: 0;
        background: #0a0c13;
      }
      .stage {
        position: relative;
        overflow: hidden;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      }
      .stage .canvas {
        display: block;
      }
      .title {
        position: absolute;
        left: 0;
        top: 22px;
        width: 1280px;
        height: 90px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 24px;
        pointer-events: none;
      }
      .word {
        font-size: 62px;
        line-height: 84px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #ffd27a;
        text-shadow:
          0 3px 0 #8a4a14,
          0 0 28px rgba(255, 130, 40, 0.45);
      }
      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        width: 440px;
        box-sizing: border-box;
        padding: 14px 20px 16px;
        border-radius: 22px;
        background: #fff3dc;
        color: #2b1a10;
        font-size: 24px;
        line-height: 1.3;
        font-weight: 600;
        translate: calc(-100% - 96px) calc(-100% - 40px);
        pointer-events: none;
      }
      .bubble::after {
        content: "";
        position: absolute;
        right: -96px;
        bottom: -40px;
        width: 118px;
        height: 58px;
        background: #fff3dc;
        clip-path: polygon(0 0, 62% 62%, 100% 100%, 0 100%);
      }
      .card {
        position: absolute;
        right: 44px;
        top: 292px;
        width: 290px;
        box-sizing: border-box;
        padding: 20px 24px 22px;
        border: 2px solid #ffd27a;
        border-radius: 14px;
        background: #1a2133;
        color: #f4ead8;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      .card b {
        font-size: 15px;
        letter-spacing: 0.3em;
        color: #ffb347;
      }
      .card span {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.1;
      }
      .card em {
        font-size: 18px;
        color: #aab4cc;
      }
      .plus {
        position: absolute;
        left: 0;
        top: 0;
        translate: -50% -50%;
        font-size: 46px;
        font-weight: 900;
        color: #fff7c2;
        text-shadow:
          0 0 14px #ffb62e,
          0 3px 0 #a5560f;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dragon-intro-main.tsx"></script>
  </body>
</html>
