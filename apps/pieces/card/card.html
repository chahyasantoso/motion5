<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gerak hover card</title>
    <style>
      body {
        margin: 0;
      }
      .card-stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #e9e4d8;
        font-family: Georgia, "Times New Roman", serif;
      }
      .card-hit {
        position: absolute;
        left: 490px;
        top: 220px;
        width: 300px;
        height: 280px;
      }
      .card {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        border-radius: 6px;
        background: #fbf8f1;
        border: 1px solid #d3cbb8;
      }
      .card-shadow {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: -18px;
        height: 24px;
        border-radius: 50%;
        background: #5b5243;
        filter: blur(12px);
      }
      .card-kicker {
        font:
          600 13px/1 system-ui,
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #4f5c22;
      }
      .card-title {
        font-size: 34px;
        line-height: 1.1;
        color: #2c2a24;
      }
      .card-meta {
        margin-top: auto;
        font:
          14px system-ui,
          sans-serif;
        color: #6d6658;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/card-main.tsx"></script>
  </body>
</html>
