<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gerak pile</title>
    <style>
      body {
        margin: 0;
      }
      .pile-stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #1d3b33;
      }
      .pile-floor {
        position: absolute;
        left: 0;
        right: 0;
        top: 600px;
        bottom: 0;
        background: #142a24;
      }
      .pile-letter {
        position: absolute;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #f2c14e;
        color: #1d3b33;
        font:
          800 100px/1 "Arial Black",
          system-ui,
          sans-serif;
      }
      .pile-glyph {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/pile/src/pile-main.tsx"></script>
  </body>
</html>
