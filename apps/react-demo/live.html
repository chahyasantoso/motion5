<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motion5 live</title>
    <style>
      body {
        margin: 0;
        background: #0e0e12;
      }
      [data-live-stage] {
        position: relative;
      }
      .live-code {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 90;
        max-width: 560px;
        max-height: 620px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border-radius: 6px;
        background: rgba(14, 14, 18, 0.86);
        color: #f4eddf;
        font: 11px/1.35 monospace;
      }
      .live-timeline {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        padding: 8px 16px;
        background: rgba(14, 14, 18, 0.92);
        color: #f4eddf;
        font:
          13px/1.3 system-ui,
          sans-serif;
      }
      [data-live-error] {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        box-sizing: border-box;
        padding: 12px 16px;
        background: #b00020;
        color: #ffffff;
        font: 14px/1.4 monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/live-main.tsx"></script>
  </body>
</html>
