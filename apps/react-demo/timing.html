<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>motion5 timing beat</title>
    <style>
      body {
        margin: 0;
        background: #0e0e12;
      }
      .beat-stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #ff5533;
      }
      .beat-word {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        padding-top: 280px;
        font:
          900 170px/1 "Segoe UI Black",
          "Arial Black",
          sans-serif;
        color: #0e0e12;
      }
      .beat-glyph {
        display: inline-block;
        transform-origin: 50% 100%;
      }
      .beat-dot {
        display: inline-block;
        width: 40px;
        height: 40px;
        margin-left: 12px;
        border-radius: 50%;
        background: #f4eddf;
        transform-origin: 50% 100%;
      }
      .beat-cover {
        position: absolute;
        inset: 0;
        background: #0e0e12;
        clip-path: circle(0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/timing-main.tsx"></script>
  </body>
</html>
