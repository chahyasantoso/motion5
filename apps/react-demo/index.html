<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motion5 — React 12-Node Full-Body Skeleton Demo</title>
    <style>
      :root {
        --bg:       #080c14;
        --card:     #0f1825;
        --border:   #1e2d45;
        --accent:   #38bdf8;
        --accent2:  #818cf8;
        --text:     #f1f5f9;
        --muted:    #64748b;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      #scroll-scene {
        height: 100vh;
        width: 100vw;
        display: grid;
        grid-template-columns: 1fr 340px;
        position: relative;
        overflow: hidden;
        background: var(--bg);
      }

      .stage-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        background: radial-gradient(ellipse 80% 60% at 50% 60%, #0f2040 0%, var(--bg) 100%);
        border-right: 1px solid var(--border);
      }

      .demo-header {
        padding: 1.25rem 2rem;
        border-bottom: 1px solid var(--border);
        background: rgba(8, 12, 20, 0.6);
        backdrop-filter: blur(8px);
        z-index: 10;
      }

      .demo-header h1 {
        font-size: 1.35rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .demo-header p {
        color: var(--muted);
        font-size: 0.825rem;
        margin-top: 0.25rem;
      }

      .stage-container {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      #stage {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0; left: 0;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.25rem;
        background: var(--card);
        border-left: 1px solid var(--border);
        overflow-y: auto;
      }

      .sidebar-top { display: flex; flex-direction: column; gap: 1rem; }
      .sidebar h2 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }

      .progress-track {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 3px;
        transition: width 0.05s linear;
      }
      .progress-label {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.35rem;
        display: flex;
        justify-content: space-between;
      }

      .inspector-list {
        max-height: 480px;
        overflow-y: auto;
        padding-right: 0.25rem;
      }

      .node-card {
        background: #080e1a;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.5rem 0.65rem;
        margin-bottom: 0.4rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
      }
      .node-card .title {
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 0.25rem;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }
      .val-row {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        line-height: 1.4;
      }
      .val-row span:last-child { color: var(--text); }

      .sidebar-footer {
        font-size: 0.7rem;
        color: var(--muted);
        line-height: 1.5;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
        margin-top: 1rem;
      }
      .sidebar-footer strong { color: var(--text); }

      .outro {
        padding: 6rem 2rem;
        text-align: center;
        background: var(--bg);
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .outro h2 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .outro p { color: var(--muted); max-width: 500px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <section class="outro">
      <h2>End of Full-Body Skeleton Walk Cycle</h2>
      <p>
        Scroll back up to replay. motion5 runtime updates all 12 forward-kinematics
        nodes in real time using Authored Schema v5 &amp; React 19 <code>usePatch</code>.
      </p>
    </section>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
