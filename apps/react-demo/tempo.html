<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tempo</title>
    <style>
      body {
        margin: 0;
        background: #14213d;
      }
      .stage {
        position: relative;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #14213d;
      }
      .base {
        position: absolute;
        left: 190px;
        top: 400px;
        width: 220px;
        height: 34px;
        border-radius: 6px;
        background: #f1e9d2;
      }
      .arm {
        position: absolute;
        left: 295px;
        top: 120px;
        width: 10px;
        height: 290px;
        border-radius: 5px;
        background: #f1e9d2;
      }
      .weight {
        position: absolute;
        left: -13px;
        top: 56px;
        width: 36px;
        height: 30px;
        border-radius: 4px;
        background: #fca311;
      }
      .pivot {
        position: absolute;
        left: 288px;
        top: 396px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fca311;
      }
      .mark {
        position: absolute;
        top: 112px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fca311;
        opacity: 0;
      }
      .mark.left {
        left: 170px;
      }
      .mark.right {
        left: 414px;
      }
      .title {
        position: absolute;
        left: 0;
        right: 0;
        top: 478px;
        text-align: center;
        color: #f1e9d2;
        font:
          700 52px/1 "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tempo-main.tsx"></script>
  </body>
</html>
