<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>rope word</title>
    <style>
      body {
        margin: 0;
        background: #0e0e12;
      }
      .rw-stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0e0e12;
      }
      svg {
        display: block;
      }
      path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rw-rope {
        stroke: #7a6a58;
        stroke-width: 9;
      }
      .rw-ink {
        stroke: #5df2ff;
        stroke-width: 4;
        filter: drop-shadow(0 0 6px #5df2ff);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/rope-word-main.tsx"></script>
  </body>
</html>
