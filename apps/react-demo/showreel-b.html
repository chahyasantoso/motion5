<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timing Is Everything (showreel-b)</title>
    <style>
      :root {
        --c-ink: #101114;
        --c-paper: #f3efe6;
        --c-coral: #ff5b3a;
        --c-mute: #7d8290;
      }
      @property --sec {
        syntax: "<integer>";
        inherits: true;
        initial-value: 0;
      }
      @property --frame {
        syntax: "<integer>";
        inherits: true;
        initial-value: 0;
      }
      body {
        margin: 0;
        background: #050506;
      }
      .stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--c-ink);
        color: var(--c-paper);
        font-family: "Arial Black", "Arial Bold", Gadget, Arial, sans-serif;
        font-weight: 900;
        user-select: none;
        cursor: pointer;
      }
      .camera {
        position: absolute;
        inset: 0;
      }
      .wipe {
        position: absolute;
        inset: 0;
        background: var(--c-coral);
      }
      .fx {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .fx path {
        fill: none;
        stroke-linecap: round;
      }
      .trail-up {
        stroke: var(--c-coral);
        stroke-width: 3;
      }
      .trail-arc {
        stroke: var(--c-coral);
        stroke-width: 2.5;
        opacity: 0.7;
      }
      .underline {
        stroke: color-mix(in srgb, var(--c-paper), var(--c-ink) calc(var(--inked, 0) * 100%));
        stroke-width: 7;
      }
      .floor {
        stroke: color-mix(in srgb, var(--c-coral), var(--c-paper) calc(var(--cool, 0) * 100%));
        stroke-width: 5;
      }
      .word {
        position: absolute;
        left: 0;
        width: 1280px;
        display: flex;
        justify-content: center;
        line-height: 1;
        white-space: pre;
      }
      .ch {
        display: inline-block;
      }
      .ant {
        top: 312px;
        height: 100px;
        font-size: 100px;
        letter-spacing: 0.01em;
        clip-path: inset(-900px -200px 0 -200px);
      }
      .ant .ch {
        color: color-mix(in srgb, var(--c-paper), var(--c-coral) calc(var(--charge, 0) * 100%));
      }
      .wgt {
        top: 326px;
        font-size: 180px;
      }
      .wgt .ch {
        margin: 0 0.01em;
        position: relative;
      }
      .dust-row .ch {
        color: transparent;
      }
      .dust {
        position: absolute;
        bottom: 22px;
        width: 10px;
        height: 10px;
        margin: 0 0 -5px -5px;
        border-radius: 50%;
        background: var(--c-paper);
      }
      .dust.left {
        left: 8%;
      }
      .dust.right {
        left: 92%;
      }
      .ovl {
        position: absolute;
        inset: 0;
      }
      .bar {
        position: absolute;
        left: 250px;
        top: 150px;
        width: 780px;
        height: 6px;
        border-radius: 3px;
        background: var(--c-coral);
      }
      .ovl-row {
        position: absolute;
        left: 0;
        top: 155px;
        width: 1280px;
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .hang {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .string {
        display: block;
        width: 2px;
        background: rgba(243, 239, 230, 0.45);
      }
      .hang b {
        display: block;
        font-size: 110px;
        line-height: 0.92;
      }
      .stl {
        top: 226px;
        font-size: 140px;
      }
      .stl .ch {
        color: color-mix(in srgb, var(--c-paper), var(--c-ink) calc(var(--inked, 0) * 100%));
      }
      .fin {
        top: 286px;
        align-items: flex-end;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 84px;
      }
      .mask {
        display: inline-block;
        overflow: hidden;
        line-height: 1.15;
        padding: 0 0.08em 0.12em;
        margin: 0 0.04em;
      }
      .fin-word {
        display: inline-block;
      }
      .fin-slot {
        width: 0.32em;
        padding: 0;
        margin-left: -0.06em;
      }
      .fin-base {
        display: inline-block;
        width: 0;
        height: 0;
        vertical-align: baseline;
      }
      .credit {
        position: absolute;
        left: 0;
        top: 438px;
        width: 1280px;
        text-align: center;
        font:
          700 14px/1 Arial,
          Helvetica,
          sans-serif;
        letter-spacing: 0.42em;
        color: var(--c-mute);
      }
      .credit em {
        font-style: normal;
        color: var(--c-coral);
      }
      .ring {
        position: absolute;
        left: -60px;
        top: -60px;
        width: 120px;
        height: 120px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 3px solid var(--c-coral);
      }
      .dot {
        position: absolute;
        left: 622px;
        top: 382px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--c-coral), var(--c-ink) calc(var(--inked, 0) * 100%));
      }
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 46%,
          rgba(0, 0, 0, 0) 52%,
          rgba(0, 0, 0, 0.42) 100%
        );
      }
      .hud {
        position: absolute;
        left: 32px;
        right: 32px;
        bottom: 26px;
        display: flex;
        justify-content: space-between;
        font:
          12px/1 Consolas,
          "Courier New",
          monospace;
        letter-spacing: 0.18em;
        color: var(--c-mute);
      }
      .labels {
        position: relative;
        width: 300px;
        height: 12px;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        white-space: pre;
      }
      .timecode {
        --sec: calc(var(--ms, 0) / 1000 - 0.5);
        --frame: calc(mod(var(--ms, 0), 1000) * 30 / 1000 - 0.5);
        counter-reset: sec var(--sec) frame var(--frame);
      }
      .timecode::after {
        content: "00:" counter(sec, decimal-leading-zero) ":" counter(frame, decimal-leading-zero);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/showreel-b-main.tsx"></script>
  </body>
</html>
