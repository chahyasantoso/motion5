<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>kelvin</title>
    <style>
      body {
        margin: 0;
        background: #0c0c0d;
      }
      .stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #1d1c1a 0%, #0c0c0d 70%);
        font-family: Georgia, "Times New Roman", serif;
        color: #ece6d8;
      }
      .name {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        text-align: center;
        font-size: 190px;
        font-weight: 700;
        letter-spacing: 0.14em;
        padding-left: 0.14em;
        line-height: 1;
      }
      .rule {
        position: absolute;
        left: 340px;
        width: 600px;
        top: 372px;
        height: 2px;
        background: #b8975a;
      }
      .tag {
        position: absolute;
        left: 585px;
        top: 372px;
        width: 110px;
      }
      .string {
        position: absolute;
        left: 54px;
        top: 0;
        width: 2px;
        height: 70px;
        background: #b8975a;
      }
      .card {
        position: absolute;
        left: 0;
        top: 70px;
        width: 110px;
        height: 190px;
        box-sizing: border-box;
        padding: 14px 6px;
        background: #ece6d8;
        color: #0c0c0d;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
      }
      .label {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .price {
        font-size: 34px;
        font-weight: 700;
      }
      .caption {
        position: absolute;
        left: 0;
        right: 0;
        top: 675px;
        text-align: center;
        font-size: 20px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #b8975a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kelvin-main.tsx"></script>
  </body>
</html>
