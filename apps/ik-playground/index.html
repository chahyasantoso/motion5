<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motion5 — IK Playground Demo</title>
    <style>
      :root {
        --bg: #080c14;
        --card: #0f1825;
        --border: #1e2d45;
        --accent: #38bdf8;
        --accent2: #818cf8;
        --teal: #34d399;
        --amber: #fbbf24;
        --rose: #f43f5e;
        --text: #f1f5f9;
        --muted: #64748b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      #scroll-demo {
        height: 250vh;
      }

      #playground {
        height: 100vh;
        height: 100dvh;
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        position: sticky;
        top: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .stage-wrap {
        position: relative;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: radial-gradient(ellipse 80% 60% at 50% 55%, #0f2040 0%, var(--bg) 100%);
        border-right: 1px solid var(--border);
      }

      .demo-header {
        padding: 1.25rem 2rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        z-index: 10;
      }

      .demo-header h1 {
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--accent);
      }

      .demo-header p {
        color: var(--muted);
        font-size: 0.825rem;
        margin-top: 0.25rem;
      }

      .stage-container {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      #stage {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        touch-action: pan-y;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        padding: 1.25rem;
        background: var(--card);
        border-left: 1px solid var(--border);
        overflow-y: auto;
      }

      .sidebar h2 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 0.15rem;
      }

      .solver-card {
        background: #080e1a;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.7rem 0.8rem;
        font-size: 0.75rem;
      }

      .card-title {
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.03em;
        margin-bottom: 0.3rem;
      }

      .mono-line {
        font-family: ui-monospace, monospace;
        line-height: 1.5;
        color: var(--text);
      }

      .mono-line.dim {
        color: var(--muted);
        font-size: 0.7rem;
      }

      .reach-block {
        margin-top: 0.5rem;
      }

      .reach-track {
        height: 5px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }

      .reach-fill {
        height: 100%;
        border-radius: 3px;
        /* Scroll owns the pose; no time-based catch-up animation. */
      }

      .reach-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 0.25rem;
        font-size: 0.7rem;
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }

      .chip {
        display: inline-block;
        margin-top: 0.35rem;
        padding: 0.15rem 0.5rem;
        border-radius: 9999px;
        font-family: ui-monospace, monospace;
        font-size: 0.68rem;
        font-weight: 700;
        border: 1px solid;
      }

      .chip.ok {
        color: var(--teal);
        border-color: rgba(52, 211, 153, 0.5);
        background: rgba(52, 211, 153, 0.12);
      }

      .chip.warn {
        color: var(--amber);
        border-color: rgba(251, 191, 36, 0.5);
        background: rgba(251, 191, 36, 0.12);
      }

      .rot-block {
        margin-top: 0.55rem;
        border-top: 1px dashed var(--border);
        padding-top: 0.45rem;
      }

      .rot-row {
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        line-height: 1.55;
        color: var(--text);
      }

      .rot-row span:first-child {
        color: var(--muted);
      }

      .flip-toggle {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 0.55rem;
        border-top: 1px dashed var(--border);
        padding-top: 0.5rem;
        cursor: pointer;
        user-select: none;
      }

      .flip-toggle input {
        accent-color: var(--accent);
        width: 14px;
        height: 14px;
        cursor: pointer;
      }

      .flip-toggle .note {
        color: var(--muted);
        font-size: 0.68rem;
        margin-left: auto;
      }

      .panel-footer {
        font-size: 0.7rem;
        color: var(--muted);
        line-height: 1.55;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
        margin-top: auto;
      }

      .panel-footer strong {
        color: var(--text);
      }

      .panel-footer code {
        color: var(--accent);
        font-family: ui-monospace, monospace;
        font-size: 0.68rem;
      }
      .weight-readout {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        font-variant-numeric: tabular-nums;
      }
      .weight-readout output {
        color: var(--text);
        font-weight: 700;
      }
      .weight-readout progress {
        width: 7rem;
        height: 0.5rem;
        accent-color: var(--teal);
      }
      #stage [tabindex]:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
      @media (max-width: 760px) {
        #playground {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 30vh);
        }
        .demo-header {
          padding: 0.75rem 1rem;
        }
        .demo-header h1 {
          font-size: 1.1rem;
        }
        .sidebar {
          padding: 0.75rem 1rem;
          border-left: 0;
          border-top: 1px solid var(--border);
        }
        .stage-wrap {
          border-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
