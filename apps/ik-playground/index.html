<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motion5 — IK Playground Demo</title>
    <style>
      :root {
        --bg: #080c14;
        --card: #0f1825;
        --border: #1e2d45;
        --accent: #38bdf8;
        --teal: #34d399;
        --amber: #fbbf24;
        --text: #f1f5f9;
        --muted: #8492a6;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      #scroll-demo {
        height: 250vh;
      }

      #playground {
        position: sticky;
        top: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
      }

      .playground-main {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
      }

      .demo-header {
        flex: 0 0 auto;
        padding: 1rem 1.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }

      .demo-header h1 {
        margin: 0;
        color: var(--accent);
        font-size: 1.35rem;
        font-weight: 800;
      }

      .demo-header p {
        max-width: 70rem;
        margin: 0.3rem 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .weight-readout {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-variant-numeric: tabular-nums;
      }

      .weight-readout output {
        color: var(--text);
        font-weight: 800;
      }

      .weight-readout progress {
        width: 8rem;
        height: 0.5rem;
        accent-color: var(--teal);
      }

      .tabs {
        display: flex;
        flex: 0 0 auto;
        gap: 0.2rem;
        padding: 0.5rem 1.5rem 0;
        border-bottom: 1px solid var(--border);
      }

      .tabs button {
        padding: 0.55rem 1rem;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .tabs button[aria-selected="true"] {
        border-bottom-color: var(--accent);
        color: var(--text);
      }

      .tab-panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .dom-stages {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0.75rem;
        height: 100%;
        padding: 0.75rem;
      }

      .stage-card {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: radial-gradient(ellipse 90% 75% at 50% 45%, #102442 0%, #080e1a 100%);
      }

      .stage-card-heading {
        display: flex;
        flex: 0 0 auto;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.65rem 0.8rem 0.25rem;
        color: var(--teal);
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
      }

      .stage-card-heading span {
        color: var(--muted);
        font-size: 0.68rem;
      }

      .stage-container {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      .ik-svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .ik3d-stage > .mono-line {
        flex: 0 0 auto;
        padding: 0 0.8rem 0.35rem;
      }

      .ik3d-viewport {
        display: flex;
        flex: 1;
        min-height: 0;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .ik3d-world {
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;
        background: radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.08), transparent 70%);
        pointer-events: none;
      }

      .ik3d-goal-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        transform: translate(-50%, -50%);
      }

      .three-stage-wrap {
        height: 100%;
        padding: 0.75rem;
      }

      .sidebar {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 0.9rem;
        overflow-y: auto;
        padding: 1rem;
        border-left: 1px solid var(--border);
        background: var(--card);
      }

      .sidebar h2 {
        margin: 0 0 0.35rem;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .solver-card {
        margin-bottom: 0.75rem;
        padding: 0.75rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #080e1a;
        font-size: 0.75rem;
      }

      .card-title {
        margin-bottom: 0.35rem;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .mono-line {
        color: var(--text);
        font-family: ui-monospace, monospace;
        line-height: 1.5;
      }

      .mono-line.dim {
        color: var(--muted);
        font-size: 0.7rem;
      }

      .chip {
        display: inline-block;
        margin-top: 0.45rem;
        padding: 0.15rem 0.5rem;
        border: 1px solid;
        border-radius: 9999px;
        font-family: ui-monospace, monospace;
        font-size: 0.68rem;
        font-weight: 700;
      }

      .chip.ok {
        border-color: rgba(52, 211, 153, 0.5);
        background: rgba(52, 211, 153, 0.12);
        color: var(--teal);
      }

      .chip.warn {
        border-color: rgba(251, 191, 36, 0.5);
        background: rgba(251, 191, 36, 0.12);
        color: var(--amber);
      }

      .rot-block {
        margin-top: 0.6rem;
        padding-top: 0.45rem;
        border-top: 1px dashed var(--border);
      }

      .rot-row {
        display: flex;
        justify-content: space-between;
        color: var(--text);
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        line-height: 1.55;
      }

      .rot-row span:first-child {
        color: var(--muted);
      }

      .flip-toggle,
      .depth-control {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 0.6rem;
        padding-top: 0.55rem;
        border-top: 1px dashed var(--border);
        cursor: pointer;
        user-select: none;
      }

      .flip-toggle input {
        width: 14px;
        height: 14px;
        accent-color: var(--teal);
      }

      .flip-toggle .note {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.68rem;
      }

      .depth-control {
        flex-wrap: wrap;
      }

      .depth-control input {
        width: 100%;
        accent-color: var(--accent);
      }

      .panel-footer {
        margin-top: auto;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.7rem;
        line-height: 1.55;
      }

      .panel-footer strong {
        color: var(--text);
      }

      [role="button"]:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 3px;
      }

      .ik3d-viewport {
        position: relative;
      }

      .ik3d-world {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: 50% 50%;
        transform-style: preserve-3d;
        perspective-origin: 50% 50%;
        pointer-events: none;
      }

      .ik3d-member {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        pointer-events: none;
      }

      .ik3d-bone {
        position: absolute;
        top: -4px;
        left: 0;
        height: 8px;
        border-radius: 999px;
        transform: translateX(-100%);
      }

      .ik3d-joint {
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid #080c14;
      }

      .ik3d-marker {
        position: absolute;
        left: -9px;
        top: -9px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid;
        background: rgba(8, 12, 20, 0.72);
        pointer-events: none;
      }

      .ik3d-marker.ik3d-goal {
        left: -27px;
        top: -27px;
        width: 54px;
        height: 54px;
        background: rgba(251, 191, 36, 0.18);
        pointer-events: auto;
        touch-action: none;
        cursor: grab;
      }

      @media (max-width: 860px) {
        #playground {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 190px);
        }

        .demo-header {
          padding: 0.7rem 0.9rem 0.55rem;
        }

        .demo-header h1 {
          font-size: 1.1rem;
        }

        .tabs {
          padding-left: 0.9rem;
        }

        .dom-stages {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
          overflow-y: auto;
        }

        .sidebar {
          display: block;
          overflow-x: auto;
          overflow-y: auto;
          padding: 0.65rem 0.9rem;
          border-top: 1px solid var(--border);
          border-left: 0;
        }

        .sidebar > div:first-child {
          display: flex;
          min-width: 620px;
          gap: 0.75rem;
        }

        .sidebar h2 {
          display: none;
        }

        .solver-card {
          width: 280px;
          margin-bottom: 0;
        }

        .panel-footer {
          min-width: 620px;
          margin-top: 0.65rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
