<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motion5 pose gap filler experiment</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        background: #080c14;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .stage {
        position: relative;
        width: 640px;
        height: 480px;
      }

      .stage video,
      .stage canvas,
      .stage svg {
        position: absolute;
        inset: 0;
        width: 640px;
        height: 480px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin: 0.75rem 0;
        font-size: 0.85rem;
      }

      #timings,
      #hotkeys,
      #report {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: #8492a6;
      }

      .solved-chain {
        fill: none;
        stroke: #34d399;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .simulator-views {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: flex-start;
      }

      #debug-view {
        width: 480px;
        height: 360px;
        background: #0f172a;
        touch-action: none;
        cursor: grab;
      }

      #sim-info,
      #sim-edits {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: #cbd5e1;
        margin: 0;
      }

      .dofs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
        gap: 0.25rem 0.75rem;
        font-size: 0.75rem;
      }

      .dofs input {
        width: 8rem;
        vertical-align: middle;
      }

      .mark-raw {
        fill: #8492a6;
      }

      .mark-measured {
        fill: #38bdf8;
      }

      .mark-inferred {
        fill: none;
        stroke: #fbbf24;
        stroke-width: 2;
        stroke-dasharray: 3 2;
      }
    </style>
  </head>
  <body>
    <h1>Pose gap filler</h1>
    <div class="controls">
      <label
        >Source
        <select id="source"></select
      ></label>
      <button id="start" type="button">Start</button>
      <label
        >Space
        <select id="space">
          <option value="image">image (px)</option>
          <option value="world">world (mm)</option>
        </select></label
      >
      <label
        >Filler
        <select id="filler"></select
      ></label>
      <label
        >Stabilizer
        <select id="stabilizer"></select
      ></label>
      <label><input id="show-raw" type="checkbox" /> Show raw landmarks</label>
      <label><input id="mirror" type="checkbox" /> Mirror preview</label>
      <button id="record" type="button">Record landmarks</button>
      <label
        >Calibrate from a still recording
        <input id="calibrate" type="file" accept="application/json"
      /></label>
      <label>Replay a recording <input id="replay" type="file" accept="application/json" /></label>
    </div>
    <p id="hotkeys"></p>
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="truth" hidden></canvas>
      <svg id="overlay"></svg>
    </div>
    <section id="simulator" hidden>
      <div class="controls">
        <label
          >Drive
          <select id="sim-drive"></select
        ></label>
        <label><input id="layer-truth" type="checkbox" checked /> Truth layer</label>
        <label><input id="layer-estimate" type="checkbox" checked /> Estimate layer</label>
        <label
          >Camera yaw <input id="cam-yaw" type="range" min="-180" max="180" step="1" value="0"
        /></label>
        <label
          >pitch <input id="cam-pitch" type="range" min="-60" max="60" step="1" value="0"
        /></label>
        <label
          >distance <input id="cam-distance" type="range" min="1.2" max="6" step="0.1" value="2.6"
        /></label>
        <label
          >Debug view yaw
          <input id="debug-yaw" type="range" min="-180" max="180" step="1" value="55"
        /></label>
        <label
          >pitch <input id="debug-pitch" type="range" min="-60" max="60" step="1" value="20"
        /></label>
      </div>
      <div class="simulator-views">
        <canvas id="debug-view"></canvas>
        <pre id="sim-info"></pre>
      </div>
      <details>
        <summary>Pose mode: joint angles</summary>
        <div id="sim-dofs" class="dofs"></div>
      </details>
      <details>
        <summary>Observation mode: edit what the detector reports</summary>
        <div class="controls">
          <label
            >Landmark
            <select id="edit-landmark"></select
          ></label>
          <label
            >Edit
            <select id="edit-kind"></select
          ></label>
          <label>dx cm <input id="edit-dx" type="number" step="1" value="10" size="4" /></label>
          <label>dy cm <input id="edit-dy" type="number" step="1" value="0" size="4" /></label>
          <label>dz cm <input id="edit-dz" type="number" step="1" value="0" size="4" /></label>
          <label
            >visibility
            <input id="edit-visibility" type="number" min="0" max="1" step="0.05" value="0.1"
          /></label>
          <label
            >presence
            <input id="edit-presence" type="number" min="0" max="1" step="0.05" value="0.9"
          /></label>
          <button id="edit-apply" type="button">Apply edit</button>
          <button id="edit-clear" type="button">Clear edits</button>
        </div>
        <pre id="sim-edits"></pre>
      </details>
    </section>
    <p id="timings"></p>
    <pre id="report"></pre>
    <script type="module" src="./src/live/main.ts"></script>
  </body>
</html>
