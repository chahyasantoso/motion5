ogress: 0,\n      sourceRevisions: {},\n    }));\n    const edges = [\n      { observerId: \"observer\", sourceId: \"b\", role: \"output\" as const },\n      { observerId: \"observer\", sourceId: \"a\", role: \"output\" as const },\n    ];\n    const observer = node(\"observer\", 2, edges, () => ({\n      values: {},\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const batch = new GraphPublisher(registry).flush(\n      snapshot([sourceA, sourceB, observer]),\n      [\"a\", \"b\"],\n      1,\n    );\n    const expectedWinner = edgeKey(edges[0]!) <"+" edgeKey(edges[1]!) ? \"a\" : \"b\";\n    expect(batch.patches.find(({ nodeId }) => nodeId === \"observer\")?.values).toEqual({\n      color: expectedWinner,\n    });\n  });\n});\n"},"packages/core/test/integration/engine-headless.test.ts":{"tests":[{"id":"141","name":"Engine publishes a progress change through the public project handle"},{"id":"142","name":"Engine keeps one clock owner while clock progress publishes once"},{"id":"143","name":"Engine still resolves authored-key plugins during progress updates"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport type { ProjectDefinition } from \"../../src/contract/v5\";\nimport { PluginRegistry } from \"../../src/domain/plugins\";\nimport { Engine } from \"../../src/engine\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../src/ports/fakes\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    {\n      id: \"hero\",\n      trigger: { type: \"manual\" },\n      tracks: [\n        {\n          id: \"arm\",\n          keyframes: {\n            opacity: {\n              stops: [\n                { p: 0, v: 0.2 },\n                { p: 1, v: 1 },\n              ],\n            },\n          },\n        },\n      ],\n    },\n  ],\n  freeTracks: [{ id: \"cursor\" }],\n};\n\ndescribe(\"Engine\", () => {\n  it(\"publishes a progress change through the public project handle\", () => {\n    const runtime = new Engine({\n      clock: createManualClock(),\n      interpolator: createFakeInterpolator(),\n      scheduler: createFakeScheduler(),\n    }).load(project);\n    runtime.mount(\"hero/arm\");\n    let published: { values: Readonly<"+"Record<"+"string, unknown>> } | undefined;\n    runtime.subscribe(\"hero/arm\", (patch) => {\n      published = patch;\n    });\n    const batch = runtime.seek(\"hero/arm\", 0.5);\n    expect(batch.patches.find(({ nodeId }) => nodeId === \"hero/arm\")?.values.opacity).toBeCloseTo(\n      0.6,\n      12,\n    );\n    expect(published?.values.opacity).toBeCloseTo(0.6, 12);\n    runtime.dispose();\n  });\n\n  it(\"keeps one clock owner while clock progress publishes once\", () => {\n    const clock = createManualClock();\n    const subscribe = vi.spyOn(clock, \"subscribe\");\n    const runtime = new Engine({\n      clock,\n      interpolator: createFakeInterpolator(),\n      scheduler: createFakeScheduler(),\n    }).load(project);\n    runtime.mount(\"hero/arm\");\n    runtime.seek(\"hero/arm\", 0.25);\n    expect(subscribe).toHaveBeenCalledTimes(1);\n    runtime.dispose();\n  });\n\n  it(\"still resolves authored-key plugins during progress updates\", () => {\n    const plugins = new PluginRegistry();\n    plugins.register({\n      name: \"opacity\",\n      keys: [\"opacity\"],\n      compose: (values) => ({ ...values, rendered: true }),\n    });\n    const runtime = new Engine({\n      clock: createManualClock(),\n      interpolator: createFakeInterpolator(),\n      scheduler: createFakeScheduler(),\n      plugins,\n    }).load(project);\n    runtime.mount(\"hero/arm\");\n    runtime.subscribe(\"hero/arm\", (patch) => {\n      expect(patch.values).toEqual({ opacity: 1, rendered: true });\n    });\n    runtime.seek(\"hero/arm\", 1);\n    runtime.dispose();\n  });\n});\n"},"packages/core/test/integration/dom-plugin-metadata.test.ts":{"tests":[{"id":"144","name":"DOM plugin metadata (X-2) uses resolved internal-key metadata instead of hardcoding underscore filtering"},{"id":"145","name":"DOM plugin metadata (X-2) serializes plugin-owned outputs before writing to the DOM"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createDomPatchAdapter } from \"../../src/adapters/dom\";\nimport { PluginRegistry } from \"../../src/domain/plugins\";\n\ndescribe(\"DOM plugin metadata (X-2)\", () => {\n  it(\"uses resolved internal-key metadata instead of hardcoding underscore filtering\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"motion\",\n      keys: [\"x\"],\n      internalKeys: [\"secret\", \"offset\"],\n      compose: (values) => values,\n    });\n    const resolved = registry.resolveForKeyframes({ x: {} });\n    expect(resolved.diagnostics).toEqual([]);\n    expect(resolved.internalKeys).toEqual([\"offset\", \"secret\"]);\n    const writes: Record<"+"string, unknown>[] = [];\n    const stage = { style: {} as Record<"+"string, unknown> };\n    const adapter = createDomPatchAdapter(\n      stage,\n      undefined,\n      () => stage,\n      (_target, values) => writes.push({ ...values }),\n      resolved,\n    );\n    adapter.apply({\n      nodeId: \"hero/arm\",\n      revision: 1,\n      values: { x: 10, secret: \"do-not-render\", offset: 4 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n      status: \"ready\",\n      diagnostics: [],\n    });\n    expect(writes).toEqual([{ x: 10 }]);\n  });\n\n  it(\"serializes plugin-owned outputs before writing to the DOM\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"path\",\n      keys: [\"path\"],\n      outputs: [\"transform\"],\n      internalKeys: [\"path\"],\n      outputSerializers: {\n        transform: (value) => {\n          const transform = value as { x: number; y: number };\n          return `translate(${transform.x}px, ${transform.y}px)`;\n        },\n      },\n      compose: (values) => values,\n    });\n    const resolved = registry.resolveForKeyframes({ path: {} });\n    expect(resolved.diagnostics).toEqual([]);\n    expect(resolved.internalKeys).toEqual([\"path\"]);\n    expect(resolved.outputSerializers?.transform?.({ x: 1, y: 2 })).toBe(\"translate(1px, 2px)\");\n    const writes: Record<"+"string, unknown>[] = [];\n    const stage = { style: {} as Record<"+"string, unknown> };\n    const adapter = createDomPatchAdapter(\n      stage,\n      undefined,\n      () => stage,\n      (_target, values) => writes.push({ ...values }),\n      resolved,\n    );\n    adapter.apply({\n      nodeId: \"hero/path\",\n      revision: 1,\n      values: { transform: { x: 10, y: 20 }, path: { points: [] } },\n      sourceProgress: 0,\n      sourceRevisions: {},\n      status: \"ready\",\n      diagnostics: [],\n    });\n    expect(writes).toEqual([{ transform: \"translate(10px, 20px)\" }]);\n  });\n});\n"},"packages/core/test/integration/dom-patch-apply.test.ts":{"tests":[{"id":"146","name":"DOM patch adapter contract (C3) resolves each node, filters internal values, diffs writes, removes omitted keys, and clears cache"},{"id":"147","name":"DOM patch adapter contract (C3) does not write blocked, error, or unresolved patches"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createDomPatchAdapter, type DomTarget } from \"../../src/adapters/dom\";\nimport type { Patch } from \"../../src/runtime/patch-registry\";\n\nfunction patch(\n  revision: number,\n  nodeId: string,\n  values: Readonly<"+"Record<"+"string, unknown>>,\n  status: Patch[\"status\"] = \"ready\",\n): Patch {\n  return {\n    nodeId,\n    revision,\n    values,\n    sourceProgress: 0,\n    sourceRevisions: {},\n    status,\n    diagnostics: [],\n  };\n}\n\ndescribe(\"DOM patch adapter contract (C3)\", () => {\n  it(\"resolves each node, filters internal values, diffs writes, removes omitted keys, and clears cache\", () => {\n    const stage = { style: {} as Record<"+"string, unknown> };\n    const arm: DomTarget = { style: {} };\n    const leg: DomTarget = { style: {} };\n    const writes: Array<"+"{ target: DomTarget; values: Readonly<"+"Record<"+"string, unknown>> }> = [];\n    const adapter = createDomPatchAdapter(\n      stage,\n      undefined,\n      (nodeId) => ({ \"hero/arm\": arm, \"hero/leg\": leg })[nodeId],\n      (target, values) => writes.push({ target, values }),\n    );\n\n    const first = patch(1, \"hero/arm\", {\n      opacity: 1,\n      \"--accent\": \"red\",\n      _internal: \"hidden\",\n      offset: 12,\n    });\n    adapter.apply(first);\n    expect(writes).toEqual([{ target: arm, values: { opacity: 1, \"--accent\": \"red\" } }]);\n    expect(first.values).toEqual({\n      opacity: 1,\n      \"--accent\": \"red\",\n      _internal: \"hidden\",\n      offset: 12,\n    });\n\n    adapter.apply(patch(2, \"hero/arm\", { opacity: 1, \"--accent\": \"red\" }));\n    expect(writes).toHaveLength(1);\n\n    adapter.apply(patch(3, \"hero/arm\", { opacity: 0.5 }));\n    expect(writes[1]).toEqual({ target: arm, values: { opacity: 0.5, \"--accent\": undefined } });\n\n    adapter.apply(patch(4, \"hero/leg\", { opacity: 0.25 }));\n    expect(writes[2]).toEqual({ target: leg, values: { opacity: 0.25 } });\n\n    adapter.clear(arm);\n    adapter.apply(patch(5, \"hero/arm\", { opacity: 0.5 }));\n    expect(writes[3]).toEqual({ target: arm, values: { opacity: 0.5 } });\n  });\n\n  it(\"does not write blocked, error, or unresolved patches\", () => {\n    const stage = { style: {} as Record<"+"string, unknown> };\n    const writes: Array<"+"Readonly<"+"Record<"+"string, unknown>>> = [];\n    const adapter = createDomPatchAdapter(\n      stage,\n      undefined,\n      () => stage,\n      (_target, values) => writes.push(values),\n    );\n\n    adapter.apply(patch(1, \"missing\", { opacity: 1 }, \"blocked\"));\n    adapter.apply(patch(2, \"missing\", { opacity: 1 }, \"error\"));\n    expect(writes).toEqual([]);\n  });\n});\n"},"packages/core/test/unit/runtime/patch-registry-listener-snapshot.test.ts":{"tests":[{"id":"148","name":"PatchRegistry: listener snapshots (recovery P1-6) delivers a settled batch to a node listener that an earlier listener unsubscribed"},{"id":"149","name":"PatchRegistry: listener snapshots (recovery P1-6) does not deliver a settled batch to a node listener subscribed during notification"},{"id":"150","name":"PatchRegistry: listener snapshots (recovery P1-6) node and batch listeners follow the same snapshot rule"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { PatchRegistry } from \"../../../src/runtime/patch-registry\";\n\nconst NODE_ID = \"hero/arm\";\n\nfunction publish(registry: PatchRegistry, tick: number, opacity: number): void {\n  registry.beginBatch(tick, [NODE_ID]);\n  registry.publish({\n    nodeId: NODE_ID,\n    values: { opacity },\n    sourceProgress: 0,\n    status: \"ready\",\n  });\n  registry.closeBatch();\n}\n\ndescribe(\"PatchRegistry: listener snapshots (recovery P1-6)\", () => {\n  it(\"delivers a settled batch to a node listener that an earlier listener unsubscribed\", () => {\n    const registry = new PatchRegistry();\n    const seen: string[] = [];\n    let releaseSecond: (() => void) | undefined;\n\n    registry.subscribeNode(NODE_ID, () => {\n      seen.push(\"first\");\n      releaseSecond?.();\n    });\n    releaseSecond = registry.subscribeNode(NODE_ID, () => {\n      seen.push(\"second\");\n    });\n\n    publish(registry, 1, 1);\n    // The batch was already settled when notification began, so both listeners see it.\n    expect(seen).toEqual([\"first\", \"second\"]);\n\n    publish(registry, 2, 0.5);\n    // The unsubscribe still takes effect for every later batch.\n    expect(seen).toEqual([\"first\", \"second\", \"first\"]);\n  });\n\n  it(\"does not deliver a settled batch to a node listener subscribed during notification\", () => {\n    const registry = new PatchRegistry();\n    const seen: string[] = [];\n\n    registry.subscribeNode(NODE_ID, () => {\n      seen.push(\"first\");\n      if (seen.length === 1)\n        registry.subscribeNode(NODE_ID, () => {\n          seen.push(\"late\");\n        });\n    });\n\n    publish(registry, 1, 1);\n    expect(seen).toEqual([\"first\"]);\n\n    publish(registry, 2, 0.5);\n    expect(seen).toEqual([\"first\", \"first\", \"late\"]);\n  });\n\n  it(\"node and batch listeners follow the same snapshot rule\", () => {\n    const registry = new PatchRegistry();\n    const nodeSeen: string[] = [];\n    const batchSeen: string[] = [];\n    let releaseSecondNode: (() => void) | undefined;\n    let releaseSecondBatch: (() => void) | undefined;\n\n    registry.subscribeNode(NODE_ID, () => {\n      nodeSeen.push(\"first\");\n      releaseSecondNode?.();\n    });\n    releaseSecondNode = registry.subscribeNode(NODE_ID, () => {\n      nodeSeen.push(\"second\");\n    });\n    registry.subscribeBatch(() => {\n      batchSeen.push(\"first\");\n      releaseSecondBatch?.();\n    });\n    releaseSecondBatch = registry.subscribeBatch(() => {\n      batchSeen.push(\"second\");\n    });\n\n    publish(registry, 1, 1);\n    expect(nodeSeen).toEqual(batchSeen);\n  });\n});\n"},"packages/react/test/patch-store-lifecycle.test.ts":{"tests":[{"id":"151","name":"React patch store lifecycle (C1) receives patches again after the last listener leaves and a new one arrives"},{"id":"152","name":"React patch store lifecycle (C1) survives a StrictMode-style double mount without duplicating deliveries"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { PatchRegistry, type Patch } from \"../../core/src/runtime/patch-registry\";\nimport { createPatchStore } from \"../src/patch-store\";\n\nconst NODE_ID = \"hero/arm\";\n\nfunction publish(registry: PatchRegistry, tick: number, opacity: number): void {\n  registry.beginBatch(tick, [NODE_ID]);\n  registry.publish({\n    nodeId: NODE_ID,\n    values: { opacity },\n    sourceProgress: 0,\n    status: \"ready\",\n  });\n  registry.closeBatch();\n}\n\ndescribe(\"React patch store lifecycle (C1)\", () => {\n  it(\"receives patches again after the last listener leaves and a new one arrives\", () => {\n    const registry = new PatchRegistry();\n    const store = createPatchStore(registry, NODE_ID);\n\n    const mounted: number[] = [];\n    const unmount = store.subscribe((patch) => mounted.push(patch.revision));\n    publish(registry, 1, 1);\n    expect(mounted).toEqual([1]);\n\n    unmount();\n    // Published while nothing is mounted: no listener may run, but the store must not keep\n    // reporting the patch it happened to see before it was torn down.\n    publish(registry, 2, 0.5);\n\n    const remounted: number[] = [];\n    const unmountAgain = store.subscribe((patch) => remounted.push(patch.revision));\n    expect(store.getSnapshot()?.revision).toBe(2);\n    expect(store.getSnapshot()?.values).toEqual({ opacity: 0.5 });\n\n    publish(registry, 3, 0);\n    expect(remounted).toEqual([3]);\n    expect(mounted).toEqual([1]);\n    expect(store.getSnapshot()?.revision).toBe(3);\n\n    unmountAgain();\n  });\n\n  it(\"survives a StrictMode-style double mount without duplicating deliveries\", () => {\n    const registry = new PatchRegistry();\n    const store = createPatchStore(registry, NODE_ID);\n    const seen: number[] = [];\n    const listener = (patch: Patch): void => {\n      seen.push(patch.revision);\n    };\n\n    // StrictMode runs the subscribe effect, tears it down, and runs it again.\n    store.subscribe(listener)();\n    const unmount = store.subscribe(listener);\n\n    publish(registry, 1, 1);\n    // Exactly one delivery proves the first attach was released instead of leaked.\n    expect(seen).toEqual([1]);\n\n    unmount();\n    publish(registry, 2, 0);\n    expect(seen).toEqual([1]);\n    expect(store.getSnapshot()?.revision).toBe(2);\n  });\n});\n"},"packages/core/test/integration/project-runtime.test.ts":{"tests":[{"id":"153","name":"ProjectRuntime TR-R-14 mounts through one project-owned GraphRuntime"},{"id":"154","name":"ProjectRuntime rejects invalid candidates before constructing a replacement runtime"},{"id":"155","name":"ProjectRuntime releases every mounted instance and clock subscription on repeated dispose"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../src/contract/v5\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { ProjectRuntime } from \"../../src/runtime/project-runtime\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [{ id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] }],\n  freeTracks: [{ id: \"cursor\" }],\n};\nconst compose = (node: { id: string }) => () => ({\n  values: { node: node.id },\n  sourceProgress: 0,\n  sourceRevisions: {},\n});\n\ndescribe(\"ProjectRuntime\", () => {\n  it(\"TR-R-14 mounts through one project-owned GraphRuntime\", () => {\n    const clock = createManualClock();\n    const runtime = new ProjectRuntime(project, { clock, compose });\n    const first = {};\n    runtime.mount(\"hero/arm\", first);\n    expect(runtime.instanceCount).toBe(1);\n    expect(runtime.graph.memberCount).toBe(1);\n    expect(() => runtime.mount(\"hero/arm\", {})).toThrow(TypeError);\n    runtime.unmount(\"hero/arm\");\n    expect(runtime.instanceCount).toBe(0);\n    expect(runtime.graph.memberCount).toBe(0);\n    runtime.dispose();\n  });\n\n  it(\"rejects invalid candidates before constructing a replacement runtime\", () => {\n    const clock = createManualClock();\n    const invalid: ProjectDefinition = {\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [{ id: \"arm\", observes: [{ source: \"missing\" }] }],\n        },\n      ],\n      freeTracks: [{ id: \"cursor\" }],\n    };\n    expect(() => new ProjectRuntime(invalid, { clock, compose })).toThrow(TypeError);\n  });\n\n  it(\"releases every mounted instance and clock subscription on repeated dispose\", () => {\n    const clock = createManualClock();\n    let subscriptions = 0;\n    const subscribe = clock.subscribe;\n    clock.subscribe = ((listener) => {\n      subscriptions += 1;\n      return subscribe(listener);\n    }) as typeof clock.subscribe;\n    const runtime = new ProjectRuntime(project, { clock, compose });\n    runtime.mount(\"hero/arm\");\n    runtime.dispose();\n    runtime.dispose();\n    expect(runtime.instanceCount).toBe(0);\n    expect(subscriptions).toBe(1);\n    expect(() => clock.tick()).not.toThrow();\n  });\n});\n"},"packages/core/test/unit/domain/plugin-contribution-completeness.test.ts":{"tests":[{"id":"156","name":"S5 contribution completeness rejects a contributed key with no registered owner"},{"id":"157","name":"S5 contribution completeness rejects a contributor attempting to overwrite a reserved tween var"},{"id":"158","name":"S5 contribution completeness bounds a two-hop contribution chain instead of silently accepting it"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ImmutableRecord } from \"../../../src/domain/values\";\nimport { PluginRegistry } from \"../../../src/domain/plugins\";\n\nconst compose = (values: Readonly<"+"ImmutableRecord>): ImmutableRecord => values;\nconst property = (value: number) => ({\n  stops: [\n    { p: 0, v: value },\n    { p: 1, v: value + 1 },\n  ],\n});\n\ndescribe(\"S5 contribution completeness\", () => {\n  it(\"rejects a contributed key with no registered owner\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"base\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({ keyframes: { derived: property(1) } }),\n      compose,\n    });\n\n    const resolved = registry.resolveForKeyframes({ x: property(0) }, \"track.keyframes\");\n    expect(resolved.diagnostics.map(({ ruleId }) => ruleId)).toContain(\"plugin-unknown-key\");\n  });\n\n  it(\"rejects a contributor attempting to overwrite a reserved tween var\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"base\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({ tweenVars: { duration: 99 } }),\n      compose,\n    });\n\n    const resolved = registry.resolveForKeyframes({ x: property(0) }, \"track.keyframes\");\n    expect(resolved.diagnostics.map(({ ruleId }) => ruleId)).toContain(\n      \"plugin-contribution-reserved-tween-var\",\n    );\n    expect(resolved.preparation.tweenVars).not.toHaveProperty(\"duration\");\n  });\n\n  it(\"bounds a two-hop contribution chain instead of silently accepting it\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"base\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({ keyframes: { derived: property(1) } }),\n      compose,\n    });\n    registry.register({\n      name: \"derived-owner\",\n      keys: [\"derived\"],\n      stage: \"prepare\",\n      contribute: () => ({ keyframes: { second: property(2) } }),\n      compose,\n    });\n\n    const resolved = registry.resolveForKeyframes({ x: property(0) }, \"track.keyframes\");\n    expect(resolved.diagnostics.map(({ ruleId }) => ruleId)).toContain(\n      \"plugin-contribution-cascade\",\n    );\n  });\n});\n"},"packages/core/test/unit/domain/s7-plugin-evidence.test.ts":{"tests":[{"id":"159","name":"S7 plugin evidence invokes each owned contributor exactly once and permits identical tween vars"},{"id":"160","name":"S7 plugin evidence keeps preparation and diagnostics deterministic across registration order"},{"id":"161","name":"S7 plugin evidence sorts duplicate output diagnostic ids"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport type { ImmutableRecord } from \"../../../src/domain/values\";\nimport { PluginRegistry } from \"../../../src/domain/plugins\";\n\nconst compose = (values: Readonly<"+"ImmutableRecord>): ImmutableRecord => values;\n\nfunction contributor(name: string, output: string, ease = \"none\") {\n  return {\n    name,\n    keys: [output],\n    stage: \"prepare\" as const,\n    contribute: vi.fn(() => ({ tweenVars: { ease } })),\n    compose,\n  };\n}\n\ndescribe(\"S7 plugin evidence\", () => {\n  it(\"invokes each owned contributor exactly once and permits identical tween vars\", () => {\n    const registry = new PluginRegistry();\n    const first = contributor(\"first\", \"x\");\n    const second = contributor(\"second\", \"y\");\n    registry.register(first);\n    registry.register(second);\n\n    const resolved = registry.resolveForKeyframes({ x: { stops: [] }, y: { stops: [] } });\n\n    expect(first.contribute).toHaveBeenCalledOnce();\n    expect(second.contribute).toHaveBeenCalledOnce();\n    expect(resolved.diagnostics).toEqual([]);\n    expect(resolved.preparation.tweenVars).toEqual({ ease: \"none\" });\n  });\n\n  it(\"keeps preparation and diagnostics deterministic across registration order\", () => {\n    const resolve = (reverse: boolean) => {\n      const registry = new PluginRegistry();\n      const plugins = [contributor(\"first\", \"x\"), contributor(\"second\", \"y\")];\n      for (const plugin of reverse ? plugins.reverse() : plugins) registry.register(plugin);\n      return registry.resolveForKeyframes({ x: { stops: [] }, y: { stops: [] } });\n    };\n\n    const forward = resolve(false);\n    const reverse = resolve(true);\n    expect(forward.preparation).toEqual(reverse.preparation);\n    expect(forward.diagnostics).toEqual(reverse.diagnostics);\n  });\n\n  it(\"sorts duplicate output diagnostic ids\", () => {\n    const registry = new PluginRegistry();\n    registry.register({ name: \"zeta\", keys: [\"x\"], outputs: [\"transform\"], compose });\n    registry.register({ name: \"alpha\", keys: [\"y\"], outputs: [\"transform\"], compose });\n\n    expect(registry.resolveForKeyframes({ x: {}, y: {} }).diagnostics[0]?.ids).toEqual([\n      \"alpha\",\n      \"transform\",\n      \"zeta\",\n    ]);\n  });\n});\n"},"packages/core/test/integration/end-to-end.test.ts":{"tests":[{"id":"162","name":"real end-to-end product path (E2) writes authored GSAP output through a patch into the DOM adapter"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../src/contract/v5\";\nimport { createDomPatchAdapter } from \"../../src/adapters/dom\";\nimport { Engine } from \"../../src/engine\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { createFakeScheduler } from \"../../src/ports/fakes\";\nimport type { Patch } from \"../../src/runtime/patch-registry\";\nimport { createRealGsapSeam } from \"../support/real-gsap\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    {\n      id: \"hero\",\n      trigger: { type: \"manual\" },\n      tracks: [\n        {\n          id: \"arm\",\n          keyframes: {\n            opacity: {\n              stops: [\n                { p: 0, v: 0 },\n                { p: 1, v: 1 },\n              ],\n            },\n          },\n        },\n      ],\n    },\n  ],\n};\n\ndescribe(\"real end-to-end product path (E2)\", () => {\n  it(\"writes authored GSAP output through a patch into the DOM adapter\", () => {\n    const stage = { style: {} as Record<"+"string, unknown> };\n    const target = { style: { opacity: 0 } as Record<"+"string, unknown> };\n    const dom = createDomPatchAdapter(stage, undefined, (nodeId) =>\n      nodeId === \"hero/arm\" ? target : undefined,\n    );\n    const seam = createRealGsapSeam();\n    const runtime = new Engine({\n      clock: createManualClock(),\n      interpolator: seam.interpolator,\n      scheduler: createFakeScheduler(),\n    }).load(project);\n\n    runtime.mount(\"hero/arm\");\n    let patch: Patch | undefined;\n    runtime.subscribe(\"hero/arm\", (next) => {\n      patch = next;\n    });\n    runtime.seek(\"hero/arm\", 0);\n    runtime.seek(\"hero/arm\", 0.5);\n\n    expect(patch).toBeDefined();\n    expect(patch?.values.opacity).toBeCloseTo(0.5, 10);\n\n    dom.apply(patch!);\n    expect(target.style.opacity).toBeCloseTo(0.5, 10);\n\n    // The product path must own the only clock: real GSAP, not the fixture, confirms the\n    // adapter's timeline is paused.\n    expect(seam.created[0]?.paused()).toBe(true);\n\n    runtime.dispose();\n  });\n});\n"},"packages/core/test/integration/partial-seed-inputs.test.ts":{"tests":[{"id":"163","name":"GraphPublisher partial-seed inputs uses the last published flat value for an unseeded input source"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { GraphEdge, GraphIR } from \"../../src/graph/ir\";\nimport { GraphPublisher, type PublisherNode } from \"../../src/runtime/graph-publisher\";\nimport { PatchRegistry } from \"../../src/runtime/patch-registry\";\n\nconst snapshot = (\n  nodes: readonly PublisherNode[],\n): GraphIR & { nodes: readonly PublisherNode[] } => ({\n  nodes,\n  nodeById: Object.freeze(Object.fromEntries(nodes.map((node) => [node.id, node]))),\n  order: Object.freeze(nodes.map(({ id }) => id)),\n  diagnostics: Object.freeze([]),\n});\n\nconst node = (\n  id: string,\n  authoredIndex: number,\n  edges: readonly GraphEdge[],\n  compose: PublisherNode[\"compose\"],\n): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex,\n    track: { id },\n    edges: Object.freeze(edges),\n    compose,\n  });\n\ndescribe(\"GraphPublisher partial-seed inputs\", () => {\n  it(\"uses the last published flat value for an unseeded input source\", () => {\n    const registry = new PatchRegistry();\n    let a = 2;\n    const sourceA = node(\"source-a\", 0, [], () => ({\n      values: { a },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const sourceB = node(\"source-b\", 1, [], () => ({\n      values: { b: 3 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const sink = node(\n      \"sink\",\n      2,\n      [\n        { observerId: \"sink\", sourceId: \"source-a\", role: \"input\", target: \"a\" },\n        { observerId: \"sink\", sourceId: \"source-b\", role: \"input\", target: \"b\" },\n      ],\n      (inputs) => ({\n        values: { total: (inputs.a as number) + (inputs.b as number) },\n        sourceProgress: 0,\n        sourceRevisions: {},\n      }),\n    );\n    const graph = snapshot([sourceA, sourceB, sink]);\n    const publisher = new GraphPublisher(registry);\n\n    publisher.flush(graph, [\"source-a\", \"source-b\"], 1);\n    a = 4;\n    const batch = publisher.flush(graph, [\"source-a\"], 2);\n\n    expect(batch.patches.find(({ nodeId }) => nodeId === \"sink\")?.values).toEqual({ total: 7 });\n  });\n});\n"},"packages/core/test/integration/contract-baseline.test.ts":{"tests":[{"id":"164","name":"P0-05 v5 contract integration serializes the minimal project deterministically"},{"id":"165","name":"P0-05 v5 contract integration accepts a project with a shared free track"},{"id":"166","name":"P0-05 v5 contract integration preserves warnings without rejecting the project"},{"id":"167","name":"P0-05 v5 contract integration rejects cycles before runtime mounting"},{"id":"168","name":"P0-05 v5 contract integration migrates a v4 document without changing its source"}],"source":"import { describe, expect, it } from \"vitest\";\n\nimport { migrateV4ToV5 } from \"../../src/contract/migrate-v4-to-v5\";\nimport { serializeGolden } from \"../../src/contract/golden\";\nimport { validateV5 } from \"../../src/contract/validate-v5\";\nimport {\n  cyclicProject,\n  freeTrackProject,\n  minimalV5Project,\n  perspectiveWarningProject,\n} from \"../fixtures/v5-contract\";\n\ndescribe(\"P0-05 v5 contract integration\", () => {\n  it(\"serializes the minimal project deterministically\", () => {\n    const first = serializeGolden(minimalV5Project);\n    const second = serializeGolden({ freeTracks: [], motions: [], schemaVersion: 5 });\n    expect(first).toBe(second);\n    expect(first).toContain('\"schemaVersion\": 5');\n  });\n\n  it(\"accepts a project with a shared free track\", () => {\n    const result = validateV5(freeTrackProject);\n    expect(result.valid).toBe(true);\n    expect(result.diagnostics).toEqual([]);\n  });\n\n  it(\"preserves warnings without rejecting the project\", () => {\n    const result = validateV5(perspectiveWarningProject);\n    expect(result.valid).toBe(true);\n    expect(result.diagnostics).toContainEqual(\n      expect.objectContaining({ ruleId: \"perspective-usage\", severity: \"warning\" }),\n    );\n  });\n\n  it(\"rejects cycles before runtime mounting\", () => {\n    const result = validateV5(cyclicProject);\n    expect(result.valid).toBe(false);\n    expect(result.diagnostics).toContainEqual(\n      expect.objectContaining({ ruleId: \"graph-cycle\", severity: \"error\" }),\n    );\n  });\n\n  it(\"migrates a v4 document without changing its source\", () => {\n    const source = { schemaVersion: 4, tracks: [{ id: \"cursor\" }], motions: [] };\n    const before = serializeGolden(source);\n    const result = migrateV4ToV5(source);\n    expect(result.diagnostics).toEqual([]);\n    expect(result.migrated?.schemaVersion).toBe(5);\n    expect(serializeGolden(source)).toBe(before);\n  });\n});\n"},"packages/core/test/contract/gsap-paused-timeline.test.ts":{"tests":[{"id":"169","name":"GSAP interpolator clock ownership (P0-2) creates a paused parent timeline so the project clock is the only clock owner"},{"id":"170","name":"GSAP interpolator clock ownership (P0-2) is paused according to real GSAP, not according to the fixture"}],"source":"import { describe, expect, it } from \"vitest\";\nimport {\n  createGsapInterpolator,\n  type GsapTimelineLike,\n} from \"../../src/adapters/interpolator/gsap\";\nimport { createRealGsapSeam } from \"../support/real-gsap\";\n\ndescribe(\"GSAP interpolator clock ownership (P0-2)\", () => {\n  it(\"creates a paused parent timeline so the project clock is the only clock owner\", () => {\n    let receivedVars: Record<"+"string, unknown> | undefined;\n    let currentDuration = 1;\n    let currentProgress = 0;\n    function duration(): number;\n    function duration(value: number): GsapTimelineLike;\n    function duration(value?: number): number | GsapTimelineLike {\n      if (value === undefined) return currentDuration;\n      currentDuration = value;\n      return timeline;\n    }\n    function progress(): number;\n    function progress(value: number): GsapTimelineLike;\n    function progress(value?: number): number | GsapTimelineLike {\n      if (value === undefined) return currentProgress;\n      currentProgress = value;\n      return timeline;\n    }\n    const timeline: GsapTimelineLike = {\n      duration,\n      progress,\n      to: () => timeline,\n      kill() {},\n    };\n    const interpolator = createGsapInterpolator({\n      timeline(vars) {\n        receivedVars = vars;\n        return timeline;\n      },\n    });\n\n    interpolator.create({ duration: 1, keyframes: {} });\n\n    expect(receivedVars).toMatchObject({ paused: true });\n  });\n\n  it(\"is paused according to real GSAP, not according to the fixture\", () => {\n    const seam = createRealGsapSeam();\n    seam.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n    expect(seam.created).toHaveLength(1);\n    expect(seam.created[0]?.paused()).toBe(true);\n  });\n});\n"},"packages/core/test/unit/graph/ids.test.ts":{"tests":[{"id":"171","name":"qualified node ids qualifies motion and free tracks exactly once"},{"id":"172","name":"qualified node ids round-trips qualified ids without losing identity"},{"id":"173","name":"qualified node ids rejects reserved or malformed authored ids"},{"id":"174","name":"qualified node ids keeps same local names distinct across owners"},{"id":"175","name":"qualified node ids returns frozen identity records"}],"source":"import { describe, expect, it } from \"vitest\";\nimport {\n  assertAuthoredMotionId,\n  assertAuthoredTrackId,\n  parseQualifiedId,\n  qualifyFreeTrack,\n  qualifyMotionTrack,\n} from \"../../../src/graph/ids\";\n\ndescribe(\"qualified node ids\", () => {\n  it(\"qualifies motion and free tracks exactly once\", () => {\n    expect(qualifyMotionTrack(\"hero\", \"arm\")).toEqual({\n      kind: \"motion\",\n      motionId: \"hero\",\n      trackId: \"arm\",\n      value: \"hero/arm\",\n    });\n    expect(qualifyFreeTrack(\"cursor\")).toEqual({\n      kind: \"free\",\n      trackId: \"cursor\",\n      value: \"~/cursor\",\n    });\n  });\n\n  it(\"round-trips qualified ids without losing identity\", () => {\n    const motion = qualifyMotionTrack(\"hero\", \"arm\");\n    const free = qualifyFreeTrack(\"cursor\");\n    expect(parseQualifiedId(motion.value)).toEqual(motion);\n    expect(parseQualifiedId(free.value)).toEqual(free);\n  });\n\n  it(\"rejects reserved or malformed authored ids\", () => {\n    expect(() => assertAuthoredMotionId(\"hero/child\")).toThrow(/cannot contain/);\n    expect(() => assertAuthoredMotionId(\"~\")).toThrow(/reserved/);\n    expect(() => assertAuthoredTrackId(\"arm/child\")).toThrow(/cannot contain/);\n    expect(() => assertAuthoredTrackId(\"\")).toThrow(/non-empty/);\n    expect(() => parseQualifiedId(\"hero/arm/extra\")).toThrow(/Qualified id/);\n    expect(() => parseQualifiedId(\"~/\")).toThrow(/non-empty/);\n  });\n\n  it(\"keeps same local names distinct across owners\", () => {\n    expect(qualifyMotionTrack(\"hero\", \"cursor\").value).not.toBe(qualifyFreeTrack(\"cursor\").value);\n  });\n\n  it(\"returns frozen identity records\", () => {\n    expect(Object.isFrozen(qualifyMotionTrack(\"hero\", \"arm\"))).toBe(true);\n    expect(Object.isFrozen(qualifyFreeTrack(\"cursor\"))).toBe(true);\n  });\n});\n"},"packages/core/test/unit/graph/observation-projection-validation.test.ts":{"tests":[{"id":"176","name":"observation projection validation (X-1) rejects an input projection that is neither pick nor map"},{"id":"177","name":"observation projection validation (X-1) accepts projected input observations without the compatibility target"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../../src/contract/v5\";\nimport { buildGraphIR } from \"../../../src/graph/ir\";\n\ndescribe(\"observation projection validation (X-1)\", () => {\n  it(\"rejects an input projection that is neither pick nor map\", () => {\n    const project = {\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            { id: \"source\" },\n            {\n              id: \"observer\",\n              observes: [\n                {\n                  source: \"source\",\n                  role: \"input\",\n                  projection: { nope: true },\n                },\n              ],\n            },\n          ],\n        },\n      ],\n    } as unknown as ProjectDefinition;\n\n    expect(buildGraphIR(project).diagnostics.map(({ ruleId }) => ruleId)).toContain(\n      \"observation-input-projection\",\n    );\n  });\n\n  it(\"accepts projected input observations without the compatibility target\", () => {\n    const project = {\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            { id: \"source\" },\n            {\n              id: \"observer\",\n              observes: [\n                {\n                  source: \"source\",\n                  role: \"input\",\n                  projection: { pick: [\"opacity\"] },\n                },\n              ],\n            },\n          ],\n        },\n      ],\n    } as unknown as ProjectDefinition;\n\n    expect(buildGraphIR(project).diagnostics).toEqual([]);\n  });\n});\n"},"packages/core/test/integration/dom-transform-removal.test.ts":{"tests":[{"id":"178","name":"DOM transform and removal contract (P0-4) writes motion transform keys into style.transform"},{"id":"179","name":"DOM transform and removal contract (P0-4) removes omitted CSS properties instead of assigning undefined"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createDomPatchAdapter } from \"../../src/adapters/dom\";\nimport type { Patch } from \"../../src/runtime/patch-registry\";\n\nfunction patch(revision: number, values: Readonly<"+"Record<"+"string, unknown>>): Patch {\n  return {\n    nodeId: \"hero/arm\",\n    revision,\n    values,\n    sourceProgress: 0,\n    sourceRevisions: {},\n    status: \"ready\",\n    diagnostics: [],\n  };\n}\n\ndescribe(\"DOM transform and removal contract (P0-4)\", () => {\n  it(\"writes motion transform keys into style.transform\", () => {\n    const style: Record<"+"string, unknown> = {};\n    const target = { style };\n    const adapter = createDomPatchAdapter(target);\n\n    adapter.apply(patch(1, { x: 10, y: 20, rotation: 30, scale: 2 }));\n\n    expect(style.transform).toBe(\"translate3d(10px, 20px, 0px) rotate(30deg) scale(2)\");\n    expect(target).not.toHaveProperty(\"x\");\n    expect(target).not.toHaveProperty(\"rotation\");\n  });\n\n  it(\"removes omitted CSS properties instead of assigning undefined\", () => {\n    const removed: string[] = [];\n    const style: Record<"+"string, unknown> & { removeProperty: (key: string) => void } = {\n      opacity: \"1\",\n      removeProperty(key) {\n        removed.push(key);\n        delete this[key];\n      },\n    };\n    const target = { style };\n    const adapter = createDomPatchAdapter(target);\n\n    adapter.apply(patch(1, { opacity: 1 }));\n    adapter.apply(patch(2, {}));\n\n    expect(removed).toEqual([\"opacity\"]);\n    expect(style.opacity).toBeUndefined();\n  });\n});\n"},"packages/core/test/contract/s4-validation-owner.test.ts":{"tests":[{"id":"180","name":"S4 single authored-stop validator exports the shared validator and reports authored missing-boundary warnings"},{"id":"181","name":"S4 single authored-stop validator uses the same validation rules for contributed properties with a namespaced prefix"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { validateKeyframes } from \"../../src/contract/validate-v5\";\nimport type { Diagnostic } from \"../../src/contract/v5\";\n\ndescribe(\"S4 single authored-stop validator\", () => {\n  it(\"exports the shared validator and reports authored missing-boundary warnings\", () => {\n    const diagnostics: Diagnostic[] = [];\n    validateKeyframes({ opacity: { stops: [{ p: 0.5, v: 1 }] } }, \"track.keyframes\", diagnostics);\n    expect(diagnostics.map(({ ruleId, severity }) => ({ ruleId, severity }))).toEqual([\n      { ruleId: \"stop-missing-start\", severity: \"warning\" },\n      { ruleId: \"stop-missing-end\", severity: \"warning\" },\n    ]);\n  });\n\n  it(\"uses the same validation rules for contributed properties with a namespaced prefix\", () => {\n    const diagnostics: Diagnostic[] = [];\n    validateKeyframes(\n      {\n        derived: {\n          stops: [\n            { p: 0.8, v: 1 },\n            { p: 0.2, v: 2 },\n          ],\n        },\n      },\n      \"track.keyframes\",\n      diagnostics,\n      { ruleIdPrefix: \"plugin-contribution-\" },\n    );\n    expect(diagnostics.map(({ ruleId, severity }) => ({ ruleId, severity }))).toEqual([\n      { ruleId: \"plugin-contribution-stop-position-order\", severity: \"error\" },\n      { ruleId: \"plugin-contribution-stop-missing-start\", severity: \"warning\" },\n      { ruleId: \"plugin-contribution-stop-missing-end\", severity: \"warning\" },\n    ]);\n  });\n});\n"},"packages/react/test/patch-store.test.ts":{"tests":[{"id":"182","name":"React patch consumer boundary keeps one frozen snapshot per revision and unsubscribes cleanly"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { PatchRegistry } from \"../../core/src/runtime/patch-registry\";\nimport { createPatchStore } from \"../src/patch-store\";\n\ndescribe(\"React patch consumer boundary\", () => {\n  it(\"keeps one frozen snapshot per revision and unsubscribes cleanly\", () => {\n    const registry = new PatchRegistry();\n    const store = createPatchStore(registry, \"hero/arm\");\n    const seen: number[] = [];\n    const unsubscribe = store.subscribe((patch) => seen.push(patch.revision));\n\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.publish({\n      nodeId: \"hero/arm\",\n      values: { opacity: 1 },\n      sourceProgress: 0,\n      status: \"ready\",\n    });\n    registry.closeBatch();\n    const first = store.getSnapshot();\n    expect(first?.revision).toBe(1);\n    expect(Object.isFrozen(first)).toBe(true);\n    expect(seen).toEqual([1]);\n\n    registry.beginBatch(2, [\"hero/arm\"]);\n    registry.publish({\n      nodeId: \"hero/arm\",\n      values: { opacity: 1 },\n      sourceProgress: 0,\n      status: \"ready\",\n    });\n    registry.closeBatch();\n    expect(store.getSnapshot()).toBe(first);\n    expect(seen).toEqual([1]);\n\n    unsubscribe();\n    registry.beginBatch(3, [\"hero/arm\"]);\n    registry.publish({\n      nodeId: \"hero/arm\",\n      values: { opacity: 0 },\n      sourceProgress: 0,\n      status: \"ready\",\n    });\n    registry.closeBatch();\n    expect(seen).toEqual([1]);\n  });\n});\n"},"packages/react/test/public-hook-render.test.ts":{"tests":[{"id":"183","name":"React public hook render/update (C2) renders the current patch and updates after publication"}],"source":"import { act, create } from \"react-test-renderer\";\nimport { describe, expect, it } from \"vitest\";\nimport { createElement } from \"react\";\nimport { PatchRegistry } from \"../../core/src/runtime/patch-registry\";\nimport { usePatch } from \"../src/index\";\n\nfunction publish(registry: PatchRegistry, tick: number, opacity: number): void {\n  registry.beginBatch(tick, [\"hero/arm\"]);\n  registry.publish({\n    nodeId: \"hero/arm\",\n    values: { opacity },\n    sourceProgress: 0,\n    status: \"ready\",\n  });\n  registry.closeBatch();\n}\n\ndescribe(\"React public hook render/update (C2)\", () => {\n  it(\"renders the current patch and updates after publication\", () => {\n    const registry = new PatchRegistry();\n    const snapshots: Array<"+"number | undefined> = [];\n    function Consumer(): null {\n      const patch = usePatch(registry, \"hero/arm\");\n      snapshots.push(patch?.values.opacity as number | undefined);\n      return null;\n    }\n\n    let renderer: { toJSON(): unknown; unmount(): void };\n    act(() => {\n      renderer = create(createElement(Consumer, null));\n    });\n    expect(snapshots).toEqual([undefined]);\n\n    act(() => publish(registry, 1, 1));\n    expect(snapshots).toEqual([undefined, 1]);\n\n    act(() => publish(registry, 2, 0.5));\n    expect(snapshots).toEqual([undefined, 1, 0.5]);\n    renderer!.unmount();\n  });\n});\n"},"packages/core/test/integration/project-handle-surface.test.ts":{"tests":[{"id":"184","name":"public project handle surface (P1-9) does not expose graph internals through Engine.load"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { Engine } from \"../../src/engine\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../src/ports/fakes\";\n\nconst project = {\n  schemaVersion: 5 as const,\n  motions: [{ id: \"hero\", trigger: { type: \"manual\" as const }, tracks: [{ id: \"arm\" }] }],\n};\n\ndescribe(\"public project handle surface (P1-9)\", () => {\n  it(\"does not expose graph internals through Engine.load\", () => {\n    const runtime = new Engine({\n      clock: createManualClock(),\n      interpolator: createFakeInterpolator(),\n      scheduler: createFakeScheduler(),\n    }).load(project);\n\n    expect((runtime as unknown as { graph?: unknown }).graph).toBeUndefined();\n    expect((runtime as unknown as { binding?: unknown }).binding).toBeUndefined();\n    expect((runtime as unknown as { registry?: unknown }).registry).toBeUndefined();\n    expect((runtime as unknown as { publisher?: unknown }).publisher).toBeUndefined();\n    expect(Object.keys(runtime).sort()).toEqual([\n      \"dispose\",\n      \"mount\",\n      \"seek\",\n      \"subscribe\",\n      \"unmount\",\n    ]);\n    runtime.dispose();\n  });\n});\n"},"packages/core/test/integration/membership-gating.test.ts":{"tests":[{"id":"185","name":"GraphRuntime membership starts empty and publishes only attached nodes by default"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../src/contract/v5\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { GraphRuntime } from \"../../src/runtime/graph-runtime\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [{ id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] }],\n  freeTracks: [{ id: \"cursor\" }],\n};\n\nconst compose = (node: { id: string }) => () => ({\n  values: { node: node.id },\n  sourceProgress: 0,\n  sourceRevisions: {},\n});\n\ndescribe(\"GraphRuntime membership\", () => {\n  it(\"starts empty and publishes only attached nodes by default\", () => {\n    const runtime = new GraphRuntime(project, createManualClock(), compose);\n    expect(runtime.memberCount).toBe(0);\n    const batch = runtime.flush();\n    expect(batch.seeds).toEqual([]);\n    expect(batch.patches).toEqual([]);\n    runtime.attach(\"hero/arm\");\n    expect(runtime.memberCount).toBe(1);\n    expect(runtime.flush().seeds).toEqual([\"hero/arm\"]);\n    runtime.detach(\"hero/arm\");\n    expect(runtime.memberCount).toBe(0);\n    expect(runtime.flush().seeds).toEqual([]);\n    runtime.dispose();\n  });\n});\n"},"packages/core/test/integration/plugin-use-contract.test.ts":{"tests":[{"id":"186","name":"S6 plugin use contract rejects the dead TrackDefinition.use field instead of silently ignoring it"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { Engine } from \"../../src/engine\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../src/ports/fakes\";\n\ndescribe(\"S6 plugin use contract\", () => {\n  it(\"rejects the dead TrackDefinition.use field instead of silently ignoring it\", () => {\n    const interpolator = createFakeInterpolator();\n    expect(() =>\n      new Engine({\n        clock: createManualClock(),\n        interpolator,\n        scheduler: createFakeScheduler(),\n      }).load({\n        schemaVersion: 5,\n        motions: [\n          {\n            id: \"hero\",\n            trigger: { type: \"manual\" },\n            tracks: [{ id: \"arm\", use: \"some-plugin\", keyframes: {} }],\n          },\n        ],\n      } as never),\n    ).toThrow(/plugin-contribution-unsupported-entry|use/);\n  });\n});\n"},"packages/core/test/contract/gsap-multi-stop.test.ts":{"tests":[{"id":"187","name":"GSAP multi-stop compilation (B2) interpolates authored stops at 0, 0.5, and 1 using real GSAP state"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createRealGsapSeam } from \"../support/real-gsap\";\n\ndescribe(\"GSAP multi-stop compilation (B2)\", () => {\n  it(\"interpolates authored stops at 0, 0.5, and 1 using real GSAP state\", () => {\n    const seam = createRealGsapSeam();\n\n    const timeline = seam.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 50 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n\n    expect(timeline.state).toMatchObject({ x: 0 });\n    timeline.progress(0.5);\n    expect(timeline.state).toMatchObject({ x: 50 });\n    timeline.progress(1);\n    expect(timeline.state).toMatchObject({ x: 100 });\n    timeline.kill();\n  });\n});\n"},"packages/core/test/unit/placeholder.test.ts":{"tests":[{"id":"188","name":"@motion5/core placeholder surface pins the authored schema contract at version 5"},{"id":"189","name":"@motion5/core placeholder surface versions the runtime independently of the authored schema"}],"source":"import { describe, expect, it } from \"vitest\";\n\nimport { AUTHORED_SCHEMA_VERSION, CORE_VERSION } from \"../../src/index\";\n\ndescribe(\"@motion5/core placeholder surface\", () => {\n  it(\"pins the authored schema contract at version 5\", () => {\n    expect(AUTHORED_SCHEMA_VERSION).toBe(5);\n  });\n\n  it(\"versions the runtime independently of the authored schema\", () => {\n    expect(CORE_VERSION).not.toBe(String(AUTHORED_SCHEMA_VERSION));\n  });\n});\n"}},"projectRoot":"/home/runner/work/motion5/motion5","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","packageManager":"npm","plugins":["@stryker-mutator/vitest-runner"],"testRunner":"vitest","vitest":{"configFile":"vitest.stryker.config.ts","related":true},"mutate":["packages/core/src/runtime/graph-publisher.ts","packages/core/src/runtime/graph-runtime.ts","packages/core/src/runtime/patch-registry.ts","packages/core/src/runtime/project-runtime.ts","packages/core/src/adapters/**/*.ts","packages/core/src/domain/track.ts","packages/core/src/domain/motion.ts","packages/core/src/engine.ts","packages/core/src/graph/ids.ts"],"reporters":["clear-text","progress","json","html"],"jsonReporter":{"fileName":"reports/mutation/mutation.json"},"htmlReporter":{"fileName":"reports/mutation/mutation.html"},"coverageAnalysis":"perTest","thresholds":{"high":65.42,"low":65.42,"break":65.42},"allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"report
