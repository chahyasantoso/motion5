),\n    severity: \"error\",\n    ids: Object.freeze([nodeId]),\n  });\n}\nfunction compareEdgeKeys(a: GraphEdge, b: GraphEdge): number {\n  const left = edgeKey(a),\n    right = edgeKey(b);\n  return left <"+" right ? -1 : left > right ? 1 : 0;\n}\nfunction isRecord(value: unknown): value is Readonly<"+"Record<"+"string, unknown>> {\n  if (value === null || typeof value !== \"object\" || Array.isArray(value)) return false;\n  const prototype = Object.getPrototypeOf(value);\n  return prototype === Object.prototype || prototype === null;\n}\nfunction isRendererNeutral(value: unknown, seen = new WeakSet<"+"object>()): boolean {\n  if (value === null) return true;\n  if (typeof value === \"string\" || typeof value === \"boolean\") return true;\n  if (typeof value === \"number\") return Number.isFinite(value);\n  if (typeof value !== \"object\" || seen.has(value)) return false;\n  seen.add(value);\n  if (Array.isArray(value)) return value.every((item) => isRendererNeutral(item, seen));\n  if (!isRecord(value)) return false;\n  return Object.entries(value).every(\n    ([key, item]) => !key.startsWith(\"_\") && isRendererNeutral(item, seen),\n  );\n}\nfunction validateComposition(values: unknown): asserts values is Readonly<"+"Record<"+"string, unknown>> {\n  if (!isRecord(values) || !isRendererNeutral(values))\n    throw new CompositionOutputError(\n      \"Composition output must contain only renderer-neutral values.\",\n    );\n}\nfunction mergeValues(\n  base: Readonly<"+"Record<"+"string, unknown>>,\n  overlay: Readonly<"+"Record<"+"string, unknown>> | undefined,\n): Readonly<"+"Record<"+"string, unknown>> {\n  return overlay === undefined ? base : Object.freeze({ ...base, ...overlay });\n}\nfunction projectValues(\n  source: Readonly<"+"Record<"+"string, unknown>>,\n  projection: InputProjection | undefined,\n): Readonly<"+"Record<"+"string, unknown>> {\n  if (projection === undefined) return source;\n  if (projection.pick !== undefined)\n    return Object.fromEntries(\n      projection.pick.filter((key) => key in source).map((key) => [key, source[key]]),\n    );\n  if (projection.map !== undefined)\n    return Object.fromEntries(\n      Object.entries(projection.map)\n        .filter(([sourceKey]) => sourceKey in source)\n        .map(([sourceKey, targetKey]) => [targetKey, source[sourceKey]]),\n    );\n  throw new InputObservationError(\n    \"observation-input-shape\",\n    \"Input projection must define pick or map.\",\n  );\n}\n\nexport class GraphPublisher {\n  readonly #registry: PatchRegistry;\n  constructor(registry: PatchRegistry) {\n    this.#registry = registry;\n  }\n  flush(snapshot: PublisherSnapshot, seeds: readonly string[], tick: number): PatchBatch {\n    if (this.#registry.notifying) throw new Error(REENTRANT_BATCH_MESSAGE);\n    const byId = new Map(snapshot.nodes.map((node) => [node.id, node]));\n    const dependents = new Map<"+"string, string[]>();\n    for (const node of snapshot.nodes) dependents.set(node.id, []);\n    for (const node of snapshot.nodes)\n      for (const edge of node.edges) dependents.get(edge.sourceId)?.push(node.id);\n    const affected = new Set<"+"string>();\n    const queue = [...seeds];\n    for (let index = 0; index <"+" queue.length; index += 1) {\n      const id = queue[index];\n      if (id === undefined || affected.has(id)) continue;\n      affected.add(id);\n      queue.push(...(dependents.get(id) ?? []));\n    }\n    const failed = new Map<"+"string, Diagnostic>();\n    const blocked = new Set<"+"string>();\n    const memo = new Map<"+"string, PublisherComposition>();\n    this.#registry.beginBatch(tick, seeds);\n    try {\n      for (const id of snapshot.order) {\n        if (!affected.has(id)) continue;\n        const node = byId.get(id);\n        if (node === undefined) continue;\n        const sourceFailure = node.edges\n          .filter((edge) => failed.has(edge.sourceId) || blocked.has(edge.sourceId))\n          .sort(compareEdgeKeys)[0]?.sourceId;\n        if (sourceFailure !== undefined) {\n          blocked.add(id);\n          this.#registry.publish({\n            nodeId: id,\n            sourceProgress: 0,\n            status: \"blocked\",\n            diagnostics: [\n              Object.freeze({\n                ruleId: \"blocked-upstream\",\n                path: id,\n                message: `Blocked by upstream failure at ${sourceFailure}.`,\n                severity: \"error\",\n                ids: Object.freeze([sourceFailure, id]),\n              }),\n            ],\n          });\n          continue;\n        }\n        try {\n          const inputs: Record<"+"string, unknown> = {};\n          const inputKeys = new Map<"+"string, string>();\n          const sourceRevisions: Record<"+"string, number> = {};\n          for (const edge of node.edges\n            .filter(({ role }) => role === \"input\")\n            .sort(compareEdgeKeys)) {\n            const sourcePatch = this.#registry.get(edge.sourceId);\n            const sourceValues = memo.get(edge.sourceId)?.values ?? sourcePatch?.values;\n            if (sourceValues === undefined)\n              throw new InputObservationError(\n                \"observation-missing-upstream\",\n                `Input observation source \"${edge.sourceId}\" has no published value.`,\n              );\n            if (!isRecord(sourceValues))\n              throw new InputObservationError(\n                \"observation-input-shape\",\n                `Input observation source \"${edge.sourceId}\" must be a record.`,\n              );\n            if (sourcePatch) sourceRevisions[edge.sourceId] = sourcePatch.revision;\n            const projected = projectValues(sourceValues, edge.projection);\n            for (const [key, value] of Object.entries(projected)) {\n              const previous = inputKeys.get(key);\n              if (previous !== undefined)\n                throw new InputObservationError(\n                  \"observation-input-collision\",\n ress: 0,\n            status: \"error\",\n            diagnostics: [failure],\n          });\n        }\n      }\n      return this.#registry.closeBatch();\n    } catch (error) {\n      try {\n        this.#registry.closeBatch();\n      } catch {\n        /* preserve original flush failure */\n      }\n      throw error;\n    }\n  }\n}\n"},"packages/core/src/runtime/graph-runtime.ts":{"language":"typescript","mutants":[{"id":"827","mutatorName":"StringLiteral","replacement":"\"Stryker was here!\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":23,"line":25},"start":{"column":21,"line":25}}},{"id":"850","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":62,"line":105},"start":{"column":27,"line":105}}},{"id":"864","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":86,"line":121},"start":{"column":55,"line":121}}},{"id":"869","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":89,"line":122},"start":{"column":55,"line":122}}},{"id":"916","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":10,"line":178},"start":{"column":25,"line":176}}},{"id":"917","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":88,"line":177},"start":{"column":44,"line":177}}},{"id":"928","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":6,"line":193},"start":{"column":39,"line":187}}},{"id":"929","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":75,"line":190},"start":{"column":9,"line":190}}},{"id":"942","mutatorName":"S warning\",\n    ids,\n  });\n  return Object.freeze({\n    tick: sequence,\n    seeds: ids,\n    patches: Object.freeze([]),\n    diagnostics: Object.freeze([diagnostic]),\n  }) as PatchBatch;\n}\nfunction describe(error: unknown): string {\n  return error instanceof Error ? error.message : String(error);\n}\n\nexport class GraphRuntime {\n  readonly #binding: GraphBinding;\n  readonly #registry: PatchRegistry;\n  readonly #publisher: GraphPublisher;\n  readonly #clock: Clock;\n  readonly #compose: ComposeResolver;\n  readonly #scheduler: Scheduler | undefined;\n  readonly #onFlushError: ((diagnostic: Diagnostic) => void) | undefined;\n  readonly #unsubscribe: () => void;\n  readonly #members = new Set<"+"string>();\n  readonly #pendingSeeds = new Set<"+"string>();\n  readonly #publisherNodes = new Map<"+"GraphNode, PublisherNode>();\n  #lastTick = 0;\n  #sequence = 0;\n  #lastFlushError: Diagnostic | undefined;\n  #flushing = false;\n  #scheduledDrain = false;\n  #disposed = false;\n\n  constructor(\n    project: ProjectDefinition,\n    clock: Clock,\n    compose: ComposeResolver,\n    options: GraphRuntimeOptions = {},\n  ) {\n    this.#binding = new GraphBinding(project);\n    this.#registry = new PatchRegistry();\n    this.#publisher = new GraphPublisher(this.#registry);\n    this.#clock = clock;\n    this.#compose = compose;\n    this.#scheduler = options.scheduler;\n    this.#onFlushError = options.onFlushError;\n    this.#unsubscribe = this.#clock.subscribe((event) => this.#onTick(event));\n  }\n  get binding(): GraphBinding {\n    return this.#binding;\n  }\n  get state() {\n    return this.#binding.state;\n  }\n  get registry(): PatchRegistry {\n    return this.#registry;\n  }\n  get tick(): number {\n    return this.#lastTick;\n  }\n  get sequence(): number {\n    return this.#sequence;\n  }\n  get lastFlushError(): Diagnostic | undefined {\n    return this.#lastFlushError;\n  }\n  get memberCount(): number {\n    return this.#members.size;\n  }\n  get pendingSeeds(): readonly string[] {\n    return [...this.#pendingSeeds];\n  }\n\n  attach(nodeId: string): void {\n    this.#assertLive();\n    if (!this.#binding.graph.nodeById[nodeId])\n      throw new TypeError(`Unknown graph node \\\"${nodeId}\\\".`);\n    this.#members.add(nodeId);\n  }\n  detach(nodeId: string): void {\n    this.#assertLive();\n    this.#members.delete(nodeId);\n  }\n\n  flush(seeds: readonly string[] = [...this.#members], tick?: number): PatchBatch {\n    this.#assertLive();\n    if (this.#flushing) {\n      for (const seed of seeds) this.#pendingSeeds.add(seed);\n      this.#scheduleDrain();\n      return deferredBatch(this.#sequence, seeds);\n    }\n    if (tick !== undefined) {\n      if (!Number.isFinite(tick)) throw new TypeError(\"Runtime ticks must be finite.\");\n      if (tick <"+" this.#lastTick) throw new RangeError(\"Runtime ticks must be monotonic.\");\n      this.#lastTick = tick;\n    }\n    const carried = [...this.#pendingSeeds];\n    this.#pendingSeeds.clear();\n    this.#scheduledDrain = false;\n    const effectiveSeeds = [...new Set([...seeds, ...carried])];\n    const graph = this.#binding.graph;\n    const nodes = graph.nodes.map((node) => {\n      const cached = this.#publisherNodes.get(node);\n      if (cached) return cached;\n      const publisherNode = Object.freeze({ ...node, compose: this.#compose(node) });\n      this.#publisherNodes.set(node, publisherNode);\n      return publisherNode;\n    });\n    const nodeById = Object.freeze(Object.fromEntries(nodes.map((node) => [node.id, node])));\n    this.#sequence += 1;\n    this.#flushing = true;\n    try {\n      return this.#publisher.flush(\n        Object.freeze({ ...graph, nodes: Object.freeze(nodes), nodeById }),\n        effectiveSeeds,\n        this.#sequence,\n      );\n    } catch (error) {\n      for (const seed of effectiveSeeds) this.#pendingSeeds.add(seed);\n      throw error;\n    } finally {\n      this.#flushing = false;\n      if (this.#pendingSeeds.size > 0) this.#scheduleDrain();\n    }\n  }\n  invalidate(seeds: readonly string[]): PatchBatch {\n    this.#assertLive();\n    return this.flush(seeds);\n  }\n  dispose(): void {\n    if (this.#disposed) return;\n    this.#disposed = true;\n    this.#unsubscribe();\n    this.#members.clear();\n    this.#pendingSeeds.clear();\n    this.#publisherNodes.clear();\n    this.#scheduledDrain = false;\n  }\n  #scheduleDrain(): void {\n    if (this.#scheduler === undefined || this.#scheduledDrain || this.#disposed) return;\n    this.#scheduledDrain = true;\n    try {\n      this.#scheduler.schedule(() => {\n        this.#scheduledDrain = false;\n        if (this.#disposed || this.#pendingSeeds.size === 0) return;\n        try {\n          this.flush([]);\n        } catch (error) {\n          this.#report(FLUSH_FAILURE_RULE, `Scheduled flush failed: ${describe(error)}`);\n        }\n      });\n    } catch (error) {\n      this.#scheduledDrain = false;\n      this.#report(SCHEDULER_FAILURE_RULE, `Deferred flush scheduling failed: ${describe(error)}`);\n    }\n  }\n  #onTick(event: ClockTick): void {\n    if (this.#disposed) return;\n    if (event.tick <"+"= this.#lastTick) {\n      this.#report(\n        CLOCK_REGRESSION_RULE,\n        `Clock tick ${event.tick} did not advance past ${this.#lastTick}.`,\n      );\n      return;\n    }\n    try {\n      this.flush([...this.#members], event.tick);\n    } catch (error) {\n      this.#report(FLUSH_FAILURE_RULE, `Flush at tick ${event.tick} failed: ${describe(error)}`);\n    }\n  }\n  #report(ruleId: string, message: string): void {\n    const diagnostic: Diagnostic = Object.freeze({\n      ruleId,\n      path: String(this.#lastTick),\n      message,\n      severity: \"error\",\n      ids: Object.freeze([...this.#members]),\n    });\n    this.#lastFlushError = diagnostic;\n    this.#onFlushError?.(diagnostic);\n  }\n  #assertLive(): void {\n    if (this.#disposed) throw new Error(\"GraphRuntime is disposed.\");\n  }\n}\n"},"packages/    a.severity === b.severity &&\n    sameIds(a.ids, b.ids)\n  );\n}\nfunction sameDiagnostics(a: readonly Diagnostic[], b: readonly Diagnostic[]): boolean {\n  if (a.length !== b.length) return false;\n  return a.every((item, index) => {\n    const other = b[index];\n    return other !== undefined && sameDiagnostic(item, other);\n  });\n}\nfunction samePatch(a: Patch | undefined, b: Patch): boolean {\n  return (\n    a !== undefined &&\n    equalValues(a.values, b.values) &&\n    Object.is(a.sourceProgress, b.sourceProgress) &&\n    equalValues(a.sourceRevisions, b.sourceRevisions) &&\n    a.status === b.status &&\n    sameDiagnostics(a.diagnostics, b.diagnostics)\n  );\n}\n\nexport class PatchRegistry {\n  readonly #patches = new Map<"+"string, Patch>();\n  readonly #nodeListeners = new Map<"+"string, Set<"+"PatchListener>>();\n  readonly #batchListeners = new Set<"+"BatchListener>();\n  #batch: Patch[] = [];\n  #batchDiagnostics: Diagnostic[] = [];\n  #batchTick = 0;\n  #batchSeeds: string[] = [];\n  #batchOpen = false;\n  #notifying = false;\n\n  get(nodeId: string): Patch | undefined {\n    return this.#patches.get(nodeId);\n  }\n  get notifying(): boolean {\n    return this.#notifying;\n  }\n  beginBatch(tick: number, seeds: readonly string[]): void {\n    if (this.#notifying) throw new Error(REENTRANT_BATCH_MESSAGE);\n    if (this.#batchOpen) throw new Error(\"A patch batch is already open.\");\n    this.#batchOpen = true;\n    this.#batchTick = tick;\n    this.#batchSeeds = [...seeds];\n    this.#batch = [];\n    this.#batchDiagnostics = [];\n  }\n  publish(input: PublishInput): Patch | undefined {\n    const previous = this.#patches.get(input.nodeId);\n    const readyValues = input.values ?? previous?.values ?? {};\n    const readyProgress =\n      input.values === undefined && input.status !== \"ready\"\n        ? (previous?.sourceProgress ?? input.sourceProgress)\n        : input.sourceProgress;\n    const readyRevisions =\n      input.values === undefined && input.status !== \"ready\"\n        ? (previous?.sourceRevisions ?? input.sourceRevisions ?? {})\n        : (input.sourceRevisions ?? {});\n    const candidate = {\n      nodeId: input.nodeId,\n      revision: (previous?.revision ?? 0) + 1,\n      values: readyValues,\n      sourceProgress: readyProgress,\n      sourceRevisions: readyRevisions,\n      status: input.status,\n      diagnostics: input.diagnostics ?? [],\n    } satisfies Patch;\n    if (samePatch(previous, candidate)) return undefined;\n    const patch = deepFreeze(candidate);\n    this.#patches.set(input.nodeId, patch);\n    this.#batch.push(patch);\n    this.#batchDiagnostics.push(...patch.diagnostics);\n    return patch;\n  }\n  subscribeNode(nodeId: string, listener: PatchListener): () => void {\n    const listeners = this.#nodeListeners.get(nodeId) ?? new Set<"+"PatchListener>();\n    listeners.add(listener);\n    this.#nodeListeners.set(nodeId, listeners);\n    return () => listeners.delete(listener);\n  }\n  subscribeBatch(listener: BatchListener): () => void {\n    this.#batchListeners.add(listener);\n    return () => this.#batchListeners.delete(listener);\n  }\n  closeBatch(): PatchBatch {\n    if (!this.#batchOpen) throw new Error(\"No patch batch is open.\");\n    const batch = deepFreeze({\n      tick: this.#batchTick,\n      seeds: [...this.#batchSeeds],\n      patches: [...this.#batch],\n      diagnostics: [...this.#batchDiagnostics],\n    }) as PatchBatch;\n    const nodeListeners = new Map<"+"string, readonly PatchListener[]>(\n      [...this.#nodeListeners].map(([nodeId, listeners]): [string, readonly PatchListener[]] => [\n        nodeId,\n        [...listeners],\n      ]),\n    );\n    const batchListeners: readonly BatchListener[] = [...this.#batchListeners];\n    this.#batchOpen = false;\n    this.#batch = [];\n    this.#batchDiagnostics = [];\n    this.#batchSeeds = [];\n    let firstError: unknown;\n    let hasError = false;\n    this.#notifying = true;\n    try {\n      for (const patch of batch.patches)\n        for (const listener of nodeListeners.get(patch.nodeId) ?? [])\n          try {\n            listener(patch);\n          } catch (error) {\n            if (!hasError) {\n              hasError = true;\n              firstError = error;\n            }\n          }\n      for (const listener of batchListeners)\n        try {\n          listener(batch);\n        } catch (error) {\n          if (!hasError) {\n            hasError = true;\n            firstError = error;\n          }\n        }\n    } finally {\n      this.#notifying = false;\n    }\n    if (hasError) throw firstError;\n    return batch;\n  }\n}\n"},"packages/core/src/runtime/project-runtime.ts":{"language":"typescript","mutants":[{"id":"1122","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":4,"line":37},"start":{"column":36,"line":35}}},{"id":"1143","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":70,"line":72},"start":{"column":41,"line":72}}},{"id":"1115","mutatorName":"BooleanLiteral","replacement":"true","statusReason":"ProjectRuntime is disposed.","status":"Killed","static":false,"testsCompleted":1,"killedBy":["141"],"coveredBy":["17","18","48","79","128","141","142","143","153","154","155","162","184"],"location":{"end":{"column":20,"line":20},"start":{"column":15,"line":20}}},{"id":"1116","mutatorName":"BlockStatement","replacement":"{}","statusReason":"Cannot read properties of undefined (reading 'attach')","status":"Killed","static":false,"testsCompleted":1,"killedBy":["48"],"coveredBy":["17","18","48","79","128","141","142","143","153","154","155","162","184"],"location":{"end":{"column":4,"line":34},"start":{"column":75,"line":22}}},{"id":"1117","mutatorName":"LogicalOperator","replacement":"options.setProgress && (() => undefined)","statusReason":"expected 0.2 to be close to 0.6, received diffe me":"BlockStatement","replacement":"{}","status":"Survived","static":false,"testsCompleted":8,"coveredBy":["48","79","141","142","143","153","155","162"],"location":{"end":{"column":4,"line":73},"start":{"column":23,"line":71}}},{"id":"1141","mutatorName":"ConditionalExpression","replacement":"true","statusReason":"ProjectRuntime is disposed.","status":"Killed","static":false,"testsCompleted":1,"killedBy":["141"],"coveredBy":["48","79","141","142","143","153","155","162"],"location":{"end":{"column":23,"line":72},"start":{"column":9,"line":72}}},{"id":"1138","mutatorName":"BooleanLiteral","replacement":"false","status":"Survived","static":false,"testsCompleted":12,"coveredBy":["17","18","48","79","128","141","142","143","153","155","162","184"],"location":{"end":{"column":26,"line":65},"start":{"column":22,"line":65}}},{"id":"1137","mutatorName":"ConditionalExpression","replacement":"false","status":"Survived","static":false,"testsCompleted":12,"coveredBy":["17","18","48","79","128","141","142","143","153","155","162","184"],"location":{"end":{"column":23,"line":64},"start":{"column":9,"line":64}}},{"id":"1139","mutatorName":"ArrayDeclaration","replacement":"[]","status":"Survived","static":false,"testsCompleted":12,"coveredBy":["17","18","48","79","128","141","142","143","153","155","162","184"],"location":{"end":{"column":53,"line":66},"start":{"column":26,"line":66}}},{"id":"1142","mutatorName":"ConditionalExpression","replacement":"false","status":"Survived","static":false,"testsCompleted":8,"coveredBy":["48","79","141","142","143","153","155","162"],"location":{"end":{"column":23,"line":72},"start":{"column":9,"line":72}}}],"source":"import type { ProjectDefinition } from \"../contract/v5\";\nimport type { Clock } from \"../ports/clock\";\nimport type { Scheduler } from \"../ports/scheduler\";\nimport { GraphRuntime, type ComposeResolver } from \"./graph-runtime\";\n\nexport interface ProjectRuntimeOptions {\n  readonly clock: Clock;\n  readonly scheduler?: Scheduler;\n  readonly compose: ComposeResolver;\n  readonly setProgress?: (nodeId: string, progress: number) => void;\n  readonly disposeComposition?: () => void;\n}\n\nexport class ProjectRuntime {\n  readonly #project: ProjectDefinition;\n  readonly #graph: GraphRuntime;\n  readonly #instances = new Map<"+"string, object>();\n  readonly #setProgress: (nodeId: string, progress: number) => void;\n  readonly #disposeComposition: () => void;\n  #disposed = false;\n\n  constructor(project: ProjectDefinition, options: ProjectRuntimeOptions) {\n    this.#project = project;\n    this.#setProgress = options.setProgress ?? (() => undefined);\n    this.#disposeComposition = options.disposeComposition ?? (() => undefined);\n    try {\n      this.#graph = new GraphRuntime(project, options.clock, options.compose, {\n        scheduler: options.scheduler,\n      });\n    } catch (error) {\n      this.#disposeComposition();\n      throw error;\n    }\n  }\n  get project(): ProjectDefinition {\n    return this.#project;\n  }\n  get graph(): GraphRuntime {\n    return this.#graph;\n  }\n  get instanceCount(): number {\n    return this.#instances.size;\n  }\n  mount(nodeId: string, instance: object = {}): object {\n    this.#assertLive();\n    if (this.#instances.has(nodeId)) throw new TypeError(`Node \"${nodeId}\" is already mounted.`);\n    this.#graph.attach(nodeId);\n    this.#instances.set(nodeId, instance);\n    return instance;\n  }\n  unmount(nodeId: string): void {\n    this.#assertLive();\n    const instance = this.#instances.get(nodeId);\n    if (instance === undefined) return;\n    this.#instances.delete(nodeId);\n    this.#graph.detach(nodeId);\n  }\n  seek(nodeId: string, progress: number) {\n    this.#assertLive();\n    this.#setProgress(nodeId, progress);\n    return this.#graph.invalidate([nodeId]);\n  }\n  dispose(): void {\n    if (this.#disposed) return;\n    this.#disposed = true;\n    for (const nodeId of [...this.#instances.keys()]) this.#graph.detach(nodeId);\n    this.#instances.clear();\n    this.#graph.dispose();\n    this.#disposeComposition();\n  }\n  #assertLive(): void {\n    if (this.#disposed) throw new Error(\"ProjectRuntime is disposed.\");\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":65.42,"low":65.42,"break":65.42},"testFiles":{"packages/core/test/unit/domain/plugins.test.ts":{"tests":[{"id":"0","name":"plugin registry resolves authored keys in deterministic order"},{"id":"1","name":"plugin registry resolves authored keys and reports unsupported keys"},{"id":"2","name":"plugin registry orders authored-key plugins by stage, priority, then registration order"},{"id":"3","name":"plugin registry retains and invokes the compile-time contribution hook"},{"id":"4","name":"plugin registry rejects duplicate output ownership deterministically"},{"id":"5","name":"plugin registry rejects duplicate exact key ownership at registration"},{"id":"6","name":"plugin registry lets exact ownership beat a predicate fallback"},{"id":"7","name":"plugin registry rejects a contributor without prepare stage"},{"id":"8","name":"plugin registry rejects fractional priorities"},{"id":"9","name":"plugin registry rejects duplicate input ownership at registration"},{"id":"10","name":"plugin registry rejects duplicate registration and malformed metadata"},{"id":"11","name":"plugin registry detaches resolved plugins from later registry mutation"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport type { ImmutableRecord } from \"../../../src/domain/values\";\nimport { PluginRegistry } from \"../../../src/domain/plugins\";\n\ndescribe(\"plugin registry\", () => {\n  const plugin = (name: string, extra: Record<"+"string, unknown> = {}) => ({\n    name,\n    compose: (values: Readonly<"+"ImmutableRecord>, _progress: number): ImmutableRecord => values,\n    ...extra,\n  });\n\n  it(\"resolves authored keys in deterministic order\", () => {\n    const registry = new PluginRegistry();\n    const first = plugin(\"first\", { keys: [\"a\"] });\n    const second = plugin(\"second\", { keys: [\"b\"] });\n    registry.register(first);\n    registry.register(second);\n    const resolved = registry.resolveForKeyframes({ a: {}, b: {} });\n    expect(resolved.diagnostics).toEqual([]);\n    expect(resolved.plugins.map(({ name }) => name)).toEqual([\"first\", \"second\"]);\n    expect(resolved.plugins[0]).not.toBe(first);\n    expect(resolved.plugins[0]).toEqual(first);\n  });\n\n  it(\"resolves authored keys and reports unsupported keys\", () => {\n    const registry = new PluginRegistry();\n    registry.register(plugin(\"opacity\", { keys: [\"opacity\"] }));\n    registry.register(plugin(\"transform\", { claimsKey: (key: string) => key === \"x\" }));\n    const resolved = registry.resolveForKeyframes(\n      { opacity: {}, x: {}, mystery: {} },\n      \"track.keyframes\",\n    );\n    expect(resolved.plugins.map(({ name }) => name)).toEqual([\"opacity\", \"transform\"]);\n    expect(resolved.diagnostics).toEqual([\n      {\n        ruleId: \"plugin-unknown-key\",\n        path: \"track.keyframes.mystery\",\n        message: 'No registered plugin claims authored key \"mystery\".',\n        severity: \"error\",\n        ids: [\"mystery\"],\n      },\n    ]);\n  });\n\n  it(\"orders authored-key plugins by stage, priority, then registration order\", () => {\n    const registry = new PluginRegistry();\n    registry.register(plugin(\"late\", { keys: [\"x\"], stage: \"compose\", priority: 20 }));\n    registry.register(plugin(\"early\", { keys: [\"y\"], stage: \"prepare\", priority: 99 }));\n    registry.register(plugin(\"same\", { keys: [\"z\"], stage: \"compose\", priority: 10 }));\n    expect(\n      registry.resolveForKeyframes({ x: {}, y: {}, z: {} }).plugins.map(({ name }) => name),\n    ).toEqual([\"early\", \"same\", \"late\"]);\n  });\n\n  it(\"retains and invokes the compile-time contribution hook\", () => {\n    const registry = new PluginRegistry();\n    const contribute = vi.fn(() => undefined);\n    registry.register(plugin(\"first\", { keys: [\"x\"], stage: \"prepare\", contribute }));\n    const resolved = registry.resolveForKeyframes({ x: { stops: [] } });\n    expect(resolved.plugins[0]?.contribute).toBe(contribute);\n    expect(contribute).toHaveBeenCalledOnce();\n  });\n\n  it(\"rejects duplicate output ownership deterministically\", () => {\n    const registry = new PluginRegistry();\n    registry.register(plugin(\"first\", { keys: [\"x\"], outputs: [\"transform\"] }));\n    registry.register(plugin(\"second\", { keys: [\"y\"], outputs: [\"transform\"] }));\n    expect(registry.resolveForKeyframes({ x: {}, y: {} }).diagnostics).toEqual([\n      {\n        ruleId: \"plugin-duplicate-output\",\n        path: \"keyframes.transform\",\n        message: 'Plugins \"first\" and \"second\" both claim output \"transform\".',\n        severity: \"error\",\n        ids: [\"first\", \"second\", \"transform\"].sort(),\n      },\n    ]);\n  });\n\n  it(\"rejects duplicate exact key ownership at registration\", () => {\n    const registry = new PluginRegistry();\n    registry.register(plugin(\"first\", { keys: [\"x\"] }));\n    expect(() => registry.register(plugin(\"second\", { keys: [\"x\"] }))).toThrow(\n      /plugin-key-collision/,\n    );\n    expect(registry.size).toBe(1);\n  });\n\n  it(\"lets exact ownership beat a predicate fallback\", () => {\n    const registry = new PluginRegistry();\n    const predicate = vi.fn(() => true);\n    const exact = vi.fn(() => undefined);\n    registry.register(\n      plugin(\"predicate\", { claimsKey: predicate, stage: \"prepare\", contribute: predicate }),\n    );\n    registry.register(plugin(\"exact\", { keys: [\"x\"], stage: \"prepare\", contribute: exact }));\n    registry.resolveForKeyframes({ x: { stops: [] } });\n    expect(exact).toHaveBeenCalledOnce();\n    expect(predicate).not.toHaveBeenCalled();\n  });\n\n  it(\"rejects a contributor without prepare stage\", () => {\n    const registry = new PluginRegistry();\n    expect(() =>\n      registry.register(plugin(\"unstaged\", { keys: [\"x\"], contribute: () => undefined })),\n    ).toThrow(/requires stage \"prepare\"/);\n  });\n\n  it(\"rejects fractional priorities\", () => {\n    const registry = new PluginRegistry();\n    expect(() => registry.register(plugin(\"fractional\", { priority: 1.5 }))).toThrow(\n      /finite integer/,\n    );\n  });\n\n  it(\"rejects duplicate input ownership at registration\", () => {\n    const registry = new PluginRegistry();\n    registry.register(plugin(\"first\", { inputs: [\"source\"] }));\n    expect(() => registry.register(plugin(\"second\", { inputs: [\"source\"] }))).toThrow(\n      /plugin-input-collision/,\n    );\n  });\n\n  it(\"rejects duplicate registration and malformed metadata\", () => {\n    const registry = new PluginRegistry();\n    registry.register(plugin(\"transform\"));\n    expect(() => registry.register(plugin(\"transform\"))).toThrow(/already registered/);\n    expect(() => registry.register(plugin(\"bad-keys\", { keys: \"x\" }))).toThrow(/keys/);\n    expect(() => registry.register(plugin(\"bad-claim\", { claimsKey: 1 }))).toThrow(/claimsKey/);\n    expect(() => registry.register(plugin(\"bad-priority\", { priority: Number.NaN }))).toThrow(\n      /priority/,\n    );\n    expect(() => registry.register(plugin(\"bad-stage\", { stage: \"typo\" }))).toThrow(/stage/);\n  });\n\n  it(\"detaches resolved plugins from later registry mutation\", () => {\n    const registry = new PluginRegistry();\n    const original = plugin(\"stable\", { keys: [\"stable\"] });\n    registry.register(original);\n    const resolved = registry.resolveForKeyframes({ stable: {} });\n    expect(Object.isFrozen(resolved)).toBe(true);\n    expect(Object.isFrozen(resolved.plugins)).toBe(true);\n    expect(Object.isFrozen(resolved.plugins[0])).toBe(true);\n    expect(resolved.plugins[0]?.compose).toBe(original.compose);\n  });\n});\n"},"packages/core/test/unit/runtime/publisher-reentrancy.test.ts":{"tests":[{"id":"12","name":"subscriber-triggered reentrancy (recovery A3) defers a subscriber-triggered invalidate instead of running it inside the current flush"},{"id":"13","name":"subscriber-triggered reentrancy (recovery A3) runs the queued follow-up exactly once on the next tick and then clears it"},{"id":"14","name":"subscriber-triggered reentrancy (recovery A3) coalesces several subscriber-triggered invalidations into one follow-up"},{"id":"15","name":"subscriber-triggered reentrancy (recovery A3) refuses to open a second batch while subscribers are being notified"},{"id":"16","name":"subscriber-triggered reentrancy (recovery A3) rejects a direct publisher flush from inside a subscriber and stays reusable"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../../src/contract/v5\";\nimport type { GraphIR } from \"../../../src/graph/ir\";\nimport { createManualClock } from \"../../../src/ports/clock\";\nimport { GraphRuntime } from \"../../../src/runtime/graph-runtime\";\nimport { GraphPublisher, type PublisherNode } from \"../../../src/runtime/graph-publisher\";\nimport { PatchRegistry, type PatchBatch } from \"../../../src/runtime/patch-registry\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] },\n    { id: \"caption\", trigger: { type: \"manual\" }, tracks: [{ id: \"label\" }] },\n  ],\n};\n\nconst compose = (node: { id: string }) => () => ({\n  values: { node: node.id },\n  sourceProgress: 0,\n  sourceRevisions: {},\n});\n\nconst soleNode = (id: string): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex: 0,\n    track: { id },\n    edges: Object.freeze([]),\n    compose: () => ({ values: { x: 1 }, sourceProgress: 0, sourceRevisions: {} }),\n  });\n\nconst soleSnapshot = (id: string): GraphIR & { nodes: readonly PublisherNode[] } => {\n  const node = soleNode(id);\n  return {\n    nodes: [node],\n    nodeById: Object.freeze({ [id]: node }),\n    order: Object.freeze([id]),\n    diagnostics: Object.freeze([]),\n  };\n};\n\ndescribe(\"subscriber-triggered reentrancy (recovery A3)\", () => {\n  it(\"defers a subscriber-triggered invalidate instead of running it inside the current flush\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, compose);\n    runtime.attach(\"hero/arm\");\n\n    const ticks: number[] = [];\n    runtime.registry.subscribeBatch((batch) => ticks.push(batch.tick));\n\n    let deferred: PatchBatch | undefined;\n    let notifications = 0;\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      notifications += 1;\n      if (notifications === 1) deferred = runtime.invalidate([\"caption/label\"]);\n    });\n\n    clock.tick();\n\n    // No nested batch may be delivered before the in-flight one completes.\n    expect(ticks).toEqual([1]);\n    // The reentrant call must not advance the runtime tick from inside a flush.\n    expect(runtime.tick).toBe(1);\n    // The reentrant call publishes nothing and says so explicitly.\n    expect(deferred?.patches).toEqual([]);\n    expect(deferred?.seeds).toEqual([\"caption/label\"]);\n    expect(deferred?.diagnostics.map((entry) => entry.ruleId)).toContain(\n      \"reentrant-flush-deferred\",\n    );\n    // The follow-up is queued, not dropped.\n    expect(runtime.pendingSeeds).toEqual([\"caption/label\"]);\n    expect(runtime.registry.get(\"caption/label\")).toBeUndefined();\n\n    runtime.dispose();\n  });\n\n  it(\"runs the queued follow-up exactly once on the next tick and then clears it\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, compose);\n    runtime.attach(\"hero/arm\");\n\n    const ticks: number[] = [];\n    runtime.registry.subscribeBatch((batch) => ticks.push(batch.tick));\n\n    let notifications = 0;\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      notifications += 1;\n      if (notifications === 1) runtime.invalidate([\"caption/label\"]);\n    });\n\n    clock.tick();\n    expect(runtime.pendingSeeds).toEqual([\"caption/label\"]);\n\n    // The clock stays the single owner: the follow-up rides the next tick.\n    clock.tick();\n\n    expect(ticks).toEqual([1, 2]);\n    expect(runtime.registry.get(\"caption/label\")?.values).toEqual({ node: \"caption/label\" });\n    expect(runtime.registry.get(\"caption/label\")?.revision).toBe(1);\n    expect(runtime.pendingSeeds).toEqual([]);\n\n    // Exactly one follow-up: a third tick must not replay it.\n    clock.tick();\n    expect(ticks).toEqual([1, 2, 3]);\n    expect(runtime.registry.get(\"caption/label\")?.revision).toBe(1);\n\n    runtime.dispose();\n  });\n\n  it(\"coalesces several subscriber-triggered invalidations into one follow-up\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, compose);\n    runtime.attach(\"hero/arm\");\n\n    const ticks: number[] = [];\n    runtime.registry.subscribeBatch((batch) => ticks.push(batch.tick));\n\n    let notifications = 0;\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      notifications += 1;\n      if (notifications > 1) return;\n      runtime.invalidate([\"caption/label\"]);\n      runtime.invalidate([\"caption/label\"]);\n      runtime.invalidate([\"hero/arm\"]);\n    });\n\n    clock.tick();\n\n    expect(ticks).toEqual([1]);\n    expect([...runtime.pendingSeeds].sort()).toEqual([\"caption/label\", \"hero/arm\"]);\n\n    clock.tick();\n    expect(ticks).toEqual([1, 2]);\n\n    runtime.dispose();\n  });\n\n  it(\"refuses to open a second batch while subscribers are being notified\", () => {\n    const registry = new PatchRegistry();\n    let nested: unknown;\n    registry.subscribeNode(\"hero/arm\", () => {\n      try {\n        registry.beginBatch(9, [\"hero/arm\"]);\n      } catch (error) {\n        nested = error;\n      }\n    });\n\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.publish({ nodeId: \"hero/arm\", values: { x: 1 }, sourceProgress: 0, status: \"ready\" });\n\n    expect(() => registry.closeBatch()).not.toThrow();\n    expect((nested as Error)?.message).toMatch(/while subscribers are being notified/);\n    expect(registry.notifying).toBe(false);\n  });\n\n  it(\"rejects a direct publisher flush from inside a subscriber and stays reusable\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    registry.subscribeNode(\"hero/arm\", () => {\n      publisher.flush(soleSnapshot(\"hero/arm\"), [\"hero/arm\"], 2);\n    });\n\n    expect(() => publisher.flush(soleSnapshot(\"hero/arm\"), [\"hero/arm\"], 1)).toThrow(\n      /while subscribers are being notified/,\n    );\n    expect(registry.notifying).toBe(false);\n    expect(() => publisher.flush(soleSnapshot(\"other/node\"), [\"other/node\"], 3)).not.toThrow();\n  });\n});\n"},"packages/core/test/integration/engine-x3-contribution.test.ts":{"tests":[{"id":"17","name":"X-3 contribution through the product load path passes contribution context and creates the prepared timeline at load"},{"id":"18","name":"X-3 contribution through the product load path selects one predicate contributor through Engine.load"},{"id":"19","name":"X-3 contribution through the product load path rejects malformed contributions during Engine.load"},{"id":"20","name":"X-3 contribution through the product load path rejects authored ease collisions before any timeline is created"},{"id":"21","name":"X-3 contribution through the product load path merges contributed keyframes into compiler diagnostics before timeline creation"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport { PluginRegistry } from \"../../src/domain/plugins\";\nimport { Engine } from \"../../src/engine\";\nimport type { ImmutableRecord } from \"../../src/domain/values\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../src/ports/fakes\";\nconst projectWith = (keyframes: unknown, duration = 1) => ({\n  schemaVersion: 5,\n  motions: [\n    { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\", duration, keyframes }] },\n  ],\n});\nconst options = () => ({\n  clock: createManualClock(),\n  interpolator: createFakeInterpolator(),\n  scheduler: createFakeScheduler(),\n});\nconst compose = (values: Readonly<"+"ImmutableRecord>): ImmutableRecord => values;\nconst property = (value: number) => ({\n  stops: [\n    { p: 0, v: value },\n    { p: 1, v: value + 1 },\n  ],\n});\nconst registerDerivedOwner = (registry: PluginRegistry): void =>\n  registry.register({ name: \"derived\", keys: [\"derived\"], compose });\ndescribe(\"X-3 contribution through the product load path\", () => {\n  it(\"passes contribution context and creates the prepared timeline at load\", () => {\n    const registry = new PluginRegistry();\n    const contribute = vi.fn(() => ({\n      keyframes: { derived: property(4) },\n      tweenVars: { overwrite: \"auto\" },\n    }));\n    registry.register({ name: \"base\", keys: [\"x\"], stage: \"prepare\", contribute, compose });\n    registerDerivedOwner(registry);\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    const runtime = new Engine({ ...options(), interpolator, plugins: registry }).load(\n      projectWith({ x: property(1) }, 2) as never,\n    );\n    expect(contribute).toHaveBeenCalledWith(\"x\", property(1).stops, {\n      id: \"hero/arm\",\n      duration: 2,\n    });\n    expect(create).toHaveBeenCalledWith(\n      expect.objectContaining({\n        duration: 2,\n        tweenVars: { overwrite: \"auto\" },\n        keyframes: expect.objectContaining({ derived: property(4) }),\n      }),\n    );\n    runtime.dispose();\n  });\n  it(\"selects one predicate contributor through Engine.load\", () => {\n    const registry = new PluginRegistry();\n    const first = vi.fn(() => ({ keyframes: { derived: property(1) } }));\n    const second = vi.fn(() => ({ keyframes: { derived: property(2) } }));\n    registry.register({\n      name: \"first\",\n      claimsKey: (key) => key === \"x\",\n      stage: \"prepare\",\n      contribute: first,\n      compose,\n    });\n    registry.register({\n      name: \"second\",\n      claimsKey: (key) => key === \"x\",\n      stage: \"prepare\",\n      contribute: second,\n      compose,\n    });\n    registerDerivedOwner(registry);\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    const runtime = new Engine({ ...options(), interpolator, plugins: registry }).load(\n      projectWith({ x: property(1) }) as never,\n    );\n    expect(first).toHaveBeenCalledOnce();\n    expect(second).not.toHaveBeenCalled();\n    expect(create).toHaveBeenCalled();\n    runtime.dispose();\n  });\n  it(\"rejects malformed contributions during Engine.load\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"bad\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({\n        keyframes: {\n          derived: {\n            stops: [\n              { p: 0.8, v: 1 },\n              { p: 0.2, v: 2 },\n            ],\n          },\n        },\n      }),\n      compose,\n    });\n    registerDerivedOwner(registry);\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    expect(() =>\n      new Engine({ ...options(), interpolator, plugins: registry }).load(\n        projectWith({ x: property(1) }) as never,\n      ),\n    ).toThrow(/plugin-contribution-stop-order/);\n    expect(create).not.toHaveBeenCalled();\n  });\n  it(\"rejects authored ease collisions before any timeline is created\", () => {\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    expect(() =>\n      new Engine({ ...options(), interpolator }).load(\n        projectWith({\n          x: {\n            stops: [\n              { p: 0, v: 0 },\n              { p: 0.5, v: 50, ease: \"power1.out\" },\n              { p: 1, v: 100 },\n            ],\n          },\n          y: {\n            stops: [\n              { p: 0, v: 0 },\n              { p: 0.5, v: 50, ease: \"power2.out\" },\n              { p: 1, v: 100 },\n            ],\n          },\n        }) as never,\n      ),\n    ).toThrow(/plugin-contribution-ease-collision/);\n    expect(create).not.toHaveBeenCalled();\n  });\n  it(\"merges contributed keyframes into compiler diagnostics before timeline creation\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"base\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({\n        keyframes: {\n          derived: {\n            stops: [\n              { p: 0, v: 0 },\n              { p: 0.5, v: 50, ease: \"power2.out\" },\n              { p: 1, v: 100 },\n            ],\n          },\n        },\n      }),\n      compose,\n    });\n    registerDerivedOwner(registry);\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    expect(() =>\n      new Engine({ ...options(), interpolator, plugins: registry }).load(\n        projectWith({\n          x: {\n            stops: [\n              { p: 0, v: 0 },\n              { p: 0.5, v: 50, ease: \"power1.out\" },\n              { p: 1, v: 100 },\n            ],\n          },\n        }) as never,\n      ),\n    ).toThrow(/plugin-contribution-ease-collision/);\n    expect(create).not.toHaveBeenCalled();\n  });\n});\n"},"packages/core/test/unit/graph/observation-state.test.ts":{"tests":[{"id":"22","name":"stable observation state I-1 keeps a held reference authoritative across commit and rollback"},{"id":"23","name":"stable observation state I-1 replays the journal in reverse to restore an exact structural snapshot"},{"id":"24","name":"stable observation state releases the journal only after a successful commit"},{"id":"25","name":"stable observation state clears the journal after a rollback so a second rollback is a no-op"},{"id":"26","name":"stable observation state exposes no rebuild-from-snapshot seam"},{"id":"27","name":"stable observation state refuses duplicates, unknown endpoints, and removal of a connected node"},{"id":"28","name":"stable observation state indexes both directions and orders snapshots canonically"},{"id":"29","name":"stable observation state hands out frozen snapshots and frozen live edges"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../../src/contract/v5\";\nimport type { GraphEdge } from \"../../../src/graph/ir\";\nimport { buildGraphIR } from \"../../../src/graph/ir\";\nimport { ObservationState } from \"../../../src/graph/observation-state\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    {\n      id: \"hero\",\n      trigger: { type: \"manual\" },\n      tracks: [\n        { id: \"arm\", observes: [{ source: \"~/cursor\", role: \"input\", target: \"pointer\" }] },\n        { id: \"halo\", observes: [{ source: \"arm\" }] },\n      ],\n    },\n  ],\n  freeTracks: [{ id: \"cursor\" }],\n};\n\nconst edge = (observerId: string, sourceId: string): GraphEdge => ({\n  observerId,\n  sourceId,\n  role: \"output\",\n});\n\n/**\n * Population is the transaction coordinator's job, which P2-06 has not written yet.\n * The live state deliberately offers no way to do this for itself.\n */\nfunction load(state: ObservationState): void {\n  const { graph } = buildGraphIR(project);\n  if (graph === undefined) throw new Error(\"fixture project must build\");\n  for (const id of graph.order) state.addNode(id);\n  for (const id of graph.order)\n    for (const live of graph.nodeById[id]?.edges ?? []) state.addEdge(live);\n}\n\ndescribe(\"stable observation state\", () => {\n  it(\"I-1 keeps a held reference authoritative across commit and rollback\", () => {\n    const state = new ObservationState();\n    const held = state;\n    load(state);\n    const committed = state.snapshot();\n    state.commit();\n\n    expect(held).toBe(state);\n    expect(held.snapshot()).toEqual(committed);\n\n    state.addNode(\"hero/ghost\");\n    state.removeEdge(edge(\"hero/halo\", \"hero/arm\"));\n    expect(held.snapshot()).not.toEqual(committed);\n\n    state.rollback();\n    expect(held).toBe(state);\n    expect(held.snapshot()).toEqual(committed);\n  });\n\n  it(\"I-1 replays the journal in reverse to restore an exact structural snapshot\", () => {\n    const state = new ObservationState();\n    load(state);\n    state.commit();\n    const before = state.snapshot();\n\n    state.removeEdge(edge(\"hero/halo\", \"hero/arm\"));\n    state.addNode(\"caption/label\");\n    state.addEdge(edge(\"caption/label\", \"hero/arm\"));\n    state.addEdge(edge(\"hero/halo\", \"caption/label\"));\n    state.removeEdge(edge(\"hero/halo\", \"caption/label\"));\n\n    state.rollback();\n    expect(state.snapshot()).toEqual(before);\n    expect(state.hasNode(\"caption/label\")).toBe(false);\n    expect(state.hasEdge(edge(\"hero/halo\", \"hero/arm\"))).toBe(true);\n  });\n\n  it(\"releases the journal only after a successful commit\", () => {\n    const state = new ObservationState();\n    expect(state.journalLength).toBe(0);\n    load(state);\n    expect(state.journalLength).toBeGreaterThan(0);\n\n    state.commit();\n    expect(state.journalLength).toBe(0);\n\n    const committed = state.snapshot();\n    state.rollback();\n    expect(state.snapshot()).toEqual(committed);\n  });\n\n  it(\"clears the journal after a rollback so a second rollback is a no-op\", () => {\n    const state = new ObservationState();\n    load(state);\n    state.commit();\n    const committed = state.snapshot();\n\n    state.addNode(\"hero/ghost\");\n    state.rollback();\n    expect(state.journalLength).toBe(0);\n    state.rollback();\n    expect(state.snapshot()).toEqual(committed);\n  });\n\n  it(\"exposes no rebuild-from-snapshot seam\", () => {\n    expect(Object.getOwnPropertyNames(ObservationState.prototype).sort()).toEqual([\n      \"addEdge\",\n      \"addNode\",\n      \"commit\",\n      \"constructor\",\n      \"hasEdge\",\n      \"hasNode\",\n      \"journalLength\",\n      \"observersOf\",\n      \"removeEdge\",\n      \"removeNode\",\n      \"rollback\",\n      \"snapshot\",\n      \"sourcesOf\",\n    ]);\n  });\n\n  it(\"refuses duplicates, unknown endpoints, and removal of a connected node\", () => {\n    const state = new ObservationState();\n    load(state);\n\n    expect(() => state.addNode(\"hero/arm\")).toThrow(TypeError);\n    expect(() => state.addEdge(edge(\"hero/halo\", \"hero/arm\"))).toThrow(TypeError);\n    expect(() => state.addEdge(edge(\"hero/halo\", \"hero/missing\"))).toThrow(TypeError);\n    expect(() => state.addEdge(edge(\"hero/missing\", \"hero/arm\"))).toThrow(TypeError);\n    expect(() => state.removeEdge(edge(\"hero/halo\", \"~/cursor\"))).toThrow(TypeError);\n    expect(() => state.removeNode(\"hero/arm\")).toThrow(TypeError);\n    expect(() => state.removeNode(\"hero/missing\")).toThrow(TypeError);\n  });\n\n  it(\"indexes both directions and orders snapshots canonically\", () => {\n    const first = new ObservationState();\n    for (const id of [\"~/cursor\", \"hero/arm\", \"hero/halo\"]) first.addNode(id);\n    first.addEdge(edge(\"hero/halo\", \"hero/arm\"));\n    first.addEdge(edge(\"hero/arm\", \"~/cursor\"));\n\n    const second = new ObservationState();\n    for (const id of [\"hero/halo\", \"hero/arm\", \"~/cursor\"]) second.addNode(id);\n    second.addEdge(edge(\"hero/arm\", \"~/cursor\"));\n    second.addEdge(edge(\"hero/halo\", \"hero/arm\"));\n\n    expect(first.snapshot()).toEqual(second.snapshot());\n    expect(first.snapshot().nodes).toEqual([\"hero/arm\", \"hero/halo\", \"~/cursor\"]);\n    expect(first.observersOf(\"hero/arm\").map(({ observerId }) => observerId)).toEqual([\n      \"hero/halo\",\n    ]);\n    expect(first.sourcesOf(\"hero/arm\").map(({ sourceId }) => sourceId)).toEqual([\"~/cursor\"]);\n  });\n\n  it(\"hands out frozen snapshots and frozen live edges\", () => {\n    const state = new ObservationState();\n    load(state);\n    const snapshot = state.snapshot();\n    expect(Object.isFrozen(snapshot)).toBe(true);\n    expect(Object.isFrozen(snapshot.nodes)).toBe(true);\n    expect(Object.isFrozen(snapshot.edges)).toBe(true);\n    for (const live of snapshot.edges) expect(Object.isFrozen(live)).toBe(true);\n  });\n});\n"},"packages/core/test/contract/v5-validator.test.ts":{"tests":[{"id":"30","name":"schema v5 validator accepts the minimal v5 project"},{"id":"31","name":"schema v5 validator rejects malformed, non-finite, out-of-range, non-monotonic, and duplicate stops"},{"id":"32","name":"schema v5 validator warns when a property does not cover both interpolation endpoints"},{"id":"33","name":"schema v5 validator rejects v4 and reports the schema path"},{"id":"34","name":"schema v5 validator accepts perspective for 3D content and rejects invalid perspective"},{"id":"35","name":"schema v5 validator warns, but does not reject, 3D content without perspective"},{"id":"36","name":"schema v5 validator rejects duplicate ids, invalid triggers, and malformed freeTracks"},{"id":"37","name":"schema v5 validator rejects invalid observation roles, unknown sources, self references, and cycles"},{"id":"38","name":"schema v5 validator accepts free-track references in the reserved namespace"}],"source":"import { describe, expect, it } from \"vitest\";\n\nimport { validateV5 } from \"../../src/contract/validate-v5\";\n\nconst baseProject = () => ({ schemaVersion: 5, motions: [], freeTracks: [] });\n\nfunction projectWithKeyframes(keyframes: unknown) {\n  return {\n    schemaVersion: 5,\n    motions: [{ id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\", keyframes }] }],\n  };\n}\n\ndescribe(\"schema v5 validator\", () => {\n  it(\"accepts the minimal v5 project\", () => {\n    const result = validateV5(baseProject());\n    expect(result.valid).toBe(true);\n    expect(result.diagnostics).toEqual([]);\n  });\n\n  it(\"rejects malformed, non-finite, out-of-range, non-monotonic, and duplicate stops\", () => {\n    const result = validateV5(\n      projectWithKeyframes({\n        malformed: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 1 },\n          ],\n        },\n        nan: { stops: [{ p: Number.NaN, v: 0 }] },\n        range: { stops: [{ p: 1.5, v: 0 }] },\n        order: {\n          stops: [\n            { p: 0.8, v: 0 },\n            { p: 0.2, v: 1 },\n          ],\n        },\n        duplicate: {\n          stops: [\n            { p: 0.2, v: 0 },\n            { p: 0.2, v: 1 },\n          ],\n        },\n      }),\n    );\n    expect(result.valid).toBe(false);\n    expect(result.diagnostics.map(({ ruleId }) => ruleId)).toEqual(\n      expect.arrayContaining([\n        \"stop-position\",\n        \"stop-position-range\",\n        \"stop-position-order\",\n        \"stop-position-duplicate\",\n      ]),\n    );\n  });\n\n  it(\"warns when a property does not cover both interpolation endpoints\", () => {\n    const result = validateV5(projectWithKeyframes({ opacity: { stops: [{ p: 0.25, v: 0.5 }] } }));\n    expect(result.valid).toBe(true);\n    expect(result.diagnostics).toEqual(\n      expect.arrayContaining([\n        expect.objectContaining({ ruleId: \"stop-missing-start\", severity: \"warning\" }),\n        expect.objectContaining({ ruleId: \"stop-missing-end\", severity: \"warning\" }),\n      ]),\n    );\n  });\n\n  it(\"rejects v4 and reports the schema path\", () => {\n    const result = validateV5({ schemaVersion: 4, motions: [] });\n    expect(result.valid).toBe(false);\n    expect(result.diagnostics[0]).toMatchObject({\n      ruleId: \"schema-version\",\n      path: \"schemaVersion\",\n      severity: \"error\",\n    });\n  });\n\n  it(\"accepts perspective for 3D content and rejects invalid perspective\", () => {\n    const good = validateV5({\n      schemaVersion: 5,\n      perspective: 800,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [{ id: \"tilt\", keyframes: { rotationY: {} } }],\n        },\n      ],\n    });\n    const bad = validateV5({ schemaVersion: 5, perspective: 0, motions: [] });\n    expect(good.valid).toBe(true);\n    expect(bad.diagnostics).toContainEqual(\n      expect.objectContaining({ ruleId: \"perspective-shape\", severity: \"error\" }),\n    );\n  });\n\n  it(\"warns, but does not reject, 3D content without perspective\", () => {\n    const result = validateV5({\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [{ id: \"tilt\", keyframes: { rotationY: {} } }],\n        },\n      ],\n    });\n    expect(result.valid).toBe(true);\n    expect(result.diagnostics).toContainEqual(\n      expect.objectContaining({ ruleId: \"perspective-usage\", severity: \"warning\" }),\n    );\n  });\n\n  it(\"rejects duplicate ids, invalid triggers, and malformed freeTracks\", () => {\n    const result = validateV5({\n      schemaVersion: 5,\n      freeTracks: {},\n      motions: [{ id: \"hero\", trigger: { type: \"unknown\" }, tracks: [{ id: \"x\" }, { id: \"x\" }] }],\n    });\n    expect(result.valid).toBe(false);\n    expect(result.diagnostics.map(({ ruleId }) => ruleId)).toEqual(\n      expect.arrayContaining([\"free-tracks-shape\", \"trigger-shape\", \"track-duplicate-id\"]),\n    );\n  });\n\n  it(\"rejects invalid observation roles, unknown sources, self references, and cycles\", () => {\n    const result = validateV5({\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            { id: \"a\", observes: [{ source: \"b\", role: \"input\" }] },\n            { id: \"b\", observes: [{ source: \"a\" }] },\n          ],\n        },\n      ],\n    });\n    expect(result.valid).toBe(false);\n    expect(result.diagnostics.map(({ ruleId }) => ruleId)).toEqual(\n      expect.arrayContaining([\"graph-cycle\"]),\n    );\n  });\n\n  it(\"accepts free-track references in the reserved namespace\", () => {\n    const result = validateV5({\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            {\n              id: \"pointer\",\n              observes: [{ source: \"~/cursor\", role: \"input\", target: \"position\" }],\n            },\n          ],\n        },\n      ],\n      freeTracks: [{ id: \"cursor\" }],\n    });\n    expect(result.valid).toBe(true);\n  });\n});\n"},"packages/core/test/contract/validation-owner.test.ts":{"tests":[{"id":"39","name":"one observation-validation owner (P1-12) accepts a track observing a sibling named after its own motion"},{"id":"40","name":"one observation-validation owner (P1-12) reports an actual self-reference identically from both owners"},{"id":"41","name":"one observation-validation owner (P1-12) reports a cycle identically from both owners"},{"id":"42","name":"one observation-validation owner (P1-12) spells edge identity the same way in both owners"},{"id":"43","name":"one observation-validation owner (P1-12) keeps two observers of one source out of each other's duplicate check"},{"id":"44","name":"one observation-validation owner (P1-12) mints a frozen snapshot instead of returning the caller's object"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { Diagnostic, ProjectDefinition } from \"../../src/contract/v5\";\nimport { validateV5 } from \"../../src/contract/validate-v5\";\nimport { buildGraphIR } from \"../../src/graph/ir\";\n\ninterface AuthoredObservation {\n  source: string;\n  role?: \"input\" | \"output\";\n  target?: string;\n}\ninterface AuthoredTrack {\n  id: string;\n  keyframes?: Record<"+"string, { stops: Array<"+"{ p: number; v: unknown }> }>;\n  observes?: AuthoredObservation[];\n}\ninterface AuthoredProject {\n  schemaVersion: 5;\n  motions: Array<"+"{ id: string; trigger: { type: \"manual\" }; tracks: AuthoredTrack[] }>;\n}\n\nfunction motion(tracks: AuthoredTrack[], id = \"hero\"): AuthoredProject {\n  return { schemaVersion: 5, motions: [{ id, trigger: { type: \"manual\" }, tracks }] };\n}\n\n/**\n * Diagnostics compared as data, normalized only for the optional `ids` field. Nothing here\n * hardcodes an expected rule id or message: the point of P1-12 is that one owner produces\n * these, so the assertion is that both spellings of the same authored mistake are identical.\n */\nfunction errors(diagnostics: readonly Diagnostic[]) {\n  return diagnostics\n    .filter(({ severity }) => severity === \"error\")\n    .map(({ ruleId, path, message, ids }) => ({ ruleId, path, message, ids: [...(ids ?? [])] }));\n}\n\nfunction graphErrors(project: AuthoredProject) {\n  return errors(buildGraphIR(project as unknown as ProjectDefinition).diagnostics);\n}\n\nfunction validatorErrors(project: AuthoredProject) {\n  return errors(validateV5(project).diagnostics);\n}\n\ndescribe(\"one observation-validation owner (P1-12)\", () => {\n  it(\"accepts a track observing a sibling named after its own motion\", () => {\n    // `hero/arm` observes `hero/hero`. That is a sibling, not a self-reference. The validator\n    // compares against the motion id, so it rejects a project the graph owner accepts.\n    const project = motion([{ id: \"hero\" }, { id: \"arm\", observes: [{ source: \"hero\" }] }]);\n\n    expect(graphErrors(project)).toEqual([]);\n    expect(validatorErrors(project)).toEqual([]);\n    expect(validateV5(project).valid).toBe(true);\n  });\n\n  it(\"reports an actual self-reference identically from both owners\", () => {\n    const project = motion([{ id: \"arm\", observes: [{ source: \"arm\" }] }]);\n\n    const fromGraph = graphErrors(project);\n    expect(fromGraph.map(({ ruleId }) => ruleId)).toEqual([\"observation-self-reference\"]);\n    // The validator misses this rule entirely and only trips its recursive cycle check, so it\n    // names the same mistake `observation-cycle` at a different path.\n    expect(validatorErrors(project)).toEqual(fromGraph);\n  });\n\n  it(\"reports a cycle identically from both owners\", () => {\n    const project = motion([\n      { id: \"a\", observes: [{ source: \"b\" }] },\n      { id: \"b\", observes: [{ source: \"a\" }] },\n    ]);\n\n    const fromGraph = graphErrors(project);\n    expect(fromGraph.map(({ ruleId }) => ruleId)).toEqual([\"graph-cycle\"]);\n    // One cycle algorithm, one rule id, one path, one message. The recursive DFS in the\n    // validator is a second answer to a question the ordering pass already answers, and it\n    // cannot name the participating nodes.\n    expect(validatorErrors(project)).toEqual(fromGraph);\n  });\n\n  it(\"spells edge identity the same way in both owners\", () => {\n    const project = motion([\n      { id: \"b\" },\n      { id: \"arm\", observes: [{ source: \"b\" }, { source: \"b\" }] },\n    ]);\n\n    const fromGraph = graphErrors(project);\n    expect(fromGraph.map(({ ruleId }) => ruleId)).toEqual([\"observation-duplicate\"]);\n    expect(validatorErrors(project)).toEqual(fromGraph);\n  });\n\n  it(\"keeps two observers of one source out of each other's duplicate check\", () => {\n    const project = motion([\n      { id: \"b\" },\n      { id: \"arm\", observes: [{ source: \"b\" }] },\n      { id: \"leg\", observes: [{ source: \"b\" }] },\n    ]);\n\n    expect(graphErrors(project)).toEqual([]);\n    expect(validatorErrors(project)).toEqual([]);\n  });\n\n  it(\"mints a frozen snapshot instead of returning the caller's object\", () => {\n    const project = motion([\n      {\n        id: \"arm\",\n        keyframes: {\n          opacity: {\n            stops: [\n              { p: 0, v: 0 },\n              { p: 1, v: 1 },\n            ],\n          },\n        },\n      },\n    ]);\n\n    const accepted = validateV5(project).value;\n    expect(accepted).toBeDefined();\n    expect(accepted).not.toBe(project);\n    expect(Object.isFrozen(accepted)).toBe(true);\n    expect(Object.isFrozen(accepted?.motions[0]?.tracks[0])).toBe(true);\n\n    const stop = project.motions[0]?.tracks[0]?.keyframes?.opacity?.stops[1];\n    expect(stop).toBeDefined();\n    stop!.v = 999;\n\n    const authored = accepted?.motions[0]?.tracks[0]?.keyframes as\n      | Record<"+"string, { stops: ReadonlyArray<"+"{ p: number; v: unknown }> }>\n      | undefined;\n    expect(authored?.opacity?.stops[1]?.v).toBe(1);\n  });\n});\n"},"packages/core/test/unit/runtime/publisher-flat-inputs.test.ts":{"tests":[{"id":"45","name":"flat projected input observations (X-1) merges an upstream record into the observer source object"},{"id":"46","name":"flat projected input observations (X-1) applies an explicit pick projection before merging input keys"},{"id":"47","name":"flat projected input observations (X-1) rejects colliding projected keys instead of silently overwriting"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { GraphIR } from \"../../../src/graph/ir\";\nimport { GraphPublisher, type PublisherNode } from \"../../../src/runtime/graph-publisher\";\nimport { PatchRegistry } from \"../../../src/runtime/patch-registry\";\n\nfunction node(\n  id: string,\n  edges: GraphIR[\"nodes\"][number][\"edges\"],\n  compose: PublisherNode[\"compose\"],\n): PublisherNode {\n  return Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex: 0,\n    track: { id },\n    edges: Object.freeze(edges),\n    compose,\n  });\n}\n\ndescribe(\"flat projected input observations (X-1)\", () => {\n  it(\"merges an upstream record into the observer source object\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    let observed: Readonly<"+"Record<"+"string, unknown>> | undefined;\n\n    const source = node(\"hero/source\", [], () => ({\n      values: { base: 1, overlay: 99 },\n      sourceProgress: 0.5,\n      sourceRevisions: {},\n    }));\n    const observer = node(\n      \"hero/observer\",\n      [\n        {\n          observerId: \"hero/observer\",\n          sourceId: \"hero/source\",\n          role: \"input\",\n          target: \"fromA\",\n        },\n      ],\n      (inputs) => {\n        observed = inputs;\n        return {\n          values: { seenBase: inputs.base, seenOverlay: inputs.overlay },\n          sourceProgress: 0,\n          sourceRevisions: {},\n        };\n      },\n    );\n\n    const snapshot = {\n      nodes: [source, observer],\n      nodeById: { \"hero/source\": source, \"hero/observer\": observer },\n      order: [\"hero/source\", \"hero/observer\"],\n      diagnostics: [],\n    } as GraphIR & { nodes: readonly PublisherNode[] };\n\n    publisher.flush(snapshot, [\"hero/source\"], 1);\n\n    expect(observed).toEqual({ base: 1, overlay: 99 });\n    expect(registry.get(\"hero/observer\")?.values).toEqual({\n      seenBase: 1,\n      seenOverlay: 99,\n    });\n  });\n\n  it(\"applies an explicit pick projection before merging input keys\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    let observed: Readonly<"+"Record<"+"string, unknown>> | undefined;\n    const source = node(\"hero/source\", [], () => ({\n      values: { base: 1, overlay: 99 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const observer = node(\n      \"hero/observer\",\n      [\n        {\n          observerId: \"hero/observer\",\n          sourceId: \"hero/source\",\n          role: \"input\",\n          target: \"fromA\",\n          projection: { pick: [\"overlay\"] },\n        } as never,\n      ],\n      (inputs) => {\n        observed = inputs;\n        return { values: inputs, sourceProgress: 0, sourceRevisions: {} };\n      },\n    );\n    const snapshot = {\n      nodes: [source, observer],\n      nodeById: { \"hero/source\": source, \"hero/observer\": observer },\n      order: [\"hero/source\", \"hero/observer\"],\n      diagnostics: [],\n    } as GraphIR & { nodes: readonly PublisherNode[] };\n\n    publisher.flush(snapshot, [\"hero/source\"], 1);\n    expect(observed).toEqual({ overlay: 99 });\n  });\n\n  it(\"rejects colliding projected keys instead of silently overwriting\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    const sourceA = node(\"hero/a\", [], () => ({\n      values: { value: 1 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const sourceB = node(\"hero/b\", [], () => ({\n      values: { value: 2 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const observer = node(\n      \"hero/observer\",\n      [\n        {\n          observerId: \"hero/observer\",\n          sourceId: \"hero/a\",\n          role: \"input\",\n          target: \"a\",\n          projection: { map: { value: \"shared\" } },\n        } as never,\n        {\n          observerId: \"hero/observer\",\n          sourceId: \"hero/b\",\n          role: \"input\",\n          target: \"b\",\n          projection: { map: { value: \"shared\" } },\n        } as never,\n      ],\n      (inputs) => ({ values: inputs, sourceProgress: 0, sourceRevisions: {} }),\n    );\n    const snapshot = {\n      nodes: [sourceA, sourceB, observer],\n      nodeById: { \"hero/a\": sourceA, \"hero/b\": sourceB, \"hero/observer\": observer },\n      order: [\"hero/a\", \"hero/b\", \"hero/observer\"],\n      diagnostics: [],\n    } as GraphIR & { nodes: readonly PublisherNode[] };\n\n    const batch = publisher.flush(snapshot, [\"hero/a\", \"hero/b\"], 1);\n    expect(\n      batch.patches.find((patch) => patch.nodeId === \"hero/observer\")?.diagnostics[0]?.ruleId,\n    ).toBe(\"observation-input-collision\");\n  });\n});\n"},"packages/core/test/unit/runtime/clock-tick-identity.test.ts":{"tests":[{"id":"48","name":"clock and batch identity are independent (P0-1) keeps the clock running after a seek published without a frame"},{"id":"49","name":"clock and batch identity are independent (P0-1) separates the clock's frame number from batch identity"},{"id":"50","name":"clock and batch identity are independent (P0-1) reports a failed flush as a diagnostic instead of propagating it into the clock"},{"id":"51","name":"clock and batch identity are independent (P0-1) requests the next animation frame even when a clock listener throws"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { Diagnostic, ProjectDefinition } from \"../../../src/contract/v5\";\nimport { createBrowserClock } from \"../../../src/adapters/browser-clock\";\nimport type { GraphNode } from \"../../../src/graph/ir\";\nimport { createManualClock } from \"../../../src/ports/clock\";\nimport { GraphRuntime, type ComposeResolver } from \"../../../src/runtime/graph-runtime\";\nimport { ProjectRuntime } from \"../../../src/runtime/project-runtime\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] },\n    { id: \"caption\", trigger: { type: \"manual\" }, tracks: [{ id: \"label\" }] },\n  ],\n};\n\n/**\n * Composes a different value every call, so no publication is ever suppressed as unchanged.\n * A test about flush survival must not be able to pass because nothing was published.\n */\nfunction countingCompose(): ComposeResolver {\n  let calls = 0;\n  return (node: GraphNode) => () => ({\n    values: { node: node.id, call: (calls += 1) },\n    sourceProgress: 0,\n    sourceRevisions: {},\n  });\n}\n\ndescribe(\"clock and batch identity are independent (P0-1)\", () => {\n  it(\"keeps the clock running after a seek published without a frame\", () => {\n    const clock = createManualClock();\n    const runtime = new ProjectRuntime(project, { clock, compose: countingCompose() });\n    runtime.mount(\"hero/arm\");\n\n    // seek() publishes outside the frame loop. It must not consume a clock frame number,\n    // because the clock will reuse that number on its very next frame.\n    runtime.seek(\"hero/arm\", 0.5);\n\n    expect(() => clock.tick(16)).not.toThrow();\n    expect(() => clock.tick(16)).not.toThrow();\n    expect(runtime.graph.tick).toBe(2);\n\n    runtime.dispose();\n  });\n\n  it(\"separates the clock's frame number from batch identity\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, countingCompose());\n    runtime.attach(\"hero/arm\");\n\n    const batchTicks: number[] = [];\n    runtime.registry.subscribeBatch((batch) => batchTicks.push(batch.tick));\n\n    clock.tick(16);\n    runtime.invalidate([\"hero/arm\"]);\n    clock.tick(16);\n\n    // Two frames happened, so the clock advanced twice and no more.\n    expect(runtime.tick).toBe(2);\n    // Three publications happened, so batch identity advanced three times.\n    expect(runtime.sequence).toBe(3);\n    expect(batchTicks).toEqual([1, 2, 3]);\n\n    runtime.dispose();\n  });\n\n  it(\"reports a failed flush as a diagnostic instead of propagating it into the clock\", () => {\n    const clock = createManualClock();\n    const failures: Diagnostic[] = [];\n    const runtime = new GraphRuntime(project, clock, countingCompose(), {\n      onFlushError: (diagnostic) => failures.push(diagnostic),\n    });\n    runtime.attach(\"hero/arm\");\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      throw new Error(\"subscriber boom\");\n    });\n\n    // A consumer's bug must not be able to stop the frame loop.\n    expect(() => clock.tick(16)).not.toThrow();\n    expect(failures.map(({ ruleId }) => ruleId)).toEqual([\"flush-failure\"]);\n    expect(failures[0]?.message).toMatch(/subscriber boom/);\n    expect(failures[0]?.severity).toBe(\"error\");\n\n    // And the next frame still runs.\n    expect(() => clock.tick(16)).not.toThrow();\n    expect(runtime.tick).toBe(2);\n    // The work the failed flush was carrying is queued, not dropped.\n    expect(runtime.pendingSeeds).toContain(\"hero/arm\");\n\n    runtime.dispose();\n  });\n\n  it(\"requests the next animation frame even when a clock listener throws\", () => {\n    const frames: ((time: number) => void)[] = [];\n    let requests = 0;\n    const clock = createBrowserClock({\n      requestFrame(listener) {\n        frames.push(listener);\n        requests += 1;\n        return requests;\n      },\n      cancelFrame() {},\n    });\n\n    const secondSaw: number[] = [];\n    clock.subscribe(() => {\n      throw new Error(\"listener boom\");\n    });\n    clock.subscribe(({ tick }) => secondSaw.push(tick));\n\n    expect(requests).toBe(1);\n    // The failure still surfaces to the host, but only after the loop is safe.\n    expect(() => frames.shift()?.(16)).toThrow(/listener boom/);\n    // Every listener got its turn despite the earlier throw.\n    expect(secondSaw).toEqual([1]);\n    // The loop rescheduled itself, so the clock is not dead.\n    expect(requests).toBe(2);\n\n    expect(() => frames.shift()?.(32)).toThrow(/listener boom/);\n    expect(secondSaw).toEqual([1, 2]);\n    expect(requests).toBe(3);\n\n    clock.dispose();\n  });\n});\n"},"packages/core/test/integration/p2-runtime-smells.test.ts":{"tests":[{"id":"52","name":"P2 runtime smell hardening preserves the last known good values when a node publishes error"},{"id":"53","name":"P2 runtime smell hardening derives source revisions from the upstream patches consumed in the flush"},{"id":"54","name":"P2 runtime smell hardening reports a missing upstream instead of silently composing with an input hole"},{"id":"55","name":"P2 runtime smell hardening chooses the blocked upstream deterministically by edge key, not authored edge order"},{"id":"56","name":"P2 runtime smell hardening rejects host objects from interpolator state at the renderer edge"},{"id":"57","name":"P2 runtime smell hardening kills a timeline exactly once when a Track is disposed repeatedly"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport type { GraphEdge, GraphIR } from \"../../src/graph/ir\";\nimport { GraphPublisher, type PublisherNode } from \"../../src/runtime/graph-publisher\";\nimport { PatchRegistry } from \"../../src/runtime/patch-registry\";\nimport { Track } from \"../../src/domain/track\";\nimport type { Interpolator } from \"../../src/ports/interpolator\";\n\nconst node = (id: string, edges: GraphEdge[], compose: PublisherNode[\"compose\"]): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex: 0,\n    track: { id },\n    edges: Object.freeze(edges),\n    compose,\n  });\nconst snapshot = (\n  nodes: readonly PublisherNode[],\n): GraphIR & { nodes: readonly PublisherNode[] } => ({\n  nodes,\n  nodeById: Object.freeze(Object.fromEntries(nodes.map((entry) => [entry.id, entry]))),\n  order: Object.freeze(nodes.map(({ id }) => id)),\n  diagnostics: Object.freeze([]),\n});\nfunction fakeInterpolator(state: Readonly<"+"Record<"+"string, unknown>> = { x: 1 }) {\n  const kill = vi.fn();\n  const timeline = { state, progress: vi.fn(), kill };\n  return { interpolator: { create: vi.fn(() => timeline) } as unknown as Interpolator, kill };\n}\n\ndescribe(\"P2 runtime smell hardening\", () => {\n  it(\"preserves the last known good values when a node publishes error\", () => {\n    const registry = new PatchRegistry();\n    registry.beginBatch(1, [\"source\"]);\n    registry.publish({ nodeId: \"source\", values: { x: 1 }, sourceProgress: 0, status: \"ready\" });\n    registry.closeBatch();\n    registry.beginBatch(2, [\"source\"]);\n    registry.publish({\n      nodeId: \"source\",\n      sourceProgress: 0,\n      status: \"error\",\n      diagnostics: [{ ruleId: \"test\", path: \"source\", message: \"boom\", severity: \"error\" }],\n    });\n    registry.closeBatch();\n    expect(registry.get(\"source\")?.values).toEqual({ x: 1 });\n  });\n  it(\"derives source revisions from the upstream patches consumed in the flush\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    const source = node(\"source\", [], () => ({\n      values: { x: 1 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const consumer = node(\n      \"consumer\",\n      [{ observerId: \"consumer\", sourceId: \"source\", role: \"input\" }],\n      (inputs) => ({ values: inputs, sourceProgress: 0, sourceRevisions: {} }),\n    );\n    publisher.flush(snapshot([source, consumer]), [\"source\", \"consumer\"], 1);\n    expect(registry.get(\"consumer\")?.sourceRevisions).toEqual({ source: 1 });\n  });\n  it(\"reports a missing upstream instead of silently composing with an input hole\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    const consumer = node(\n      \"consumer\",\n      [{ observerId: \"consumer\", sourceId: \"missing\", role: \"input\" }],\n      (inputs) => ({ values: inputs, sourceProgress: 0, sourceRevisions: {} }),\n    );\n    publisher.flush(snapshot([consumer]), [\"consumer\"], 1);\n    expect(registry.get(\"consumer\")?.status).toBe(\"error\");\n    expect(registry.get(\"consumer\")?.diagnostics[0]?.ruleId).toBe(\"observation-missing-upstream\");\n  });\n  it(\"chooses the blocked upstream deterministically by edge key, not authored edge order\", () => {\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    const failedA = node(\"a\", [], () => {\n      throw new Error(\"a failed\");\n    });\n    const failedB
