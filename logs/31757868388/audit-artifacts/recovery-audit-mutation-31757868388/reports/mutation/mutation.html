= node(\"b\", [], () => {\n      throw new Error(\"b failed\");\n    });\n    const consumer = node(\n      \"consumer\",\n      [\n        { observerId: \"consumer\", sourceId: \"b\", role: \"input\" },\n        { observerId: \"consumer\", sourceId: \"a\", role: \"input\" },\n      ],\n      (inputs) => ({ values: inputs, sourceProgress: 0, sourceRevisions: {} }),\n    );\n    publisher.flush(snapshot([failedA, failedB, consumer]), [\"a\", \"b\", \"consumer\"], 1);\n    expect(registry.get(\"consumer\")?.diagnostics[0]?.ids).toEqual([\"a\", \"consumer\"]);\n  });\n  it(\"rejects host objects from interpolator state at the renderer edge\", () => {\n    const { interpolator } = fakeInterpolator({ host: new Date(0) });\n    const track = new Track({ interpolator });\n    expect(() => track.compose()).toThrow(/renderer-neutral/);\n  });\n  it(\"kills a timeline exactly once when a Track is disposed repeatedly\", () => {\n    const { interpolator, kill } = fakeInterpolator();\n    const track = new Track({ interpolator });\n    track.dispose();\n    track.dispose();\n    expect(kill).toHaveBeenCalledOnce();\n    expect(() => track.compose()).toThrow(/disposed/);\n  });\n});\n"},"packages/core/test/unit/runtime/patch-registry-structural-change.test.ts":{"tests":[{"id":"58","name":"PatchRegistry: structural change detection (recovery P1-5) suppresses the republish when a freshly allocated nested record is structurally equal"},{"id":"59","name":"PatchRegistry: structural change detection (recovery P1-5) key insertion order inside a nested record is not a change"},{"id":"60","name":"PatchRegistry: structural change detection (recovery P1-5) republishes when a nested value actually changes"},{"id":"61","name":"PatchRegistry: structural change detection (recovery P1-5) republishes when only the order of a nested array changes"},{"id":"62","name":"PatchRegistry: structural change detection (recovery P1-5) republishes when only a source revision changes"},{"id":"63","name":"PatchRegistry: structural change detection (recovery P1-5) diagnostics equality is field-wise, so key order is not a change"},{"id":"64","name":"PatchRegistry: structural change detection (recovery P1-5) republishes when a diagnostic field actually changes"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { Diagnostic } from \"../../../src/contract/v5\";\nimport { PatchRegistry, type Patch } from \"../../../src/runtime/patch-registry\";\n\nconst NODE_ID = \"hero/arm\";\n\n/**\n * A composed value record is freshly allocated on every flush, so identity compare can never\n * match a nested value. Change detection has to be structural or the registry republishes,\n * bumps the revision, and wakes every listener on every frame.\n */\nfunction publishComposed(\n  registry: PatchRegistry,\n  tick: number,\n  values: Readonly<"+"Record<"+"string, unknown>>,\n  sourceRevisions: Readonly<"+"Record<"+"string, number>> = { \"hero/root\": 3 },\n): Patch | undefined {\n  registry.beginBatch(tick, [NODE_ID]);\n  const patch = registry.publish({\n    nodeId: NODE_ID,\n    values,\n    sourceProgress: 0.25,\n    sourceRevisions,\n    status: \"ready\",\n  });\n  registry.closeBatch();\n  return patch;\n}\n\nfunction publishBlocked(\n  registry: PatchRegistry,\n  tick: number,\n  diagnostics: readonly Diagnostic[],\n): Patch | undefined {\n  registry.beginBatch(tick, [NODE_ID]);\n  const patch = registry.publish({\n    nodeId: NODE_ID,\n    sourceProgress: 0,\n    status: \"blocked\",\n    diagnostics,\n  });\n  registry.closeBatch();\n  return patch;\n}\n\ndescribe(\"PatchRegistry: structural change detection (recovery P1-5)\", () => {\n  it(\"suppresses the republish when a freshly allocated nested record is structurally equal\", () => {\n    const registry = new PatchRegistry();\n    let notifications = 0;\n    registry.subscribeNode(NODE_ID, () => {\n      notifications += 1;\n    });\n\n    const first = publishComposed(registry, 1, {\n      transform: { x: 1, y: 2 },\n      tags: [\"a\", \"b\"],\n      opacity: 1,\n    });\n    const second = publishComposed(registry, 2, {\n      transform: { x: 1, y: 2 },\n      tags: [\"a\", \"b\"],\n      opacity: 1,\n    });\n\n    expect(first?.revision).toBe(1);\n    expect(second).toBeUndefined();\n    expect(registry.get(NODE_ID)?.revision).toBe(1);\n    expect(notifications).toBe(1);\n  });\n\n  it(\"key insertion order inside a nested record is not a change\", () => {\n    const registry = new PatchRegistry();\n    publishComposed(registry, 1, { transform: { x: 1, y: 2 } });\n    const second = publishComposed(registry, 2, { transform: { y: 2, x: 1 } });\n    expect(second).toBeUndefined();\n    expect(registry.get(NODE_ID)?.revision).toBe(1);\n  });\n\n  it(\"republishes when a nested value actually changes\", () => {\n    const registry = new PatchRegistry();\n    publishComposed(registry, 1, { transform: { x: 1, y: 2 } });\n    const second = publishComposed(registry, 2, { transform: { x: 1, y: 3 } });\n    expect(second?.revision).toBe(2);\n  });\n\n  it(\"republishes when only the order of a nested array changes\", () => {\n    const registry = new PatchRegistry();\n    publishComposed(registry, 1, { tags: [\"a\", \"b\"] });\n    const second = publishComposed(registry, 2, { tags: [\"b\", \"a\"] });\n    expect(second?.revision).toBe(2);\n  });\n\n  it(\"republishes when only a source revision changes\", () => {\n    const registry = new PatchRegistry();\n    publishComposed(registry, 1, { opacity: 1 }, { \"hero/root\": 3 });\n    const second = publishComposed(registry, 2, { opacity: 1 }, { \"hero/root\": 4 });\n    expect(second?.revision).toBe(2);\n  });\n\n  it(\"diagnostics equality is field-wise, so key order is not a change\", () => {\n    const registry = new PatchRegistry();\n    const authored: Diagnostic = {\n      ruleId: \"blocked-upstream\",\n      path: NODE_ID,\n      message: \"Blocked by upstream failure at hero/root.\",\n      severity: \"error\",\n      ids: [\"hero/root\", NODE_ID],\n    };\n    const reordered: Diagnostic = {\n      severity: \"error\",\n      ids: [\"hero/root\", NODE_ID],\n      message: \"Blocked by upstream failure at hero/root.\",\n      path: NODE_ID,\n      ruleId: \"blocked-upstream\",\n    };\n\n    expect(publishBlocked(registry, 1, [authored])?.revision).toBe(1);\n    expect(publishBlocked(registry, 2, [reordered])).toBeUndefined();\n    expect(registry.get(NODE_ID)?.revision).toBe(1);\n  });\n\n  it(\"republishes when a diagnostic field actually changes\", () => {\n    const registry = new PatchRegistry();\n    const base: Diagnostic = {\n      ruleId: \"blocked-upstream\",\n      path: NODE_ID,\n      message: \"Blocked by upstream failure at hero/root.\",\n      severity: \"error\",\n      ids: [\"hero/root\", NODE_ID],\n    };\n    publishBlocked(registry, 1, [base]);\n    const second = publishBlocked(registry, 2, [{ ...base, ids: [\"hero/other\", NODE_ID] }]);\n    expect(second?.revision).toBe(2);\n  });\n});\n"},"packages/core/test/unit/graph/order.test.ts":{"tests":[{"id":"65","name":"canonical order and cycle detection emits every source before its observers and composes a diamond once"},{"id":"66","name":"canonical order and cycle detection is a pure function of qualified ids and authored order, not of input order"},{"id":"67","name":"canonical order and cycle detection keeps disconnected components in canonical id order"},{"id":"68","name":"canonical order and cycle detection reports a self cycle as a single-node path"},{"id":"69","name":"canonical order and cycle detection names the minimal path of every distinct cycle"},{"id":"70","name":"canonical order and cycle detection carries canonical order on the immutable IR"},{"id":"71","name":"canonical order and cycle detection rejects a cyclic project before mount"},{"id":"72","name":"canonical order and cycle detection produces byte-identical diagnostics for the same cyclic input"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../../src/contract/v5\";\nimport type { GraphNode } from \"../../../src/graph/ir\";\nimport { buildGraphIR } from \"../../../src/graph/ir\";\nimport { orderGraph } from \"../../../src/graph/order\";\n\nconst node = (id: string, authoredIndex: number, sources: readonly string[] = []): GraphNode => {\n  const edges = sources.map((sourceId) => ({ observerId: id, sourceId, role: \"output\" as const }));\n  const built: GraphNode = {\n    id,\n    owner: id.startsWith(\"~/\") ? \"free\" : \"motion\",\n    authoredIndex,\n    track: { id: id.slice(id.indexOf(\"/\") + 1) },\n    edges: Object.freeze(edges),\n  };\n  return Object.freeze(built);\n};\n\nconst ruleAndIds = (diagnostics: readonly { ruleId: string; ids?: readonly string[] }[]) =>\n  diagnostics.map(({ ruleId, ids }) => [ruleId, ids]);\n\ndescribe(\"canonical order and cycle detection\", () => {\n  it(\"emits every source before its observers and composes a diamond once\", () => {\n    const result = orderGraph([\n      node(\"hero/sink\", 3, [\"hero/left\", \"hero/right\"]),\n      node(\"hero/right\", 2, [\"hero/root\"]),\n      node(\"hero/left\", 1, [\"hero/root\"]),\n      node(\"hero/root\", 0),\n    ]);\n    expect(result.diagnostics).toEqual([]);\n    expect(result.order).toEqual([\"hero/root\", \"hero/left\", \"hero/right\", \"hero/sink\"]);\n    expect(Object.isFrozen(result.order)).toBe(true);\n  });\n\n  it(\"is a pure function of qualified ids and authored order, not of input order\", () => {\n    const first = orderGraph([\n      node(\"hero/root\", 0),\n      node(\"hero/left\", 1, [\"hero/root\"]),\n      node(\"hero/right\", 2, [\"hero/root\"]),\n      node(\"~/cursor\", 0),\n    ]);\n    const second = orderGraph([\n      node(\"~/cursor\", 0),\n      node(\"hero/right\", 2, [\"hero/root\"]),\n      node(\"hero/root\", 0),\n      node(\"hero/left\", 1, [\"hero/root\"]),\n    ]);\n    expect(first.order).toEqual([\"hero/root\", \"hero/left\", \"hero/right\", \"~/cursor\"]);\n    expect(second.order).toEqual(first.order);\n  });\n\n  it(\"keeps disconnected components in canonical id order\", () => {\n    const result = orderGraph([node(\"~/cursor\", 0), node(\"hero/arm\", 0), node(\"caption/label\", 0)]);\n    expect(result.order).toEqual([\"caption/label\", \"hero/arm\", \"~/cursor\"]);\n  });\n\n  it(\"reports a self cycle as a single-node path\", () => {\n    const result = orderGraph([node(\"hero/loop\", 0, [\"hero/loop\"])]);\n    expect(result.order).toBeUndefined();\n    expect(ruleAndIds(result.diagnostics)).toEqual([[\"graph-cycle\", [\"hero/loop\"]]]);\n  });\n\n  it(\"names the minimal path of every distinct cycle\", () => {\n    const result = orderGraph([\n      node(\"rig/a\", 0, [\"rig/c\"]),\n      node(\"rig/b\", 1, [\"rig/a\"]),\n      node(\"rig/c\", 2, [\"rig/b\", \"rig/a\"]),\n    ]);\n    expect(result.order).toBeUndefined();\n    expect(ruleAndIds(result.diagnostics)).toEqual([\n      [\"graph-cycle\", [\"rig/a\", \"rig/c\"]],\n      [\"graph-cycle\", [\"rig/a\", \"rig/b\", \"rig/c\"]],\n    ]);\n  });\n\n  it(\"carries canonical order on the immutable IR\", () => {\n    const project: ProjectDefinition = {\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            { id: \"arm\", observes: [{ source: \"~/cursor\", role: \"input\", target: \"pointer\" }] },\n          ],\n        },\n      ],\n      freeTracks: [{ id: \"cursor\" }],\n    };\n    const result = buildGraphIR(project);\n    expect(result.diagnostics).toEqual([]);\n    expect(result.graph?.order).toEqual([\"~/cursor\", \"hero/arm\"]);\n    expect(Object.isFrozen(result.graph?.order)).toBe(true);\n  });\n\n  it(\"rejects a cyclic project before mount\", () => {\n    const project: ProjectDefinition = {\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"rig\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            { id: \"a\", observes: [{ source: \"b\" }] },\n            { id: \"b\", observes: [{ source: \"a\" }] },\n          ],\n        },\n      ],\n    };\n    const result = buildGraphIR(project);\n    expect(result.graph).toBeUndefined();\n    expect(ruleAndIds(result.diagnostics)).toEqual([[\"graph-cycle\", [\"rig/a\", \"rig/b\"]]]);\n  });\n\n  it(\"produces byte-identical diagnostics for the same cyclic input\", () => {\n    const cyclic = [node(\"rig/a\", 0, [\"rig/b\"]), node(\"rig/b\", 1, [\"rig/a\"])];\n    expect(JSON.stringify(orderGraph(cyclic).diagnostics)).toEqual(\n      JSON.stringify(orderGraph([...cyclic].reverse()).diagnostics),\n    );\n  });\n});\n"},"packages/core/test/unit/graph/ir-validation.test.ts":{"tests":[{"id":"73","name":"graph IR and candidate validation normalizes motion and free tracks into one frozen node model"},{"id":"74","name":"graph IR and candidate validation resolves local, free, and cross-motion observation sources"},{"id":"75","name":"graph IR and candidate validation rejects unknown, duplicate, self, and role-invalid edges before mount"},{"id":"76","name":"graph IR and candidate validation rejects duplicate motion and node identities"},{"id":"77","name":"graph IR and candidate validation orders diagnostics deterministically"},{"id":"78","name":"graph IR and candidate validation breaks diagnostic ties by code unit, not by locale collation"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { buildGraphIR } from \"../../../src/graph/ir\";\nimport type { ProjectDefinition } from \"../../../src/contract/v5\";\n\nconst project = (overrides: Partial<"+"ProjectDefinition> = {}): ProjectDefinition => ({\n  schemaVersion: 5,\n  motions: [{ id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] }],\n  freeTracks: [{ id: \"cursor\" }],\n  ...overrides,\n});\n\ndescribe(\"graph IR and candidate validation\", () => {\n  it(\"normalizes motion and free tracks into one frozen node model\", () => {\n    const result = buildGraphIR(project());\n    expect(result.diagnostics).toEqual([]);\n    expect(result.graph?.nodes.map(({ id, owner }) => [id, owner])).toEqual([\n      [\"hero/arm\", \"motion\"],\n      [\"~/cursor\", \"free\"],\n    ]);\n    expect(Object.isFrozen(result.graph)).toBe(true);\n    expect(Object.isFrozen(result.graph?.nodes)).toBe(true);\n  });\n\n  it(\"resolves local, free, and cross-motion observation sources\", () => {\n    const result = buildGraphIR(\n      project({\n        motions: [\n          {\n            id: \"hero\",\n            trigger: { type: \"manual\" },\n            tracks: [\n              { id: \"arm\", observes: [{ source: \"~/cursor\", role: \"input\", target: \"pointer\" }] },\n            ],\n          },\n          {\n            id: \"caption\",\n            trigger: { type: \"manual\" },\n            tracks: [{ id: \"label\", observes: [{ source: \"hero/arm\" }] }],\n          },\n        ],\n      }),\n    );\n    expect(result.diagnostics).toEqual([]);\n    expect(\n      result.graph?.nodes.flatMap(({ edges }) => edges.map(({ sourceId }) => sourceId)),\n    ).toEqual([\"~/cursor\", \"hero/arm\"]);\n  });\n\n  it(\"rejects unknown, duplicate, self, and role-invalid edges before mount\", () => {\n    const result = buildGraphIR(\n      project({\n        motions: [\n          {\n            id: \"hero\",\n            trigger: { type: \"manual\" },\n            tracks: [\n              {\n                id: \"arm\",\n                observes: [\n                  { source: \"missing\" },\n                  { source: \"missing\" },\n                  { source: \"arm\" },\n                  { source: \"cursor\", role: \"input\" },\n                  { source: \"cursor\", role: \"output\", target: \"bad\" },\n                ],\n              },\n            ],\n          },\n        ],\n      }),\n    );\n    expect(result.graph).toBeUndefined();\n    expect(result.diagnostics.map(({ ruleId }) => ruleId)).toEqual(\n      expect.arrayContaining([\n        \"observation-duplicate\",\n        \"observation-output-target\",\n        \"observation-self-reference\",\n        \"observation-unknown-source\",\n      ]),\n    );\n  });\n\n  it(\"rejects duplicate motion and node identities\", () => {\n    const result = buildGraphIR(\n      project({\n        motions: [\n          { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] },\n          { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] },\n        ],\n      }),\n    );\n    expect(result.graph).toBeUndefined();\n    expect(result.diagnostics.map(({ ruleId }) => ruleId)).toContain(\"motion-duplicate\");\n  });\n\n  it(\"orders diagnostics deterministically\", () => {\n    const first = buildGraphIR(\n      project({\n        motions: [\n          {\n            id: \"hero\",\n            trigger: { type: \"manual\" },\n            tracks: [{ id: \"arm\", observes: [{ source: \"missing\" }] }],\n          },\n        ],\n      }),\n    );\n    const second = buildGraphIR(\n      project({\n        motions: [\n          {\n            id: \"hero\",\n            trigger: { type: \"manual\" },\n            tracks: [{ id: \"arm\", observes: [{ source: \"missing\" }] }],\n          },\n        ],\n      }),\n    );\n    expect(first.diagnostics).toEqual(second.diagnostics);\n  });\n\n  it(\"breaks diagnostic ties by code unit, not by locale collation\", () => {\n    const result = buildGraphIR(\n      project({\n        motions: [\n          {\n            id: \"a\",\n            trigger: { type: \"manual\" },\n            tracks: [{ id: \"bx\", observes: [{ source: \"~/nope\" }] }],\n          },\n          {\n            id: \"a-b\",\n            trigger: { type: \"manual\" },\n            tracks: [{ id: \"x\", observes: [{ source: \"~/nope\" }] }],\n          },\n        ],\n      }),\n    );\n    expect(result.graph).toBeUndefined();\n    expect(result.diagnostics.map(({ path }) => path)).toEqual([\"a-b/x\", \"a/bx\"]);\n  });\n});\n"},"packages/core/test/unit/runtime/composition-output-shape.test.ts":{"tests":[{"id":"79","name":"composition and output-shape diagnostics diagnoses a plugin returning a non-record composition value"},{"id":"80","name":"composition and output-shape diagnostics diagnoses an output observation whose source has already published a non-record value"},{"id":"81","name":"composition and output-shape diagnostics does not publish malformed composition values as ready patches"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { PluginRegistry } from \"../../../src/domain/plugins\";\nimport { Engine } from \"../../../src/engine\";\nimport type { GraphIR } from \"../../../src/graph/ir\";\nimport { createManualClock } from \"../../../src/ports/clock\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../../src/ports/fakes\";\nimport { GraphPublisher, type PublisherNode } from \"../../../src/runtime/graph-publisher\";\nimport { PatchRegistry } from \"../../../src/runtime/patch-registry\";\n\nconst node = (\n  id: string,\n  edges: GraphIR[\"nodes\"][number][\"edges\"],\n  compose: PublisherNode[\"compose\"],\n): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex: 0,\n    track: { id },\n    edges: Object.freeze(edges),\n    compose,\n  });\n\nconst snapshot = (\n  nodes: readonly PublisherNode[],\n): GraphIR & { nodes: readonly PublisherNode[] } => ({\n  nodes,\n  nodeById: Object.freeze(Object.fromEntries(nodes.map((item) => [item.id, item]))),\n  order: Object.freeze(nodes.map(({ id }) => id)),\n  diagnostics: Object.freeze([]),\n});\n\ndescribe(\"composition and output-shape diagnostics\", () => {\n  it(\"diagnoses a plugin returning a non-record composition value\", () => {\n    const plugins = new PluginRegistry();\n    plugins.register({\n      name: \"bad-opacity\",\n      keys: [\"opacity\"],\n      compose: () => [\"not\", \"a\", \"record\"] as never,\n    });\n    const engine = new Engine({\n      clock: createManualClock(),\n      interpolator: createFakeInterpolator(),\n      scheduler: createFakeScheduler(),\n      plugins,\n    });\n    const runtime = engine.load({\n      schemaVersion: 5,\n      motions: [\n        {\n          id: \"hero\",\n          trigger: { type: \"manual\" },\n          tracks: [\n            {\n              id: \"arm\",\n              keyframes: {\n                opacity: {\n                  stops: [\n                    { p: 0, v: 0 },\n                    { p: 1, v: 1 },\n                  ],\n                },\n              },\n            },\n          ],\n        },\n      ],\n    });\n\n    runtime.mount(\"hero/arm\");\n    const batch = runtime.seek(\"hero/arm\", 0.5);\n    expect(batch.patches.find(({ nodeId }) => nodeId === \"hero/arm\")?.diagnostics[0]?.ruleId).toBe(\n      \"composition-output-shape\",\n    );\n    runtime.dispose();\n  });\n\n  it(\"diagnoses an output observation whose source has already published a non-record value\", () => {\n    const registry = new PatchRegistry();\n    registry.beginBatch(1, [\"hero/source\"]);\n    registry.publish({\n      nodeId: \"hero/source\",\n      values: [\"bad\", \"output\"] as never,\n      sourceProgress: 0,\n      sourceRevisions: {},\n      status: \"ready\",\n    });\n    registry.closeBatch();\n\n    const source = node(\"hero/source\", [], () => ({\n      values: { ignored: true },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const observer = node(\n      \"hero/observer\",\n      [{ observerId: \"hero/observer\", sourceId: \"hero/source\", role: \"output\" }],\n      () => ({ values: { local: true }, sourceProgress: 0, sourceRevisions: {} }),\n    );\n    const batch = new GraphPublisher(registry).flush(\n      snapshot([source, observer]),\n      [\"hero/observer\"],\n      2,\n    );\n\n    expect(\n      batch.patches.find(({ nodeId }) => nodeId === \"hero/observer\")?.diagnostics[0]?.ruleId,\n    ).toBe(\"observation-output-shape\");\n  });\n\n  it(\"does not publish malformed composition values as ready patches\", () => {\n    const malformed = node(\"hero/bad\", [], () => ({\n      values: { nested: () => undefined } as never,\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const registry = new PatchRegistry();\n    const batch = new GraphPublisher(registry).flush(snapshot([malformed]), [\"hero/bad\"], 1);\n    const patch = batch.patches.find(({ nodeId }) => nodeId === \"hero/bad\");\n\n    expect(patch?.status).toBe(\"error\");\n    expect(patch?.diagnostics[0]?.ruleId).toBe(\"composition-output-shape\");\n    expect(registry.get(\"hero/bad\")?.status).toBe(\"error\");\n  });\n});\n"},"packages/core/test/contract/gsap-authored-duration.test.ts":{"tests":[{"id":"82","name":"GSAP authored-duration pinning (P0-3b) keeps the authored duration when the last stop ends before the end"},{"id":"83","name":"GSAP authored-duration pinning (P0-3b) scales the shared tween by the configured track duration"},{"id":"84","name":"GSAP authored-duration pinning (P0-3b) holds every property independently when grids end at different positions"},{"id":"85","name":"GSAP authored-duration pinning (P0-3b) reports the authored duration for a track with no authored stops"},{"id":"86","name":"GSAP authored-duration pinning (P0-3b) uses one shared tween and never publishes GSAP bookkeeping"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createRealGsapSeam, readNumber } from \"../support/real-gsap\";\n\nfunction authoredKeys(state: Readonly<"+"Record<"+"string, unknown>>): readonly string[] {\n  return Object.keys(state).filter((key) => !key.startsWith(\"_\"));\n}\n\ndescribe(\"GSAP authored-duration pinning (P0-3b)\", () => {\n  it(\"keeps the authored duration when the last stop ends before the end\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 100 },\n          ],\n        },\n      },\n    });\n    const x = (): number => readNumber(timeline.state, \"x\");\n    expect(timeline.duration).toBeCloseTo(1, 10);\n    timeline.progress(0);\n    expect(x()).toBeCloseTo(0, 6);\n    timeline.progress(0.25);\n    expect(x()).toBeCloseTo(50, 6);\n    timeline.progress(0.5);\n    expect(x()).toBeCloseTo(100, 6);\n    timeline.progress(0.9);\n    expect(x()).toBeCloseTo(100, 6);\n    timeline.progress(1);\n    expect(x()).toBeCloseTo(100, 6);\n    timeline.kill();\n  });\n\n  it(\"scales the shared tween by the configured track duration\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 2,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 100 },\n          ],\n        },\n      },\n    });\n    expect(timeline.duration).toBeCloseTo(2, 10);\n    expect(seam.created[0]?.duration()).toBeCloseTo(2, 10);\n    timeline.progress(0.9);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(100, 6);\n    timeline.kill();\n  });\n\n  it(\"holds every property independently when grids end at different positions\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.4, v: 40 },\n          ],\n        },\n        y: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.75, v: 75 },\n          ],\n        },\n      },\n    });\n    const x = (): number => readNumber(timeline.state, \"x\");\n    const y = (): number => readNumber(timeline.state, \"y\");\n    expect(timeline.duration).toBeCloseTo(1, 10);\n    timeline.progress(0.375);\n    expect(x()).toBeCloseTo(37.5, 6);\n    expect(y()).toBeCloseTo(37.5, 6);\n    timeline.progress(0.9);\n    expect(x()).toBeCloseTo(40, 6);\n    expect(y()).toBeCloseTo(75, 6);\n    timeline.kill();\n  });\n\n  it(\"reports the authored duration for a track with no authored stops\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({ duration: 3, keyframes: {} });\n    expect(timeline.duration).toBeCloseTo(3, 10);\n    timeline.kill();\n  });\n\n  it(\"uses one shared tween and never publishes GSAP bookkeeping\", () => {\n    const complete = createRealGsapSeam();\n    const completeTimeline = complete.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n    expect(complete.created[0]?.tweenCount()).toBe(1);\n    expect(completeTimeline.duration).toBeCloseTo(1, 10);\n\n    const short = createRealGsapSeam();\n    const shortTimeline = short.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 100 },\n          ],\n        },\n      },\n    });\n    expect(short.created[0]?.tweenCount()).toBe(1);\n    completeTimeline.progress(1);\n    shortTimeline.progress(1);\n    expect(authoredKeys(shortTimeline.state)).toEqual([\"x\"]);\n    expect(authoredKeys(shortTimeline.state)).toEqual(authoredKeys(completeTimeline.state));\n    expect(shortTimeline.state).not.toHaveProperty(\"authoredEnd\");\n    completeTimeline.kill();\n    shortTimeline.kill();\n  });\n});\n"},"packages/core/test/unit/domain/plugin-contribution-contract.test.ts":{"tests":[{"id":"87","name":"plugin contribution contract (X-3) passes the authored key, stops, and frozen track view to the contributor"},{"id":"88","name":"plugin contribution contract (X-3) preserves both keyframes and tweenVars from one explicit contribution"},{"id":"89","name":"plugin contribution contract (X-3) runs exactly one predicate owner instead of allowing last-write-wins"},{"id":"90","name":"plugin contribution contract (X-3) rejects malformed contributed stops instead of installing them"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport type { AuthoredStop } from \"../../../src/contract/v5\";\nimport type { ImmutableRecord } from \"../../../src/domain/values\";\nimport { PluginRegistry } from \"../../../src/domain/plugins\";\nconst stops = (value: number): { readonly stops: readonly AuthoredStop[] } => ({\n  stops: [\n    { p: 0, v: value },\n    { p: 1, v: value + 1 },\n  ],\n});\nconst compose = (values: Readonly<"+"ImmutableRecord>): ImmutableRecord => values;\ndescribe(\"plugin contribution contract (X-3)\", () => {\n  it(\"passes the authored key, stops, and frozen track view to the contributor\", () => {\n    const calls: unknown[] = [];\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"base\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: (key, authoredStops, track) => {\n        calls.push([key, authoredStops, track, Object.isFrozen(track)]);\n        return undefined;\n      },\n      compose,\n    });\n    registry.resolveForKeyframes({ x: stops(1) }, \"track.keyframes\", {\n      id: \"hero/arm\",\n      duration: 2,\n    });\n    expect(calls).toEqual([\n      [\n        \"x\",\n        [\n          { p: 0, v: 1 },\n          { p: 1, v: 2 },\n        ],\n        { id: \"hero/arm\", duration: 2 },\n        true,\n      ],\n    ]);\n  });\n  it(\"preserves both keyframes and tweenVars from one explicit contribution\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"derived\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({ keyframes: { derived: stops(4) }, tweenVars: { overwrite: \"auto\" } }),\n      compose,\n    });\n    registry.register({ name: \"derived-owner\", keys: [\"derived\"], compose });\n    const resolved = registry.resolveForKeyframes({ x: stops(1) });\n    expect(resolved.diagnostics).toEqual([]);\n    expect(resolved.preparation.keyframes).toEqual({ derived: stops(4) });\n    expect(resolved.preparation.tweenVars).toEqual({ overwrite: \"auto\" });\n  });\n  it(\"runs exactly one predicate owner instead of allowing last-write-wins\", () => {\n    const registry = new PluginRegistry();\n    const first = vi.fn(() => ({\n      keyframes: { derived: stops(1) },\n      tweenVars: { overwrite: \"auto\" },\n    }));\n    const second = vi.fn(() => ({\n      keyframes: { derived: stops(2) },\n      tweenVars: { overwrite: \"all\" },\n    }));\n    registry.register({\n      name: \"first\",\n      claimsKey: (key) => key === \"x\",\n      stage: \"prepare\",\n      contribute: first,\n      compose,\n    });\n    registry.register({\n      name: \"second\",\n      claimsKey: (key) => key === \"x\",\n      stage: \"prepare\",\n      contribute: second,\n      compose,\n    });\n    registry.register({ name: \"derived-owner\", keys: [\"derived\"], compose });\n    const resolved = registry.resolveForKeyframes({ x: stops(1) });\n    expect(resolved.diagnostics).toEqual([]);\n    expect(first).toHaveBeenCalledOnce();\n    expect(second).not.toHaveBeenCalled();\n    expect(resolved.preparation).toEqual({\n      keyframes: { derived: stops(1) },\n      tweenVars: { overwrite: \"auto\" },\n    });\n  });\n  it(\"rejects malformed contributed stops instead of installing them\", () => {\n    const registry = new PluginRegistry();\n    registry.register({\n      name: \"bad\",\n      keys: [\"x\"],\n      stage: \"prepare\",\n      contribute: () => ({\n        keyframes: {\n          derived: {\n            stops: [\n              { p: 0.8, v: 1 },\n              { p: 0.2, v: 2 },\n            ],\n          },\n        },\n      }),\n      compose,\n    });\n    registry.register({ name: \"derived-owner\", keys: [\"derived\"], compose });\n    const resolved = registry.resolveForKeyframes({ x: stops(1) });\n    expect(resolved.diagnostics.map(({ ruleId }) => ruleId)).toContain(\n      \"plugin-contribution-stop-order\",\n    );\n    expect(resolved.preparation.keyframes).toEqual({});\n  });\n});\n"},"packages/core/test/unit/runtime/scheduler-reentrancy.test.ts":{"tests":[{"id":"91","name":"scheduler-driven reentrancy (P1-7/P1-8) drains a subscriber invalidation with zero clock ticks"},{"id":"92","name":"scheduler-driven reentrancy (P1-7/P1-8) coalesces repeated invalidations into one scheduled follow-up"},{"id":"93","name":"scheduler-driven reentrancy (P1-7/P1-8) retries scheduling after a synchronous scheduler failure"},{"id":"94","name":"scheduler-driven reentrancy (P1-7/P1-8) does not expose the publisher as a second public reentrancy entry point"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../../src/contract/v5\";\nimport { createManualClock } from \"../../../src/ports/clock\";\nimport { createFakeScheduler } from \"../../../src/ports/fakes\";\nimport { GraphRuntime } from \"../../../src/runtime/graph-runtime\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] },\n    { id: \"caption\", trigger: { type: \"manual\" }, tracks: [{ id: \"label\" }] },\n  ],\n};\n\nconst compose = (node: { id: string }) => () => ({\n  values: { node: node.id },\n  sourceProgress: 0,\n  sourceRevisions: {},\n});\n\ndescribe(\"scheduler-driven reentrancy (P1-7/P1-8)\", () => {\n  it(\"drains a subscriber invalidation with zero clock ticks\", () => {\n    const clock = createManualClock();\n    const scheduler = createFakeScheduler();\n    const runtime = new GraphRuntime(project, clock, compose, { scheduler });\n    runtime.attach(\"hero/arm\");\n\n    let notifications = 0;\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      notifications += 1;\n      if (notifications === 1) runtime.invalidate([\"caption/label\"]);\n    });\n\n    clock.tick();\n    expect(runtime.pendingSeeds).toEqual([\"caption/label\"]);\n    expect(runtime.registry.get(\"caption/label\")).toBeUndefined();\n\n    scheduler.flush();\n\n    expect(runtime.pendingSeeds).toEqual([]);\n    expect(runtime.registry.get(\"caption/label\")?.values).toEqual({ node: \"caption/label\" });\n    expect(runtime.tick).toBe(1);\n    runtime.dispose();\n  });\n\n  it(\"coalesces repeated invalidations into one scheduled follow-up\", () => {\n    const clock = createManualClock();\n    const scheduler = createFakeScheduler();\n    const runtime = new GraphRuntime(project, clock, compose, { scheduler });\n    runtime.attach(\"hero/arm\");\n\n    let notifications = 0;\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      notifications += 1;\n      if (notifications !== 1) return;\n      runtime.invalidate([\"caption/label\"]);\n      runtime.invalidate([\"caption/label\"]);\n      runtime.invalidate([\"hero/arm\"]);\n    });\n\n    clock.tick();\n    expect(scheduler.pending).toHaveLength(1);\n    scheduler.flush();\n    expect(runtime.pendingSeeds).toEqual([]);\n    runtime.dispose();\n  });\n\n  it(\"retries scheduling after a synchronous scheduler failure\", () => {\n    const clock = createManualClock();\n    let attempts = 0;\n    const jobs: Array<"+"() => void> = [];\n    const scheduler = {\n      schedule(job: () => void) {\n        attempts += 1;\n        if (attempts === 1) throw new Error(\"scheduler unavailable\");\n        jobs.push(job);\n        return { cancel() {} };\n      },\n    };\n    const runtime = new GraphRuntime(project, clock, compose, { scheduler });\n    runtime.attach(\"hero/arm\");\n    const diagnostics: string[] = [];\n    runtime.registry.subscribeNode(\"hero/arm\", () => {\n      runtime.invalidate([\"caption/label\"]);\n      runtime.invalidate([\"caption/label\"]);\n    });\n\n    runtime.registry.subscribeBatch(() => undefined);\n    runtime.flush([\"hero/arm\"], 1);\n\n    expect(attempts).toBe(2);\n    expect(runtime.lastFlushError?.ruleId).toBe(\"scheduler-failure\");\n    jobs.splice(0).forEach((job) => job());\n    expect(runtime.pendingSeeds).toEqual([]);\n    expect(diagnostics).toEqual([]);\n    runtime.dispose();\n  });\n\n  it(\"does not expose the publisher as a second public reentrancy entry point\", () => {\n    const clock = createManualClock();\n    const scheduler = createFakeScheduler();\n    const runtime = new GraphRuntime(project, clock, compose, { scheduler });\n    expect((runtime as unknown as { publisher?: unknown }).publisher).toBeUndefined();\n    runtime.dispose();\n  });\n});\n"},"packages/core/test/unit/runtime/patch-registry-subscriber-errors.test.ts":{"tests":[{"id":"95","name":"PatchRegistry: subscriber error handling (recovery A2) a throwing node subscriber does not prevent other subscribers from being notified"},{"id":"96","name":"PatchRegistry: subscriber error handling (recovery A2) closeBatch always fully resets its internal state, even when a subscriber throws, so the next beginBatch succeeds"},{"id":"97","name":"PatchRegistry: subscriber error handling (recovery A2) the real caller's original error is not replaced by a recovery close attempt (GraphPublisher-shaped scenario)"},{"id":"98","name":"PatchRegistry: subscriber error handling (recovery A2) GraphPublisher.flush() surfaces the real subscriber error, not a masked 'No patch batch is open'"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { PatchRegistry } from \"../../../src/runtime/patch-registry\";\nimport { GraphPublisher, type PublisherNode } from \"../../../src/runtime/graph-publisher\";\nimport type { GraphIR } from \"../../../src/graph/ir\";\n\nconst soleNode = (id: string): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex: 0,\n    track: { id },\n    edges: Object.freeze([]),\n    compose: () => ({ values: { x: 1 }, sourceProgress: 0, sourceRevisions: {} }),\n  });\n\nconst soleSnapshot = (id: string): GraphIR & { nodes: readonly PublisherNode[] } => {\n  const node = soleNode(id);\n  return {\n    nodes: [node],\n    nodeById: Object.freeze({ [id]: node }),\n    order: Object.freeze([id]),\n    diagnostics: Object.freeze([]),\n  };\n};\n\ndescribe(\"PatchRegistry: subscriber error handling (recovery A2)\", () => {\n  it(\"a throwing node subscriber does not prevent other subscribers from being notified\", () => {\n    const registry = new PatchRegistry();\n    let secondCalled = false;\n    registry.subscribeNode(\"hero/arm\", () => {\n      throw new Error(\"boom from first subscriber\");\n    });\n    registry.subscribeNode(\"hero/arm\", () => {\n      secondCalled = true;\n    });\n\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.publish({ nodeId: \"hero/arm\", values: { x: 1 }, sourceProgress: 0, status: \"ready\" });\n\n    expect(() => registry.closeBatch()).toThrow(/boom from first subscriber/);\n    expect(secondCalled).toBe(true);\n  });\n\n  it(\"closeBatch always fully resets its internal state, even when a subscriber throws, so the next beginBatch succeeds\", () => {\n    const registry = new PatchRegistry();\n    registry.subscribeNode(\"hero/arm\", () => {\n      throw new Error(\"boom\");\n    });\n\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.publish({ nodeId: \"hero/arm\", values: { x: 1 }, sourceProgress: 0, status: \"ready\" });\n    expect(() => registry.closeBatch()).toThrow(/boom/);\n\n    // The registry must not be left thinking a batch is still open.\n    expect(() => registry.beginBatch(2, [\"hero/arm\"])).not.toThrow();\n  });\n\n  it(\"the real caller's original error is not replaced by a recovery close attempt (GraphPublisher-shaped scenario)\", () => {\n    const registry = new PatchRegistry();\n    registry.subscribeNode(\"hero/arm\", () => {\n      throw new Error(\"original subscriber failure\");\n    });\n\n    // Mirrors GraphPublisher.flush()'s try/catch shape: attempt to close, and on failure,\n    // attempt a recovery close before rethrowing.\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.publish({ nodeId: \"hero/arm\", values: { x: 1 }, sourceProgress: 0, status: \"ready\" });\n\n    let caught: unknown;\n    try {\n      registry.closeBatch();\n    } catch (error) {\n      try {\n        registry.closeBatch();\n      } catch {\n        // best-effort cleanup only; must never mask the original error below\n      }\n      caught = error;\n    }\n    expect((caught as Error)?.message).toBe(\"original subscriber failure\");\n  });\n\n  it(\"GraphPublisher.flush() surfaces the real subscriber error, not a masked 'No patch batch is open'\", () => {\n    const registry = new PatchRegistry();\n    registry.subscribeNode(\"hero/arm\", () => {\n      throw new Error(\"original subscriber failure\");\n    });\n    const publisher = new GraphPublisher(registry);\n\n    expect(() => publisher.flush(soleSnapshot(\"hero/arm\"), [\"hero/arm\"], 1)).toThrow(\n      /original subscriber failure/,\n    );\n\n    // And the registry must be usable again immediately afterward.\n    expect(() => publisher.flush(soleSnapshot(\"hero/arm\"), [], 2)).not.toThrow();\n  });\n});\n"},"packages/core/test/unit/domain/track.test.ts":{"tests":[{"id":"99","name":"Track leaf clamps progress and marks the leaf dirty only when progress changes"},{"id":"100","name":"Track leaf rejects non-finite progress and composes local values once per dirty state"},{"id":"101","name":"Track leaf recomposes a clean track when its inputs change"},{"id":"102","name":"Track leaf is a leaf with no composite or graph API"},{"id":"103","name":"Track leaf disposes once and rejects future work"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport { Track } from \"../../../src/domain/track\";\nimport type { ImmutableRecord } from \"../../../src/domain/values\";\n\nconst emptyPreparation = { keyframes: Object.freeze({}), tweenVars: Object.freeze({}) } as const;\nfunction createInterpolator() {\n  const progressCalls: number[] = [];\n  const timeline = {\n    duration: 1,\n    state: {} as Readonly<"+"Record<"+"string, unknown>>,\n    progress: (value?: number) => {\n      if (value !== undefined) progressCalls.push(value);\n      return 0;\n    },\n    kill: vi.fn(),\n  };\n  return { progressCalls, interpolator: { create: vi.fn(() => timeline) } };\n}\nfunction createPlugin(\n  name: string,\n  compose: (values: Readonly<"+"ImmutableRecord>, progress: number) => ImmutableRecord,\n) {\n  return { name, compose };\n}\nfunction plugins(...items: ReturnType<"+"typeof createPlugin>[]) {\n  return {\n    plugins: Object.freeze(items),\n    diagnostics: Object.freeze([]),\n    internalKeys: Object.freeze([]),\n    outputSerializers: Object.freeze({}),\n    preparation: emptyPreparation,\n  };\n}\n\ndescribe(\"Track leaf\", () => {\n  it(\"clamps progress and marks the leaf dirty only when progress changes\", () => {\n    const fake = createInterpolator();\n    const track = new Track({ interpolator: fake.interpolator });\n    expect(track.setProgress(2)).toBe(true);\n    expect(track.progress).toBe(1);\n    expect(track.setProgress(1)).toBe(false);\n    expect(fake.progressCalls).toEqual([1]);\n    expect(track.dirty).toBe(true);\n  });\n  it(\"rejects non-finite progress and composes local values once per dirty state\", () => {\n    const fake = createInterpolator();\n    const compose = vi.fn((values: Readonly<"+"ImmutableRecord>) => ({ ...values, opacity: 1 }));\n    const track = new Track({\n      interpolator: fake.interpolator,\n      plugins: plugins(createPlugin(\"opacity\", compose)),\n    });\n    expect(() => track.setProgress(Number.NaN)).toThrow(/finite/);\n    const first = track.compose({ x: 1 });\n    const second = track.compose({ x: 1 });\n    expect(second).toBe(first);\n    expect(compose).toHaveBeenCalledTimes(1);\n    expect(first.values).toEqual({ x: 1, opacity: 1 });\n  });\n  it(\"recomposes a clean track when its inputs change\", () => {\n    const fake = createInterpolator();\n    const compose = vi.fn((values: Readonly<"+"ImmutableRecord>) => ({ ...values }));\n    const track = new Track({\n      interpolator: fake.interpolator,\n      plugins: plugins(createPlugin(\"passthrough\", compose)),\n    });\n    const first = track.compose({ x: 1 });\n    const second = track.compose({ x: 2 });\n    expect(second).not.toBe(first);\n    expect(second.values).toEqual({ x: 2 });\n    expect(compose).toHaveBeenCalledTimes(2);\n  });\n  it(\"is a leaf with no composite or graph API\", () => {\n    const track = new Track({ interpolator: createInterpolator().interpolator });\n    expect(\"children\" in track).toBe(false);\n    expect(\"parent\" in track).toBe(false);\n    expect(\"play\" in track).toBe(false);\n    expect(\"observe\" in track).toBe(false);\n    expect(\"composeGraph\" in track).toBe(false);\n  });\n  it(\"disposes once and rejects future work\", () => {\n    const fake = createInterpolator();\n    const track = new Track({ interpolator: fake.interpolator });\n    track.dispose();\n    track.dispose();\n    expect(fake.interpolator.create().kill).toBeDefined();\n    expect(() => track.compose()).toThrow(/disposed/);\n    expect(() => track.setProgress(0.5)).toThrow(/disposed/);\n  });\n});\n"},"packages/core/test/integration/publisher-output-merge-consistency.test.ts":{"tests":[{"id":"104","name":"GraphPublisher: memo/registry consistency (recovery A1) a same-flush input-role consumer sees the source's merged flat value"},{"id":"105","name":"GraphPublisher: memo/registry consistency (recovery A1) a later flush resolves the source's merged flat value via registry fallback"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { GraphEdge, GraphIR } from \"../../src/graph/ir\";\nimport { PatchRegistry } from \"../../src/runtime/patch-registry\";\nimport { GraphPublisher, type PublisherNode } from \"../../src/runtime/graph-publisher\";\n\nconst node = (id: string, edges: GraphEdge[], compose: PublisherNode[\"compose\"]): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex: 0,\n    track: { id },\n    edges: Object.freeze(edges),\n    compose,\n  });\n\nconst snapshot = (\n  nodes: readonly PublisherNode[],\n): GraphIR & { nodes: readonly PublisherNode[] } => ({\n  nodes,\n  nodeById: Object.freeze(Object.fromEntries(nodes.map((n) => [n.id, n]))),\n  order: Object.freeze(nodes.map(({ id }) => id)),\n  diagnostics: Object.freeze([]),\n});\n\ndescribe(\"GraphPublisher: memo/registry consistency (recovery A1)\", () => {\n  it(\"a same-flush input-role consumer sees the source's merged flat value\", () => {\n    const nodes = [\n      node(\"overlaySource\", [], () => ({\n        values: { overlay: 99 },\n        sourceProgress: 0,\n        sourceRevisions: {},\n      })),\n      node(\n        \"sourceA\",\n        [{ observerId: \"sourceA\", sourceId: \"overlaySource\", role: \"output\" }],\n        () => ({ values: { base: 1 }, sourceProgress: 0, sourceRevisions: {} }),\n      ),\n      node(\n        \"downstream\",\n        [{ observerId: \"downstream\", sourceId: \"sourceA\", role: \"input\", target: \"fromA\" }],\n        (inputs) => ({ values: inputs, sourceProgress: 0, sourceRevisions: {} }),\n      ),\n    ];\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    const batch = publisher.flush(snapshot(nodes), [\"overlaySource\", \"sourceA\", \"downstream\"], 1);\n    const sourceAPatch = registry.get(\"sourceA\");\n    const downstreamPatch = batch.patches.find((p) => p.nodeId === \"downstream\");\n\n    expect(sourceAPatch?.values).toEqual({ base: 1, overlay: 99 });\n    expect(downstreamPatch?.values).toEqual({ base: 1, overlay: 99 });\n  });\n\n  it(\"a later flush resolves the source's merged flat value via registry fallback\", () => {\n    let downstreamCalls = 0;\n    const nodes = [\n      node(\"overlaySource\", [], () => ({\n        values: { overlay: 99 },\n        sourceProgress: 0,\n        sourceRevisions: {},\n      })),\n      node(\n        \"sourceA\",\n        [{ observerId: \"sourceA\", sourceId: \"overlaySource\", role: \"output\" }],\n        () => ({ values: { base: 1 }, sourceProgress: 0, sourceRevisions: {} }),\n      ),\n      node(\n        \"downstream\",\n        [{ observerId: \"downstream\", sourceId: \"sourceA\", role: \"input\", target: \"fromA\" }],\n        (inputs) => ({\n          values: { ...inputs, callCount: (downstreamCalls += 1) },\n          sourceProgress: 0,\n          sourceRevisions: {},\n        }),\n      ),\n    ];\n    const registry = new PatchRegistry();\n    const publisher = new GraphPublisher(registry);\n    publisher.flush(snapshot(nodes), [\"overlaySource\", \"sourceA\", \"downstream\"], 1);\n    expect(registry.get(\"sourceA\")?.values).toEqual({ base: 1, overlay: 99 });\n\n    const batch2 = publisher.flush(snapshot(nodes), [\"downstream\"], 2);\n    const downstreamPatch2 = batch2.patches.find((p) => p.nodeId === \"downstream\");\n    expect(downstreamPatch2?.values).toMatchObject({ base: 1, overlay: 99 });\n  });\n});\n"},"packages/core/test/contract/gsap-absolute-stops.test.ts":{"tests":[{"id":"106","name":"GSAP absolute multi-property stops (P0-3) uses one shared paused timeline with independent absolute grids"},{"id":"107","name":"GSAP absolute multi-property stops (P0-3) preserves authored easing without resampling a linear sibling"},{"id":"108","name":"GSAP absolute multi-property stops (P0-3) uses tweenVars ease when a stop does not override it"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createRealGsapSeam, readNumber } from \"../support/real-gsap\";\n\ndescribe(\"GSAP absolute multi-property stops (P0-3)\", () => {\n  it(\"uses one shared paused timeline with independent absolute grids\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 50 },\n            { p: 1, v: 100 },\n          ],\n        },\n        y: {\n          stops: [\n            { p: 0.2, v: 20 },\n            { p: 0.25, v: 25 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n\n    expect(seam.created).toHaveLength(1);\n    expect(seam.created[0]?.paused()).toBe(true);\n    expect(timeline.duration).toBeCloseTo(1, 6);\n    timeline.progress(0);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(0, 6);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(20, 6);\n    timeline.progress(0.2);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(20, 6);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(20, 6);\n    timeline.progress(0.25);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(25, 6);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(25, 6);\n    timeline.progress(0.5);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(50, 6);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(50, 6);\n    timeline.progress(1);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(100, 6);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(100, 6);\n    timeline.kill();\n  });\n\n  it(\"preserves authored easing without resampling a linear sibling\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 1,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.5, v: 100, ease: \"power2.out\" },\n            { p: 1, v: 100 },\n          ],\n        },\n        y: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 0.25, v: 25 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n\n    timeline.progress(0.25);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(87.5, 3);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(25, 3);\n    timeline.progress(0.5);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(100, 3);\n    expect(readNumber(timeline.state, \"y\")).toBeCloseTo(50, 3);\n    timeline.kill();\n  });\n\n  it(\"uses tweenVars ease when a stop does not override it\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 1,\n      tweenVars: { ease: \"power1.in\" },\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n\n    timeline.progress(0.5);\n    expect(readNumber(timeline.state, \"x\")).toBeCloseTo(25, 3);\n    timeline.kill();\n  });\n});\n"},"packages/core/test/unit/runtime/patch-registry.test.ts":{"tests":[{"id":"109","name":"PatchRegistry I-7 deeply freezes published patches and batches"},{"id":"110","name":"PatchRegistry I-8 suppresses unchanged republish and advances revisions only on change"},{"id":"111","name":"PatchRegistry I-6 notifies node subscribers before batch subscribers and safely snapshots listeners"},{"id":"112","name":"PatchRegistry does not notify subscribers for an unchanged publish"},{"id":"113","name":"PatchRegistry rejects opening a second empty batch and closing without an open batch"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { PatchRegistry } from \"../../../src/runtime/patch-registry\";\n\ndescribe(\"PatchRegistry\", () => {\n  it(\"I-7 deeply freezes published patches and batches\", () => {\n    const registry = new PatchRegistry();\n    registry.beginBatch(1, [\"hero/arm\"]);\n    const patch = registry.publish({\n      nodeId: \"hero/arm\",\n      values: { nested: { opacity: 1 } },\n      sourceProgress: 0.5,\n      status: \"ready\",\n    });\n    const batch = registry.closeBatch();\n    expect(patch).toBeDefined();\n    expect(Object.isFrozen(patch)).toBe(true);\n    expect(Object.isFrozen(patch?.values)).toBe(true);\n    expect(Object.isFrozen(patch?.values.nested as object)).toBe(true);\n    expect(Object.isFrozen(batch)).toBe(true);\n  });\n\n  it(\"I-8 suppresses unchanged republish and advances revisions only on change\", () => {\n    const registry = new PatchRegistry();\n    registry.beginBatch(1, [\"hero/arm\"]);\n    const first = registry.publish({\n      nodeId: \"hero/arm\",\n      values: { x: 1 },\n      sourceProgress: 0,\n      status: \"ready\",\n    });\n    registry.closeBatch();\n    registry.beginBatch(2, [\"hero/arm\"]);\n    const unchanged = registry.publish({\n      nodeId: \"hero/arm\",\n      values: { x: 1 },\n      sourceProgress: 0,\n      status: \"ready\",\n    });\n    const second = registry.publish({\n      nodeId: \"hero/arm\",\n      values: { x: 2 },\n      sourceProgress: 0,\n      status: \"ready\",\n    });\n    registry.closeBatch();\n    expect(first?.revision).toBe(1);\n    expect(unchanged).toBeUndefined();\n    expect(second?.revision).toBe(2);\n  });\n\n  it(\"I-6 notifies node subscribers before batch subscribers and safely snapshots listeners\", () => {\n    const registry = new PatchRegistry();\n    const events: string[] = [];\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.subscribeNode(\"hero/arm\", () => events.push(\"node\"));\n    registry.subscribeBatch(() => events.push(\"batch\"));\n    registry.publish({ nodeId: \"hero/arm\", values: {}, sourceProgress: 0, status: \"ready\" });\n    registry.closeBatch();\n    expect(events).toEqual([\"node\", \"batch\"]);\n  });\n\n  it(\"does not notify subscribers for an unchanged publish\", () => {\n    const registry = new PatchRegistry();\n    let count = 0;\n    registry.subscribeNode(\"hero/arm\", () => count++);\n    registry.beginBatch(1, [\"hero/arm\"]);\n    registry.publish({ nodeId: \"hero/arm\", values: {}, sourceProgress: 0, status: \"ready\" });\n    registry.closeBatch();\n    registry.beginBatch(2, [\"hero/arm\"]);\n    registry.publish({ nodeId: \"hero/arm\", values: {}, sourceProgress: 0, status: \"ready\" });\n    registry.closeBatch();\n    expect(count).toBe(1);\n  });\n\n  it(\"rejects opening a second empty batch and closing without an open batch\", () => {\n    const registry = new PatchRegistry();\n    registry.beginBatch(1, []);\n    expect(() => registry.beginBatch(2, [])).toThrow(\"already open\");\n    registry.closeBatch();\n    expect(() => registry.closeBatch()).toThrow(\"No patch batch is open\");\n  });\n});\n"},"packages/core/test/integration/graph-publisher.test.ts":{"tests":[{"id":"114","name":"GraphPublisher I-5 composes a shared ancestor once and publishes one whole batch"},{"id":"115","name":"GraphPublisher I-9 publishes an error and blocks the downstream closure while unrelated branches continue"},{"id":"116","name":"GraphPublisher does not expose topology mutation methods"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { GraphEdge, GraphIR } from \"../../src/graph/ir\";\nimport { PatchRegistry } from \"../../src/runtime/patch-registry\";\nimport { GraphPublisher, type PublisherNode } from \"../../src/runtime/graph-publisher\";\n\nconst makeNode = (\n  id: string,\n  authoredIndex: number,\n  sources: readonly string[],\n  compose: PublisherNode[\"compose\"],\n): PublisherNode => {\n  const edges: readonly GraphEdge[] = sources.map((sourceId) => ({\n    observerId: id,\n    sourceId,\n    role: \"output\",\n  }));\n  return Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex,\n    track: { id: id.split(\"/\")[1] ?? id },\n    edges: Object.freeze(edges),\n    compose,\n  });\n};\n\nconst snapshot = (\n  nodes: readonly PublisherNode[],\n): GraphIR & { nodes: readonly PublisherNode[] } => ({\n  nodes,\n  nodeById: Object.freeze(Object.fromEntries(nodes.map((node) => [node.id, node]))),\n  order: Object.freeze(nodes.map(({ id }) => id)),\n  diagnostics: Object.freeze([]),\n});\n\ndescribe(\"GraphPublisher\", () => {\n  it(\"I-5 composes a shared ancestor once and publishes one whole batch\", () => {\n    const calls = new Map<"+"string, number>();\n    const count = (id: string) => {\n      calls.set(id, (calls.get(id) ?? 0) + 1);\n      return { values: { id }, sourceProgress: 0.5, sourceRevisions: {} };\n    };\n    const nodes = [\n      makeNode(\"root\", 0, [], () => count(\"root\")),\n      makeNode(\"left\", 1, [\"root\"], () => count(\"left\")),\n      makeNode(\"right\", 2, [\"root\"], () => count(\"right\")),\n      makeNode(\"sink\", 3, [\"left\", \"right\"], () => count(\"sink\")),\n    ];\n    const registry = new PatchRegistry();\n    const events: string[] = [];\n    registry.subscribeBatch(() => events.push(\"batch\"));\n    const batch = new GraphPublisher(registry).flush(snapshot(nodes), [\"root\"], 1);\n    expect(calls).toEqual(\n      new Map([\n        [\"root\", 1],\n        [\"left\", 1],\n        [\"right\", 1],\n        [\"sink\", 1],\n      ]),\n    );\n    expect(batch.patches).toHaveLength(4);\n    expect(events).toEqual([\"batch\"]);\n  });\n\n  it(\"I-9 publishes an error and blocks the downstream closure while unrelated branches continue\", () => {\n    const nodes = [\n      makeNode(\"bad\", 0, [], () => {\n        throw new Error(\"boom\");\n      }),\n      makeNode(\"child\", 1, [\"bad\"], () => ({ values: {}, sourceProgress: 0, sourceRevisions: {} })),\n      makeNode(\"sibling\", 2, [], () => ({\n        values: { ok: true },\n        sourceProgress: 0,\n        sourceRevisions: {},\n      })),\n    ];\n    const registry = new PatchRegistry();\n    const batch = new GraphPublisher(registry).flush(snapshot(nodes), [\"bad\", \"sibling\"], 1);\n    expect(batch.patches.map(({ nodeId, status }) => [nodeId, status])).toEqual([\n      [\"bad\", \"error\"],\n      [\"child\", \"blocked\"],\n      [\"sibling\", \"ready\"],\n    ]);\n  });\n\n  it(\"does not expose topology mutation methods\", () => {\n    expect(Object.getOwnPropertyNames(GraphPublisher.prototype)).toEqual([\"constructor\", \"flush\"]);\n  });\n});\n"},"packages/core/test/contract/adapters.test.ts":{"tests":[{"id":"117","name":"adapter ports compiles authored stops onto an adapter-owned proxy state"},{"id":"118","name":"adapter ports adapts a GSAP-like paused timeline without leaking the engine object"},{"id":"119","name":"adapter ports ticks through an injected frame source and cancels on dispose"},{"id":"120","name":"adapter ports applies perspective once and never applies blocked patches"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createBrowserClock } from \"../../src/adapters/browser-clock\";\nimport { createDomPatchAdapter } from \"../../src/adapters/dom\";\nimport {\n  createGsapInterpolator,\n  type GsapTimelineLike,\n} from \"../../src/adapters/interpolator/gsap\";\nimport { createRealGsapSeam } from \"../support/real-gsap\";\n\ndescribe(\"adapter ports\", () => {\n  it(\"compiles authored stops onto an adapter-owned proxy state\", () => {\n    const seam = createRealGsapSeam();\n    const timeline = seam.interpolator.create({\n      duration: 2,\n      keyframes: {\n        x: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 1, v: 100 },\n          ],\n        },\n      },\n    });\n    expect(timeline.state).toMatchObject({ x: 0 });\n    timeline.progress(0.5);\n    expect(timeline.state).toMatchObject({ x: 50 });\n    timeline.kill();\n  });\n\n  it(\"adapts a GSAP-like paused timeline without leaking the engine object\", () => {\n    let value = 0;\n    let durationValue = 2;\n    let killed = false;\n    const timeline: GsapTimelineLike = {\n      duration(value?: number): number | GsapTimelineLike {\n        if (value === undefined) return durationValue;\n        durationValue = value;\n        return this;\n      },\n      progress(next?: number): number | GsapTimelineLike {\n        if (next === undefined) return value;\n        value = next;\n        return this;\n      },\n      to: () => timeline,\n      kill: () => {\n        killed = true;\n      },\n    } as GsapTimelineLike;\n    const interpolator = createGsapInterpolator({ timeline: () => timeline });\n    const adapted = interpolator.create({ duration: 2 });\n    expect(adapted.duration).toBe(2);\n    adapted.progress(0.5);\n    expect(adapted.progress()).toBe(0.5);\n    adapted.kill();\n    expect(killed).toBe(true);\n  });\n\n  it(\"ticks through an injected frame source and cancels on dispose\", () => {\n    const frames: ((time: number) => void)[] = [];\n    let cancelled = 0;\n    const clock = createBrowserClock({\n      requestFrame(listener) {\n        frames.push(listener);\n        return frames.length;\n      },\n      cancelFrame() {\n        cancelled += 1;\n      },\n    });\n    const ticks: number[] = [];\n    clock.subscribe(({ tick }) => ticks.push(tick));\n    frames.shift()?.(10);\n    expect(ticks).toEqual([1]);\n    clock.dispose();\n    expect(cancelled).toBe(1);\n  });\n\n  it(\"applies perspective once and never applies blocked patches\", () => {\n    const stage: { style: { perspective?: string }; opacity?: number } = { style: {} };\n    const adapter = createDomPatchAdapter(stage, 1200);\n    adapter.apply({\n      nodeId: \"hero/arm\",\n      revision: 1,\n      values: { opacity: 1 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n      status: \"blocked\",\n      diagnostics: [],\n    });\n    expect(stage.style.perspective).toBe(\"1200px\");\n    expect(stage.opacity).toBeUndefined();\n  });\n});\n"},"packages/core/test/integration/graph-rollback.test.ts":{"tests":[{"id":"121","name":"GraphBinding transactions I-2 applies a valid candidate and preserves one live state identity"},{"id":"122","name":"GraphBinding transactions I-2 rejects an invalid candidate before touching the active graph"},{"id":"123","name":"GraphBinding transactions I-2 restores every observable state after live-state apply fails"},{"id":"124","name":"GraphBinding transactions I-2 restores every observable state after publisher scheduling fails"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { ProjectDefinition } from \"../../src/contract/v5\";\nimport { GraphBinding, type GraphBindingHooks } from \"../../src/graph/binding\";\n\nconst project = (tracks: ProjectDefinition[\"motions\"][number][\"tracks\"]): ProjectDefinition => ({\n  schemaVersion: 5,\n  motions: [{ id: \"hero\", trigger: { type: \"manual\" }, tracks }],\n  freeTracks: [{ id: \"cursor\" }],\n});\n\nconst base = project([\n  { id: \"arm\", observes: [{ source: \"~/cursor\", role: \"input\", target: \"pointer\" }] },\n  { id: \"halo\", observes: [{ source: \"arm\" }] },\n]);\n\nconst changed = project([\n  { id: \"arm\", observes: [{ source: \"~/cursor\", role: \"input\", target: \"pointer\" }] },\n  { id: \"badge\", observes: [{ source: \"arm\" }] },\n]);\n\ndescribe(\"GraphBinding transactions\", () => {\n  it(\"I-2 applies a valid candidate and preserves one live state identity\", () => {\n    const binding = new GraphBinding(base);\n    const held = binding.state;\n\n    binding.replace(changed);\n\n    expect(binding.state).toBe(held);\n    expect(binding.graph.order).toEqual([\"~/cursor\", \"hero/arm\", \"hero/badge\"]);\n    expect(held.snapshot().nodes).toEqual([\"hero/arm\", \"hero/badge\", \"~/cursor\"]);\n    expect(held.hasNode(\"hero/halo\")).toBe(false);\n    expect(held.hasEdge({ observerId: \"hero/badge\", sourceId: \"hero/arm\", role: \"output\" })).toBe(\n      true,\n    );\n  });\n\n  it(\"I-2 rejects an invalid candidate before touching the active graph\", () => {\n    const binding = new GraphBinding(base);\n    const beforeGraph = binding.graph;\n    const beforeState = binding.state.snapshot();\n    const invalid = project([{ id: \"arm\", observes: [{ source: \"missing\" }] }]);\n\n    expect(() => binding.replace(invalid)).toThrow(TypeError);\n    expect(binding.graph).toBe(beforeGraph);\n    expect(binding.state.snapshot()).toEqual(beforeState);\n    expect(binding.state.journalLength).toBe(0);\n  });\n\n  it.each<"+"[string, GraphBindingHooks]>([\n    [\n      \"live-state apply\",\n      {\n        afterStateApply: () => {\n          throw new Error(\"state stage\");\n        },\n      },\n    ],\n    [\n      \"publisher scheduling\",\n      {\n        afterScheduleApply: () => {\n          throw new Error(\"schedule stage\");\n        },\n      },\n    ],\n  ])(\"I-2 restores every observable state after %s fails\", (_stage, hooks) => {\n    const binding = new GraphBinding(base, { hooks });\n    const beforeGraph = binding.graph;\n    const beforeState = binding.state.snapshot();\n    const held = binding.state;\n\n    expect(() => binding.replace(changed)).toThrow();\n    expect(binding.graph).toBe(beforeGraph);\n    expect(binding.state).toBe(held);\n    expect(binding.state.snapshot()).toEqual(beforeState);\n    expect(binding.state.journalLength).toBe(0);\n    expect(binding.state.hasNode(\"hero/halo\")).toBe(true);\n    expect(binding.state.hasNode(\"hero/badge\")).toBe(false);\n  });\n});\n"},"packages/core/test/integration/engine-load-validation.test.ts":{"tests":[{"id":"125","name":"Engine product-load validation (X-1 follow-up) rejects malformed authored stops before constructing a runtime"},{"id":"126","name":"Engine product-load validation (X-1 follow-up) rejects malformed authored stops before any timeline is created"},{"id":"127","name":"Engine product-load validation (X-1 follow-up) resolves authored plugin ownership during load, not on the first seek"},{"id":"128","name":"Engine product-load validation (X-1 follow-up) accepts a valid project and creates its timelines during load"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport { PluginRegistry } from \"../../src/domain/plugins\";\nimport { Engine } from \"../../src/engine\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../src/ports/fakes\";\n\nconst options = () => ({\n  clock: createManualClock(),\n  interpolator: createFakeInterpolator(),\n  scheduler: createFakeScheduler(),\n});\n\nconst projectWith = (keyframes: unknown) => ({\n  schemaVersion: 5,\n  motions: [\n    {\n      id: \"hero\",\n      trigger: { type: \"manual\" },\n      tracks: [{ id: \"arm\", keyframes }],\n    },\n  ],\n});\n\ndescribe(\"Engine product-load validation (X-1 follow-up)\", () => {\n  it(\"rejects malformed authored stops before constructing a runtime\", () => {\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    const engine = new Engine({ ...options(), interpolator });\n    const invalid = projectWith({ opacity: { stops: [{ p: Number.NaN, v: 1 }] } });\n\n    expect(() => engine.load(invalid as never)).toThrow(/stop-position/);\n    expect(create).not.toHaveBeenCalled();\n  });\n\n  it(\"rejects malformed authored stops before any timeline is created\", () => {\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    const engine = new Engine({ ...options(), interpolator });\n    const invalid = projectWith({\n      opacity: {\n        stops: [\n          { p: 0.8, v: 0 },\n          { p: 0.2, v: 1 },\n        ],\n      },\n    });\n\n    expect(() => engine.load(invalid as never)).toThrow(/stop-position-order/);\n    expect(create).not.toHaveBeenCalled();\n  });\n\n  it(\"resolves authored plugin ownership during load, not on the first seek\", () => {\n    const plugins = new PluginRegistry();\n    plugins.register({\n      name: \"opacity\",\n      keys: [\"opacity\"],\n      compose: (values) => values,\n    });\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    const engine = new Engine({ ...options(), interpolator, plugins });\n\n    expect(() =>\n      engine.load(projectWith({ unknown: { stops: [{ p: 0, v: 0 }] } }) as never),\n    ).toThrow(/plugin-unknown-key/);\n    expect(create).not.toHaveBeenCalled();\n  });\n\n  it(\"accepts a valid project and creates its timelines during load\", () => {\n    const interpolator = createFakeInterpolator();\n    const create = vi.spyOn(interpolator, \"create\");\n    const engine = new Engine({ ...options(), interpolator });\n\n    const runtime = engine.load(\n      projectWith({\n        opacity: {\n          stops: [\n            { p: 0, v: 0 },\n            { p: 1, v: 1 },\n          ],\n        },\n      }) as never,\n    );\n    expect(create).toHaveBeenCalledTimes(1);\n    runtime.dispose();\n  });\n});\n"},"packages/core/test/unit/domain/motion.test.ts":{"tests":[{"id":"129","name":"Motion composite preserves authored order and computes deterministic stagger offsets"},{"id":"130","name":"Motion composite plays through one clock subscription and scheduler jobs"},{"id":"131","name":"Motion composite converts clock time into normalized progress using authored duration"},{"id":"132","name":"Motion composite pausing detaches the clock and play resubscribes without duplicate work"},{"id":"133","name":"Motion composite clamps seek and rejects non-finite values"},{"id":"134","name":"Motion composite pauses and disposes owner-first without leaking clock work"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { createFakeInterpolator, createFakeScheduler } from \"../../../src/ports/fakes\";\nimport { createManualClock } from \"../../../src/ports/clock\";\nimport { Motion } from \"../../../src/domain/motion\";\nimport { Track } from \"../../../src/domain/track\";\n\nfunction createMotion(stagger = 0, duration?: number) {\n  const clock = createManualClock();\n  const scheduler = createFakeScheduler();\n  const interpolator = createFakeInterpolator();\n  const tracks = [0, 1, 2].map((index) => ({\n    id: `track-${index}`,\n    track: new Track({ interpolator }),\n    ...(duration === undefined ? {} : { duration }),\n  }));\n  return { clock, scheduler, motion: new Motion({ clock, scheduler, tracks, stagger }), tracks };\n}\n\ndescribe(\"Motion composite\", () => {\n  it(\"preserves authored order and computes deterministic stagger offsets\", () => {\n    const { motion } = createMotion(0.08);\n    expect(motion.tracks.map(({ id }) => id)).toEqual([\"track-0\", \"track-1\", \"track-2\"]);\n    expect(motion.schedule()).toEqual([0, 0.08, 0.16]);\n  });\n  it(\"plays through one clock subscription and scheduler jobs\", () => {\n    const { clock, scheduler, motion, tracks } = createMotion();\n    motion.play();\n    clock.tick(0.25);\n    expect(scheduler.pending).toHaveLength(1);\n    scheduler.flush();\n    expect(tracks[0]?.track.progress).toBe(0.25);\n    expect(tracks[1]?.track.progress).toBe(0.25);\n  });\n  it(\"converts clock time into normalized progress using authored duration\", () => {\n    const { clock, scheduler, motion, tracks } = createMotion(0, 2);\n    motion.play();\n    clock.tick(0.5);\n    scheduler.flush();\n    expect(tracks[0]?.track.progress).toBe(0.25);\n  });\n  it(\"pausing detaches the clock and play resubscribes without duplicate work\", () => {\n    const { clock, scheduler, motion, tracks } = createMotion();\n    motion.play();\n    motion.pause();\n    motion.play();\n    clock.tick(0.25);\n    expect(scheduler.pending).toHaveLength(1);\n    scheduler.flush();\n    expect(tracks[0]?.track.progress).toBe(0.25);\n  });\n  it(\"clamps seek and rejects non-finite values\", () => {\n    const { motion, tracks } = createMotion();\n    motion.seek(2);\n    expect(tracks[0]?.track.progress).toBe(1);\n    expect(() => motion.seek(Number.POSITIVE_INFINITY)).toThrow(/finite/);\n  });\n  it(\"pauses and disposes owner-first without leaking clock work\", () => {\n    const { clock, motion, tracks } = createMotion();\n    motion.play();\n    motion.pause();\n    clock.tick(0.5);\n    expect(tracks[0]?.track.progress).toBe(0);\n    motion.dispose();\n    expect(\n      tracks.every(({ track }) => {\n        try {\n          track.compose();\n          return false;\n        } catch {\n          return true;\n        }\n      }),\n    ).toBe(true);\n  });\n});\n"},"packages/core/test/integration/graph-runtime.test.ts":{"tests":[{"id":"135","name":"GraphRuntime I-13 owns one registry, one state, and one clock subscription"},{"id":"136","name":"GraphRuntime P1-8 keeps the publisher off the public runtime surface"},{"id":"137","name":"GraphRuntime I-13 keeps ticks monotonic across detach and reattach"},{"id":"138","name":"GraphRuntime publishes only attached seeds and stops after disposal"}],"source":"import { describe, expect, it, vi } from \"vitest\";\nimport type { ProjectDefinition } from \"../../src/contract/v5\";\nimport { createManualClock } from \"../../src/ports/clock\";\nimport { GraphRuntime } from \"../../src/runtime/graph-runtime\";\n\nconst project: ProjectDefinition = {\n  schemaVersion: 5,\n  motions: [\n    { id: \"hero\", trigger: { type: \"manual\" }, tracks: [{ id: \"arm\" }] },\n    { id: \"caption\", trigger: { type: \"manual\" }, tracks: [{ id: \"label\" }] },\n  ],\n  freeTracks: [{ id: \"cursor\" }],\n};\n\nconst compose = (node: { id: string }) => () => ({\n  values: { node: node.id },\n  sourceProgress: 0,\n  sourceRevisions: {},\n});\n\ndescribe(\"GraphRuntime\", () => {\n  it(\"I-13 owns one registry, one state, and one clock subscription\", () => {\n    const clock = createManualClock();\n    // The spy has to exist before construction. Installing it afterwards can only prove that\n    // nothing subscribed later, which is not the invariant being claimed here.\n    const subscribe = vi.spyOn(clock, \"subscribe\");\n\n    const runtime = new GraphRuntime(project, clock, compose);\n\n    expect(subscribe).toHaveBeenCalledTimes(1);\n    expect(runtime.registry).toBe(runtime.registry);\n    expect(runtime.state).toBe(runtime.binding.state);\n    runtime.dispose();\n  });\n\n  it(\"P1-8 keeps the publisher off the public runtime surface\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, compose);\n\n    expect((runtime as unknown as { publisher?: unknown }).publisher).toBeUndefined();\n    runtime.dispose();\n  });\n\n  it(\"I-13 keeps ticks monotonic across detach and reattach\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, compose);\n    runtime.attach(\"hero/arm\");\n    const batches: number[] = [];\n    runtime.registry.subscribeBatch((batch) => batches.push(batch.tick));\n\n    clock.tick(0.1);\n    runtime.detach(\"hero/arm\");\n    clock.tick(0.1);\n    runtime.attach(\"hero/arm\");\n    clock.tick(0.1);\n\n    expect(runtime.tick).toBe(3);\n    expect(batches).toEqual([1, 2, 3]);\n    runtime.dispose();\n  });\n\n  it(\"publishes only attached seeds and stops after disposal\", () => {\n    const clock = createManualClock();\n    const runtime = new GraphRuntime(project, clock, compose);\n    runtime.attach(\"hero/arm\");\n    runtime.attach(\"~/cursor\");\n    const seen: (readonly string[])[] = [];\n    runtime.registry.subscribeBatch((batch) => seen.push(batch.seeds));\n\n    clock.tick();\n    expect(seen).toEqual([[\"hero/arm\", \"~/cursor\"]]);\n\n    runtime.detach(\"~/cursor\");\n    clock.tick();\n    expect(seen).toEqual([[\"hero/arm\", \"~/cursor\"], [\"hero/arm\"]]);\n\n    runtime.dispose();\n    expect(() => clock.tick()).not.toThrow();\n    expect(seen).toHaveLength(2);\n  });\n});\n"},"packages/core/test/integration/flush-output-merge.test.ts":{"tests":[{"id":"139","name":"GraphPublisher output edges merges output source values over the composed patch"},{"id":"140","name":"GraphPublisher output edges uses canonical edge order when output sources collide"}],"source":"import { describe, expect, it } from \"vitest\";\nimport type { GraphEdge, GraphIR } from \"../../src/graph/ir\";\nimport { edgeKey } from \"../../src/graph/ir\";\nimport { GraphPublisher, type PublisherNode } from \"../../src/runtime/graph-publisher\";\nimport { PatchRegistry } from \"../../src/runtime/patch-registry\";\n\nconst snapshot = (\n  nodes: readonly PublisherNode[],\n): GraphIR & { nodes: readonly PublisherNode[] } => ({\n  nodes,\n  nodeById: Object.freeze(Object.fromEntries(nodes.map((node) => [node.id, node]))),\n  order: Object.freeze(nodes.map(({ id }) => id)),\n  diagnostics: Object.freeze([]),\n});\n\nconst node = (\n  id: string,\n  authoredIndex: number,\n  edges: readonly GraphEdge[],\n  compose: PublisherNode[\"compose\"],\n): PublisherNode =>\n  Object.freeze({\n    id,\n    owner: \"motion\",\n    authoredIndex,\n    track: { id },\n    edges: Object.freeze(edges),\n    compose,\n  });\n\ndescribe(\"GraphPublisher output edges\", () => {\n  it(\"merges output source values over the composed patch\", () => {\n    const registry = new PatchRegistry();\n    const source = node(\"source\", 0, [], () => ({\n      values: { opacity: 0.5 },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const observer = node(\n      \"observer\",\n      1,\n      [{ observerId: \"observer\", sourceId: \"source\", role: \"output\" }],\n      () => ({ values: { x: 10 }, sourceProgress: 0, sourceRevisions: {} }),\n    );\n    const batch = new GraphPublisher(registry).flush(snapshot([source, observer]), [\"source\"], 1);\n    expect(batch.patches.find(({ nodeId }) => nodeId === \"observer\")?.values).toEqual({\n      opacity: 0.5,\n      x: 10,\n    });\n  });\n\n  it(\"uses canonical edge order when output sources collide\", () => {\n    const registry = new PatchRegistry();\n    const sourceA = node(\"a\", 0, [], () => ({\n      values: { color: \"a\" },\n      sourceProgress: 0,\n      sourceRevisions: {},\n    }));\n    const sourceB = node(\"b\", 1, [], () => ({\n      values: { color: \"b\" },\n      sourcePr
