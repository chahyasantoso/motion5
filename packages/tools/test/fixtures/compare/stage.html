<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #frame {
        position: relative;
        width: 200px;
        height: 100px;
        background: #fff;
        transform-origin: 0 0;
        overflow: hidden;
      }
      [data-cast] {
        position: absolute;
        width: 40px;
        height: 40px;
        top: 30px;
      }
      [data-cast="red"] {
        left: 10px;
        background: #d00;
      }
      [data-cast="green"] {
        left: 80px;
        background: #0a0;
      }
      [data-cast="blue"] {
        left: 150px;
        background: #00d;
      }
    </style>
  </head>
  <body>
    <div id="frame" data-gerak-frame>
      <div data-cast="red"></div>
      <div data-cast="green"></div>
      <div data-cast="blue"></div>
    </div>
    <script>
      const frame = document.getElementById("frame");
      frame.style.transform = `scale(${Math.min(innerWidth / 200, innerHeight / 100)})`;
    </script>
  </body>
</html>
